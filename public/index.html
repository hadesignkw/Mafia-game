<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<title>غرفة المافيا</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* لوحة واحدة بعرض الجوال، والليل والنهار يغيّرون لون الخلفية */
:root{
  --bg:#0f1217;--panel:#181d25;--panel2:#202733;--line:#2c3441;
  --fg:#ece6d6;--muted:#9b978b;--brass:#d2a74c;--brass-ink:#1b1408;
  --blood:#cf5c55;--town:#72b096;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body[data-phase="night"]{--bg:#07090d;--panel:#10141b;--panel2:#161c25;--line:#222a35}
body[data-phase="day"]{--bg:#17130e;--panel:#221c14;--panel2:#2b241a;--line:#3b3225}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;transition:background .9s ease;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:2.4rem;color:var(--brass)}
h2{font-size:1.35rem}
h3{font-size:1.02rem;color:var(--muted);font-weight:500}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.86rem}.err{color:var(--blood)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.code{font-family:var(--display);font-size:1.1rem;letter-spacing:.15em;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.m{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 45%,transparent)}
.chip.t{color:var(--town);border-color:color-mix(in srgb,var(--town) 45%,transparent)}
.chip.b{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:background .9s ease,border-color .9s ease}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:center;transition:transform .12s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.ghost{background:transparent}.btn.danger{color:var(--blood)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.pick:focus-visible,input:focus-visible,.flip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 140px}
input{font:inherit;font-size:1.1rem;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input.big{font-family:var(--display);font-size:2.2rem;text-align:center;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{font:inherit;font-weight:500;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere;transition:transform .12s ease,background .2s ease}
.pick:active{transform:scale(.96)}
.pick.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700;animation:pop .3s ease}
.pick.red.on{background:var(--blood);border-color:var(--blood);color:#fff}
@keyframes pop{50%{transform:scale(1.06)}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.li.out .nm{color:var(--muted);text-decoration:line-through}
.li.speak{background:color-mix(in srgb,var(--brass) 14%,transparent);border-radius:10px;padding-inline:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--blood)}
.dot.on{background:var(--town);box-shadow:0 0 0 3px color-mix(in srgb,var(--town) 25%,transparent)}
.announce{font-family:var(--display);font-size:1.22rem;line-height:1.5;border-inline-start:3px solid var(--brass);padding-inline-start:12px}
.script{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:1.05rem}
.script b{color:var(--brass)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--muted)}
.steps span.cur{background:var(--brass);color:var(--brass-ink);font-weight:700}
.steps span.done{color:var(--town)}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tally{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brass)}
.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.notes li{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.95rem}
.sep{height:1px;background:var(--line)}
.conn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:40;background:var(--blood);color:#fff;text-align:center;border-radius:10px;padding:6px 10px;font-size:.9rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center;z-index:60;animation:rise .25s ease}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

/* ---------- المؤقت ---------- */
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brass);color:var(--brass-ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 28px rgb(0 0 0 / .4)}
.timer.end{background:var(--blood);color:#fff;animation:shake .5s ease 2}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:color-mix(in srgb,currentColor 22%,transparent)}
.ring .fgc{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.timer .who{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere;min-width:0;flex:1}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- الكرت ---------- */
.flip{perspective:1200px;border:0;background:none;padding:0;width:100%;cursor:pointer;font:inherit;color:inherit;text-align:inherit}
.flip-in{position:relative;display:grid;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);min-height:260px;display:flex;flex-direction:column;gap:8px;padding:22px 18px}
.face.back{align-items:center;justify-content:center;text-align:center;background:
  radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--brass) 30%,transparent) 0 42px,transparent 43px),
  repeating-linear-gradient(45deg,#1a1f28 0 9px,#141820 9px 18px);box-shadow:inset 0 0 0 6px #141820,inset 0 0 0 7px color-mix(in srgb,var(--brass) 50%,transparent)}
.face.back .emb{width:64px;height:64px;color:var(--brass)}
.face.front{transform:rotateY(180deg);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%),var(--panel)}
.face .rn{font-family:var(--display);font-size:2.2rem;color:var(--accent);line-height:1.2}
.face .ico{width:56px;height:56px;color:var(--accent);flex:none}
.ico svg,.emb svg{width:100%;height:100%;display:block}
.deal .flip-in{animation:deal .9s cubic-bezier(.2,.9,.2,1)}
@keyframes deal{from{transform:translateY(-60vh) rotate(-25deg) scale(.6);opacity:0}70%{transform:translateY(8px) rotate(2deg)}}
.hint{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* ---------- الليل ---------- */
.nightbox{text-align:center;padding:36px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;overflow:hidden}
.moon{width:70px;height:70px;border-radius:50%;box-shadow:-14px 8px 0 0 var(--brass);transform:rotate(-20deg);animation:float 5s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}

/* ---------- الحركات الكبيرة ---------- */
#fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:24px}
#fx .fx-in{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px}
#fx .big{font-family:var(--display);font-size:clamp(2.6rem,12vw,4.6rem);line-height:1.1}
#fx .sub{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
#fx .tap{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:.85rem;opacity:.6;z-index:2}
#fx canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.fx-enter{animation:fxin .45s ease both}
@keyframes fxin{from{opacity:0}}
.fx-leave{animation:fxout .4s ease both}
@keyframes fxout{to{opacity:0}}
/* الليل يطيح */
.fx-dusk{background:radial-gradient(circle at 50% 120%,#1c2b4a,#05070c 70%);color:#dfe6f5}
.fx-dusk .moonbig{width:120px;height:120px;border-radius:50%;box-shadow:-24px 14px 0 0 #f1d48a;transform:rotate(-20deg);animation:moonup 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes moonup{from{translate:0 60vh;opacity:0}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 1.6s ease-in-out infinite alternate;z-index:1}
@keyframes tw{from{opacity:.1}to{opacity:1}}
/* الصبح */
.fx-dawn{background:radial-gradient(circle at 50% 110%,#f2b45a,#7b3d1d 45%,#1a1009 80%);color:#fff4df}
.fx-dawn .sun{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#ffe7a6,#f4b24c);box-shadow:0 0 80px 30px rgb(244 178 76 / .55);animation:sunup 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunup{from{translate:0 50vh}}
/* اغتيال */
.fx-kill{background:radial-gradient(circle at 50% 45%,#5a0f0f,#120405 70%);color:#fff;animation:flash .5s ease}
@keyframes flash{0%{background:#ff3b30}}
.fx-kill .slash{position:absolute;inset:0;z-index:1}
.fx-kill .slash path{stroke:#ff5b4f;stroke-width:10;fill:none;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:cut .35s .25s ease-out forwards;filter:drop-shadow(0 0 12px #ff3b30)}
@keyframes cut{to{stroke-dashoffset:0}}
.fx-kill .big{animation:slam .5s .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.4);opacity:0}}
.fx-kill .sub{animation:fxin .4s .9s both}
/* الإنقاذ */
.fx-saved{background:radial-gradient(circle at 50% 45%,#0f3b31,#04110e 70%);color:#e9fff8}
.fx-saved .ecg{width:min(320px,80vw);height:90px}
.fx-saved .ecg path{fill:none;stroke:#7fe0bf;stroke-width:4;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:cut 1.2s ease-out forwards;filter:drop-shadow(0 0 8px #7fe0bf)}
.fx-saved .cross{width:90px;height:90px;color:#7fe0bf;animation:beat 1s .6s ease-in-out 2}
@keyframes beat{30%{transform:scale(1.18)}60%{transform:scale(.96)}}
/* طلع بالتصويت */
.fx-out{background:radial-gradient(circle at 50% 45%,#3a2a12,#0d0904 72%);color:#fff2d8}
.fx-out .stamp{font-family:var(--display);font-size:clamp(3rem,15vw,5.5rem);color:#e0b057;border:6px solid #e0b057;border-radius:14px;padding:0 22px;transform:rotate(-8deg);animation:stamp .5s .2s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(3);opacity:0}}
.fx-out.hit{animation:shake .35s .55s ease}
/* تعادل */
.fx-tie{background:radial-gradient(circle at 50% 45%,#262c38,#090b0f 72%);color:#e6e9ef}
.fx-tie .scale{width:120px;height:90px;color:var(--brass);animation:sway 1.4s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
/* القناص */
.fx-snipe{background:#070809;color:#fff}
.fx-snipe .cross-h{width:min(280px,70vw);height:min(280px,70vw);color:#ff5b4f;animation:aim 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes aim{from{transform:scale(3) rotate(40deg);opacity:0}80%{transform:scale(.95)}}
.fx-snipe .who{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;animation:fxin .3s 1s both}
/* الفوز */
.fx-win-town{background:radial-gradient(circle at 50% 40%,#2c4a3c,#0a1310 72%);color:#f4ffef}
.fx-win-mafia{background:radial-gradient(circle at 50% 40%,#4a1214,#0b0304 72%);color:#ffe9e6}
.fx-win .big{animation:slam .7s .2s cubic-bezier(.2,1.5,.4,1) both}
.fx-win .crown{width:110px;height:90px;animation:drop 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{translate:0 -60vh}}
/* توزيع */
.fx-deal{background:radial-gradient(circle at 50% 50%,#2a2214,#0b0906 72%);color:#f6ead0}
.fan{position:relative;width:200px;height:150px}
.fan i{position:absolute;inset-inline-start:70px;top:10px;width:64px;height:96px;border-radius:9px;background:repeating-linear-gradient(45deg,#1a1f28 0 6px,#141820 6px 12px);border:2px solid #d2a74c;transform-origin:50% 120%;animation:fanout .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes fanout{from{transform:rotate(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div><h1>غرفة المافيا</h1><p class="muted">لحظة…</p></div>
</div>
<div class="conn" id="conn" hidden>انقطع الاتصال، قاعد يرجع يتصل…</div>
<div class="toast" id="toast" hidden></div>
<div id="fx" hidden></div>

<script>
"use strict";
/* ---------- القواعد للعرض ---------- */
const ROLE={
  leader:{n:"زعيم المافيا",team:"m",d:"أنت من المافيا وقرار الاغتيال بيدك. بأول ليلة تختار الشرطي المزيف (تقدر تختار نفسك)."},
  mafia:{n:"مافيا",team:"m",d:"أنت من المافيا. تعرف ربعك وتغتالون واحد كل ليلة، وإذا اختلفتوا الزعيم يقرر."},
  cop:{n:"الشرطي الحقيقي",team:"t",d:"أنت من الشعب. كل ليلة تستعلم عن شخص ويطلع لك: مافيا ولا شعب."},
  doctor:{n:"الطبيب",team:"t",d:"أنت من الشعب. كل ليلة تنقذ واحد من الاغتيال، حتى نفسك، وتقدر تكرر نفس الشخص."},
  sniper:{n:"القناص",team:"t",d:"أنت من الشعب. إذا طلعت بالتصويت أو اغتالوك، تسحب واحد وياك وتعرف دوره أنت والقاضي بس."},
  citizen:{n:"مواطن",team:"t",d:"أنت من الشعب. ما عندك قدرة، سلاحك كلامك وتصويتك."}
};
const isM=r=>r==="leader"||r==="mafia";
const STEPS=["mafia","doctor","police"];
const STEP_N={mafia:"المافيا",doctor:"الطبيب",police:"الشرطي"};
const PHASE_N={lobby:"الانتظار",night0:"الليلة الأولى",night:"الليل",day:"النهار",vote:"التصويت",result:"نتيجة التصويت",over:"انتهت اللعبة"};
const ICON={
  leader:'<svg viewBox="0 0 64 64" fill="currentColor"><path d="M8 46 4 18l16 12L32 10l12 20 16-12-4 28z"/><rect x="8" y="50" width="48" height="6" rx="2"/></svg>',
  mafia:'<svg viewBox="0 0 64 64" fill="currentColor"><path d="M4 26c8-6 18-8 28-8s20 2 28 8c-2 14-10 22-18 22-5 0-7-6-10-6s-5 6-10 6C14 48 6 40 4 26zm14 4c-3 0-6 2-7 4 3 2 6 3 9 3s5-2 5-4-3-3-7-3zm28 0c-4 0-7 1-7 3s2 4 5 4 6-1 9-3c-1-2-4-4-7-4z"/></svg>',
  cop:'<svg viewBox="0 0 64 64" fill="currentColor"><path d="M32 4 8 12v18c0 15 10 26 24 30 14-4 24-15 24-30V12zm0 14 4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z"/></svg>',
  doctor:'<svg viewBox="0 0 64 64" fill="currentColor"><path d="M24 6h16v18h18v16H40v18H24V40H6V24h18z"/></svg>',
  sniper:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5"><circle cx="32" cy="32" r="20"/><path d="M32 2v18M32 44v18M2 32h18M44 32h18"/><circle cx="32" cy="32" r="3" fill="currentColor"/></svg>',
  citizen:'<svg viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="18" r="11"/><path d="M10 58c0-13 10-22 22-22s22 9 22 22z"/></svg>',
  emblem:'<svg viewBox="0 0 64 64" fill="currentColor"><path d="M10 40h44l-4 6H14zM18 38c0-10 6-18 14-18s14 8 14 18zM22 20h20l-2-8H24z"/></svg>'
};

/* ---------- أدوات ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const en=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3400)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};

/* ---------- الحالة ---------- */
let sess=lsGet("mafia.sess"); // {code, token, judge}
let view="home", st=null, ws=null, offset=0, lastEv=null, firstState=true, retry=0, homeErr="", busy=false;
let cardOpen=false, dealAnim=false, lastGen=null;

/* ---------- الاتصال ---------- */
function connect(){
  if(!sess||!sess.code)return;
  try{ws&&ws.close()}catch{}
  const proto=location.protocol==="https:"?"wss":"ws";
  const sock=new WebSocket(`${proto}://${location.host}/api/ws?code=${sess.code}`);ws=sock;
  sock.onopen=()=>{retry=0;$("#conn").hidden=true;sock.send(JSON.stringify({t:"hello",token:sess.token||null}))};
  sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}onMsg(m)};
  sock.onclose=()=>{if(ws!==sock||!sess)return;$("#conn").hidden=view!=="game";retry++;setTimeout(()=>{if(ws===sock&&sess)connect()},Math.min(8000,700*retry))};
}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"t":"ping"}')},25000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sess&&(!ws||ws.readyState>1))connect()});
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast("ما في اتصال، لحظة ويرجع.")}

function onMsg(m){
  if(m.t==="need-name"){if(sess&&sess.judge){endSession("الغرفة انتهت.");return}view="name";render();return}
  if(m.t==="joined"){sess.token=m.token;lsSet("mafia.sess",sess);return}
  if(m.t==="error"){toast(m.text);return}
  if(m.t==="kicked"){endSession("القاضي شالك من الغرفة.");return}
  if(m.t==="gone"){endSession("الغرفة انتهت.");return}
  if(m.t==="state"){
    offset=m.now-Date.now();
    const prev=st;st=m;view="game";
    if(st.me&&st.gen!==lastGen){if(lastGen!==null||st.phase==="night0")cardOpen=false;lastGen=st.gen}
    handleEvent(prev);
    render();
  }
}
function endSession(msg){sess=null;lsSet("mafia.sess",null);try{ws&&ws.close()}catch{}ws=null;st=null;view="home";homeErr=msg;render()}

    sess={code:j.code,token:j.token,judge:true};lsSet("mafia.sess",sess);firstState=true;connect();}

}
async function joinCode(c){

  if(!/^\d{4}$/.test(c)){homeErr="رقم الغرفة ٤ أرقام.";return render()}
  busy=true;render();

    if(!j.ok){homeErr="ما لقيت غرفة بهالرقم، تأكد من القاضي.";busy=false;return render()}}

const fxQ=[];let fxBusy=false,fxTimer=null,confettiStop=null;
function handleEvent(prev){
  const e=st.event;
  if(!e){lastEv=null;firstState=false;return}
  if(e.id===lastEv){firstState=false;return}
  const fresh=st.now-e.at<7000;
  lastEv=e.id;
  if(firstState&&!fresh){firstState=false;return}
  firstState=false;
  if(e.type==="win"&&e.after)fxQ.push(e.after);
  fxQ.push(e);playNext();
}
function playNext(){
  if(fxBusy||!fxQ.length)return;
  const e=fxQ.shift();const fx=$("#fx");fxBusy=true;
  const night=e.type==="dusk", isMe=st&&st.me;
  let cls="",html="",dur=3200;
  const tap=`<div class="tap">اضغط للمتابعة</div>`;
  if(e.type==="deal"){cls="fx-deal";dur=2400;html=`<div class="fan">${[-30,-15,0,15,30].map((r,i)=>`<i style="transform:rotate(${r}deg);animation-delay:${i*.06}s"></i>`).join("")}</div><div class="big">توزعت الكروت</div><div class="sub">${isMe?"اقلب كرتك وغطّ الشاشة عن اللي جنبك":"كل واحد يشوف دوره بجواله"}</div>`;dealAnim=true;buzz(60)}
  else if(e.type==="dusk"){cls="fx-dusk";dur=2600;html=stars(40)+`<div class="moonbig"></div><div class="big">الليل</div><div class="sub">الكل يغمض عيونه</div>`}
  else if(e.type==="dawn"){cls="fx-dawn";dur=2400;html=`<div class="sun"></div><div class="big">الصبح</div><div class="sub">الكل يفتح عيونه</div>`}
  else if(e.type==="kill"){cls="fx-kill";dur=3600;html=`<svg class="slash" viewBox="0 0 400 800" preserveAspectRatio="none"><path d="M40 120 L360 680"/></svg><div class="big">اغتيال</div><div class="sub">${esc(e.who)} طلع من اللعبة</div>${e.sniper?`<div class="chip m" style="font-size:1rem">قناص! بيسحب واحد وياه</div>`:""}`;buzz([80,60,200])}
  else if(e.type==="saved"){cls="fx-saved";dur=3400;html=`<svg class="cross" viewBox="0 0 64 64" fill="currentColor"><path d="M24 6h16v18h18v16H40v18H24V40H6V24h18z"/></svg><svg class="ecg" viewBox="0 0 320 90"><path d="M0 50 H90 L105 20 L120 80 L140 8 L158 70 L172 50 H320"/></svg><div class="big">انقذ!</div><div class="sub">الاغتيال فشل، الطبيب أنقذ المغتال</div>`;buzz([40,80,40])}
  else if(e.type==="nokill"){cls="fx-dawn";dur=2400;html=`<div class="sun"></div><div class="big">ليلة هادية</div><div class="sub">ما صار اغتيال</div>`}
  else if(e.type==="out"){cls="fx-out hit";dur=3400;html=`<div class="stamp">طلع</div><div class="sub" style="margin-top:14px">${esc(e.who)} طلع بالتصويت</div><div class="muted">${ar(e.votes)} صوت</div>${e.sniper?`<div class="chip m" style="font-size:1rem">قناص! بيسحب واحد وياه</div>`:""}`;buzz([30,40,160])}
  else if(e.type==="tie"){cls="fx-tie";dur=2800;html=`<svg class="scale" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M60 8v74M30 84h60M14 22h92M14 22 4 52h22zM106 22l-10 30h22z"/></svg><div class="big">${e.none?"ما أحد صوّت":"تعادل"}</div><div class="sub">التصويت لاغي</div>`}
  else if(e.type==="snipe"){cls="fx-snipe";dur=3200;html=`<div style="position:relative"><svg class="cross-h" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="22" stroke-dasharray="4 5"/><path d="M50 2v26M50 72v26M2 50h26M72 50h26"/></svg><div class="who">${esc(e.who)}</div></div><div class="big" style="font-size:2.4rem">القناص سحبه</div>`;buzz([20,30,20,30,200])}
  else if(e.type==="win"){const t=e.winner==="town";cls="fx-win fx-win-"+(t?"town":"mafia");dur=6000;
    html=(t?`<svg class="crown" viewBox="0 0 110 90" fill="#e9c46a"><path d="M10 70 4 18l26 22L55 6l25 34 26-22-6 52z"/><rect x="10" y="74" width="90" height="10" rx="3"/></svg>`:`<svg class="crown" viewBox="0 0 64 64" fill="#ff6b62">${ICON.mafia.replace(/<\/?svg[^>]*>/g,"")}</svg>`)+`<div class="big">${t?"فاز الشعب":"فازت المافيا"}</div><div class="sub">${t?"صادوا كل المافيا":"المافيا تعادلت مع الشعب"}</div>`;
    buzz([100,60,100,60,300])}
  else {fxBusy=false;return playNext()}
  fx.className="fx-enter "+cls;fx.innerHTML=html+tap;fx.hidden=false;
  if(e.type==="win")confettiStop=confetti(fx,e.winner==="town"?["#e9c46a","#72b096","#f4ffef","#d2a74c"]:["#cf5c55","#7a1d1f","#ffb4ab","#2a0a0b"],e.winner!=="town");
  clearTimeout(fxTimer);fxTimer=setTimeout(closeFx,matchMedia("(prefers-reduced-motion: reduce)").matches?Math.min(dur,1800):dur);
  if(night)document.body.dataset.phase="night";
}
function closeFx(){
  const fx=$("#fx");if(fx.hidden){fxBusy=false;return playNext()}
  clearTimeout(fxTimer);fx.classList.add("fx-leave");
  setTimeout(()=>{fx.hidden=true;fx.innerHTML="";fx.className="";if(confettiStop){confettiStop();confettiStop=null}fxBusy=false;playNext()},380);
}
$("#fx").addEventListener("click",closeFx);
function stars(n){let h="";for(let i=0;i<n;i++)h+=`<span class="star" style="top:${Math.random()*70}%;left:${Math.random()*100}%;animation-delay:${(Math.random()*1.6).toFixed(2)}s;opacity:.${2+Math.floor(Math.random()*7)}"></span>`;return h}
function confetti(host,colors,embers){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return null;
  const c=document.createElement("canvas");host.prepend(c);const x=c.getContext("2d");
  const dpr=Math.min(2,devicePixelRatio||1);let W,H;
  const size=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr};size();
  const parts=Array.from({length:embers?90:160},()=>({x:Math.random()*W,y:embers?H+Math.random()*H:-Math.random()*H*.6,
    vx:(Math.random()-.5)*2*dpr,vy:embers?-(1+Math.random()*2.5)*dpr:(2+Math.random()*4)*dpr,r:(3+Math.random()*5)*dpr,
    a:Math.random()*6,va:(Math.random()-.5)*.25,col:colors[Math.floor(Math.random()*colors.length)]}));
  let raf,on=true;
  (function loop(){if(!on)return;x.clearRect(0,0,W,H);
    for(const p of parts){p.x+=p.vx+Math.sin(p.a)*.6*dpr;p.y+=p.vy;p.a+=p.va;
      if(embers){if(p.y<-20)p.y=H+20;x.globalAlpha=.75;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r*.7,0,7);x.fill()}
      else{if(p.y>H+20){p.y=-20;p.x=Math.random()*W}x.globalAlpha=1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}}
    raf=requestAnimationFrame(loop)})();
  return()=>{on=false;cancelAnimationFrame(raf)};
}

let lastBuzzT=null;
function drawTimer(){
  const el=$("#timer");if(!el)return;
  if(!st||!st.timer){el.hidden=true;return}
  const left=Math.max(0,(st.timer.endsAt-(Date.now()+offset))/1000);
  el.hidden=false;el.classList.toggle("end",left<=0);
  el.querySelector(".t").textContent=left<=0?"٠":ar(Math.ceil(left));
  const C=2*Math.PI*26;el.querySelector(".fgc").style.strokeDashoffset=String(C*(1-left/st.timer.dur));
  if(left<=0&&lastBuzzT!==st.timer.id){lastBuzzT=st.timer.id;buzz([200,80,200])}
}
setInterval(drawTimer,200);

    const ms=Object.keys(J.roles).filter(i=>isM(J.roles[i]));
    rows.push(`الشرطي المزيف: ${J.fakeCop?`<b>${esc(nm(J.fakeCop))}</b>`:`<span class="muted">ما تعيّن</span>`}`);
    if(st.step==="mafia"&&!J.fakeCop)rows.push(`<span class="small muted">إذا جوال الزعيم فيه مشكلة عيّنه أنت:</span><div class="row">${ms.map(i=>`<button class="btn sm" data-a="cmd" data-c="setFake" data-id="${i}">${esc(nm(i))}</button>`).join("")}</div>`);
  }else{
    const leaderUp=isAlive(whoHas("leader")),sug=Object.entries(n.sugg||{});
    rows.push(`الاغتيال: ${n.kill?`<b class="err">${esc(nm(n.kill))}</b>`:`<span class="muted">${leaderUp?"الزعيم ما اختار":"ما اتفقوا"}</span>`}`);
    if(!leaderUp&&sug.length){
      const opts=[...new Set(sug.map(s=>s[1]))];
      rows.push(`<span class="small muted">الزعيم طالع. اختياراتهم: ${sug.map(([a,b])=>esc(nm(a))+" ← "+esc(nm(b))).join("، ")}</span>`);
      if(opts.length>1)rows.push(`<div class="row">${opts.map(o=>`<button class="btn sm ${n.kill===o?"primary":""}" data-a="cmd" data-c="pickKill" data-id="${o}">اعتمد ${esc(nm(o))}</button>`).join("")}</div>`);
    }
    rows.push(`الإنقاذ: ${n.save?`<b style="color:var(--town)">${esc(nm(n.save))}</b>`:`<span class="muted">${isAlive(whoHas("doctor"))?"ما اختار":"الطبيب طالع"}</span>`}`);
  }
  rows.push(`<span class="small muted">استعلامات الشرطي: باقي ${ar(J.queriesLeft)} من ${ar(J.queryMax)}</span>`);
  rows.push(`الاستعلام: ${n.queried?`<b>${esc(nm(n.queried))}</b> ← ${isM(J.roles[n.queried])?"مافيا":"شعب"}`:`<span class="muted">${!isAlive(whoHas("cop"))?"الشرطي طالع":J.queriesLeft?"ما استعلم":"خلصت استعلاماته"}</span>`}`);
  return`<div class="list">${rows.map(r=>`<div class="li"><span class="nm">${r}</span></div>`).join("")}</div>`;
}

/* --- اللاعب --- */
function playerView(){
  const me=st.me;let h=header();
  if(st.phase==="lobby"){
    return h+`<div class="panel nightbox"><div class="moon"></div><h2>ننتظر القاضي يبدا</h2><p class="muted">${ar(st.players.length)} لاعب بالغرفة · أقل شي ${ar(st.minPlayers)}</p></div>
    <div class="panel"><div class="list">${st.players.map(p=>`<div class="li">${dot(p)}<span class="nm">${esc(p.name)}${p.id===me.id?" (أنت)":""}</span></div>`).join("")}</div></div>`;
  }
  if(!me.inGame)return h+`<div class="panel"><p>اللعبة بدت وأنت مو فيها. انتظر لين تخلص وتبدا وحدة جديدة.</p></div>`;
  if(st.phase==="over")return h+overView();
  const alive=P(me.id).alive;
  h+=cardView();
  if(!alive&&st.sniperPending!==me.id)return h+`<div class="panel"><h2>طلعت من اللعبة</h2><p class="muted">لا تتكلم ولا تأشر، تابع لين تخلص.</p></div>`+aliveList();
  return h+actionView();
}
function cardView(){
  const me=st.me,r=ROLE[me.role],accent=r.team==="m"?"var(--blood)":"var(--town)";
  let front=`<span class="chip ${r.team}" style="align-self:flex-start">${r.team==="m"?"المافيا":"الشعب"}</span>
    <div style="display:flex;align-items:center;gap:12px"><span class="ico">${ICON[me.role]}</span><span class="rn">${r.n}${me.fake?"<br><small style='font-size:1.1rem'>والشرطي المزيف</small>":""}</span></div>
    <p class="muted">${r.d}${me.fake?" ربعك عيّنوك شرطي مزيف: إذا قال القاضي الشرطة يرفعون إيدهم، ارفع إيدك وضلّلهم.":""}</p>`;
  if(me.team)front+=`<div class="sep"></div><h3>ربعك المافيا</h3><div class="list">${me.team.map(t=>`<div class="li ${isAlive(t.id)?"":"out"}"><span class="nm">${esc(nm(t.id))}${t.id===me.id?" (أنت)":""}</span><span class="chip m">${ROLE[t.role].n}${t.fake?" · مزيف":""}</span></div>`).join("")}</div>`;
  if(me.notes&&me.notes.length)front+=`<div class="sep"></div><h3>معلوماتك السرية</h3><ul class="notes">${me.notes.map(n=>`<li>${esc(ar(n))}</li>`).join("")}</ul>`;
  front+=`<span class="muted small">اضغط عشان تقلبه وتخبيه</span>`;
  return`<button class="flip ${cardOpen?"open":""} ${dealAnim?"deal":""}" data-a="card" aria-label="كرتك" style="--accent:${accent}"><div class="flip-in">
    <div class="face back"><span class="emb">${ICON.emblem}</span><span style="font-family:var(--display);font-size:1.5rem">كرتك</span><span class="muted small hint">اضغط عشان تقلبه، وغطّ الشاشة عن اللي جنبك</span></div>
    <div class="face front">${front}</div></div></button>`;
}
function picker(k,ids,red){
  const sel=st.me.sel&&st.me.sel[k];
  return`<div class="grid">${ids.map(id=>`<button class="pick ${red?"red":""} ${sel===id?"on":""}" data-a="act" data-k="${k}" data-id="${id}">${esc(nm(id))}${id===st.me.id?" (أنت)":""}</button>`).join("")}</div>`;
}
function aliveList(){
  return`<div class="panel"><h3>اللاعبين</h3><div class="list">${st.players.map(p=>`<div class="li ${p.alive?"":"out"} ${st.timer&&st.timer.pid===p.id?"speak":""}">${dot(p)}<span class="nm">${esc(p.name)}${p.id===st.me.id?" (أنت)":""}</span></div>`).join("")}</div></div>`;
}
function actionView(){
  const p=st.phase,me=st.me,role=me.role,al=aliveIds(),others=al.filter(i=>i!==me.id);
  const nightBox=t=>`<div class="panel nightbox"><div class="moon"></div><h2>${t||"الليل… غمّض عيونك"}</h2></div>`;
  if(st.sniperPending===me.id)return`<div class="panel"><h2>أنت القناص</h2><p>اختار واحد يطلع وياك. دوره يطلع لك أنت والقاضي بس.</p>${picker("snipe",others,true)}</div>`;
  if(p==="night0"){
    if(st.step==="mafia"&&isM(role)){
      if(role==="leader")return`<div class="panel"><h2>اختار الشرطي المزيف</h2><p class="muted small">اتفقوا بالإشارة، وأنت تقرر. تقدر تختار نفسك.</p>${picker("fakecop",me.team.map(t=>t.id))}</div>`;
      return`<div class="panel"><h2>تعرّف على ربعك</h2><p class="muted">الزعيم يختار الشرطي المزيف، وبيطلع بكرتك.</p></div>`;
    }
    if(st.step==="doctor"&&role==="doctor")return nightBox("أنت الطبيب، القاضي يتعرف عليك. بعدها غمّض.");
    if(st.step==="police"&&role==="cop")return queryBox(others);
    return nightBox();
  }
  if(p==="night"){
    if(st.step==="mafia"&&isM(role)){
      const lead=me.team.some(t=>t.role==="leader"&&isAlive(t.id));
      if(lead&&role!=="leader")return`<div class="panel"><h2>دور المافيا</h2><p class="muted">اتفقوا بالإشارة، والزعيم يختار من جواله.</p></div>`;
      return`<div class="panel"><h2>منو تغتالون؟</h2><p class="muted small">${lead?"أنت الزعيم، قرارك هو المعتمد.":"الزعيم طالع: كل واحد يختار، وإذا اختلفتوا القاضي يختار من اختياراتكم."}</p>${picker("kill",others,true)}</div>`;
    }
    if(st.step==="doctor"&&role==="doctor")return`<div class="panel"><h2>منو تنقذ؟</h2><p class="muted small">تقدر تختار نفسك.</p>${picker("save",al)}</div>`;
    if(st.step==="police"&&role==="cop")return queryBox(others);
    return nightBox();
  }
  if(p==="vote")return`<div class="panel"><h2>صوّت</h2><p class="muted small">اختار الشخص اللي تشك إنه مافيا. تقدر تغيّر لين يقفل القاضي التصويت.</p>${picker("vote",others,true)}</div>`+aliveList();
  return aliveList();
}
function queryBox(others){
  const q=st.me.sel.query,left=st.me.queriesLeft,max=st.me.queryMax;
  const count=`<span class="chip b">باقي لك ${ar(left)} من ${ar(max)}</span>`;
  if(q)return`<div class="panel"><h2>استعلم عن شخص</h2>${count}<p>استعلمت عن <b>${esc(nm(q))}</b>: الجواب بكرتك تحت «معلوماتك السرية».</p></div>`;
  if(!left)return`<div class="panel"><h2>خلصت استعلاماتك</h2><p class="muted">استعملت كل استعلاماتك (${ar(max)}، بعدد المافيا). غمّض عيونك.</p></div>`;
  return`<div class="panel"><h2>استعلم عن شخص</h2>${count}<p class="muted small">استعلام واحد بالليلة، وعدد استعلاماتك كلها بعدد المافيا. الجواب يطلع بكرتك.</p>${picker("query",others)}</div>`;
}
function overView(){
  const w=st.winner;
  return`<div class="panel"><h2 style="color:var(--${w==="town"?"town":"blood"})">${w==="town"?"فاز الشعب":"فازت المافيا"}</h2><table>${st.players.map(p=>{const r=st.reveal[p.id];return`<tr><td>${esc(p.name)}${p.id===st.me.id?" (أنت)":""}</td><td class="${isM(r.role)?"err":""}">${ROLE[r.role].n}${r.fake?" · شرطي مزيف":""}</td></tr>`}).join("")}</table><p class="muted small">انتظر القاضي يبدا لعبة جديدة.</p></div>`;
}

/* ---------- الأحداث ---------- */
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="joinF")joinCode($("#codeIn").value);if(e.target.id==="nameF")submitName($("#nameIn").value)});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==="create")createRoom();
  else if(a==="leave")leave();
  else if(a==="cmd")send({t:b.dataset.c,id});
  else if(a==="card"){cardOpen=!cardOpen;b.classList.toggle("open",cardOpen);buzz(15)}
  else if(a==="act"){const k=b.dataset.k;if(k==="query"&&st.me.sel.query)return;send({t:"act",k,id,gen:st.gen});buzz(25)}
});
/* حفظ توكن اللاعب لكل غرفة عشان لو طلع ورجع */
setInterval(()=>{if(sess&&!sess.judge&&sess.token)lsSet("mafia.tok."+sess.code,sess.token)},1500);

if(sess&&sess.code){view="game";render();connect()}else render();
</script>

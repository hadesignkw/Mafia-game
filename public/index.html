<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<title>الألعاب</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap">
<style>
:root{
  --bg:#0f1217;--panel:#181d25;--panel2:#202733;--line:#2c3441;
  --fg:#ece6d6;--muted:#9b978b;--brass:#d2a74c;--brass-ink:#1b1408;
  --font:"Almarai",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
h1{font-size:2.4rem;font-weight:800;margin:0;line-height:1.3;color:var(--brass)}
h2{font-size:1.3rem;font-weight:800;margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.games{display:grid;gap:12px}
.game{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none;transition:transform .12s ease,border-color .2s ease,background .2s ease;animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.game:hover{border-color:color-mix(in srgb,var(--brass) 55%,transparent)}
.game:active{transform:scale(.98)}
.game:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.game .ic{flex:none;width:64px;height:64px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;color:var(--brass)}
.game .ic svg{width:40px;height:40px}
.game .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.game .go{flex:none;color:var(--muted);font-size:1.4rem}
.game.soon{opacity:.5;pointer-events:none;border-style:dashed}
.game.soon .ic{color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.game{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>الألعاب</h1>
    <p class="muted">اختار اللعبة اللي تبي تلعبها.</p>
  </div>
  <nav class="games" id="games"></nav>
</main>
<script>
"use strict";
/* لإضافة لعبة جديدة: حط ملفاتها في مجلد باسمها داخل public وزيد سطر هني */
const GAMES=[
  {href:"/mafia/",name:"المافيا",desc:"القاضي يفتح غرفة والربع يدخلون من جوالاتهم.",
   icon:'<svg viewBox="0 0 64 64" fill="currentColor"><path d="M10 40h44l-4 6H14zM18 38c0-10 6-18 14-18s14 8 14 18zM22 20h20l-2-8H24z"/></svg>'},
  {soon:true,name:"لعبة جاية",desc:"قريباً",
   icon:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M32 16v32M16 32h32"/></svg>'}
];
document.getElementById("games").innerHTML=GAMES.map((g,i)=>
  `<a class="game${g.soon?" soon":""}" ${g.soon?'aria-disabled="true"':`href="${g.href}"`} style="animation-delay:${i*70}ms">
    <span class="ic">${g.icon}</span>
    <span class="tx"><h2>${g.name}</h2><span class="muted">${g.desc}</span></span>
    ${g.soon?"":'<span class="go" aria-hidden="true">←</span>'}
  </a>`).join("");
</script>
</body>
</html>

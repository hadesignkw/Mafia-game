<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0b09">
<title>غرفة المافيا</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Aref+Ruqaa:wght@400;700&display=swap">
<link rel="stylesheet" href="/noir.css">
<style>
/* لوحة واحدة بعرض الجوال، والليل والنهار يغيّرون لون الخلفية */
:root{
  --bg:#0e0b09;--panel:rgb(27 20 16 / .9);--panel2:#261c16;--line:#3b2d22;
  --fg:#efe3c8;--muted:#a69886;--brass:#c9a35b;--brass-hi:#ecd29a;--brass-ink:#1d1408;
  --blood:#c9443b;--town:#6fae93;
  --display:"Almarai",Tahoma,"Segoe UI",sans-serif;--ruqaa:"Aref Ruqaa","Almarai",serif;
  --body:"Almarai",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body[data-phase="night"]{--bg:#06070b;--panel:rgb(13 15 21 / .9);--panel2:#161a23;--line:#262c38}
body[data-phase="day"]{--bg:#140e09;--panel:rgb(34 25 17 / .9);--panel2:#2d2219;--line:#45341f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none}
img,svg,table{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;transition:background .9s ease;-webkit-tap-highlight-color:transparent}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.3;text-wrap:balance}
h1{font-family:var(--ruqaa);font-weight:700;font-size:3.2rem;line-height:1.1;color:var(--fg);text-shadow:0 2px 0 #6b5428,0 0 26px rgb(255 214 140 / .3),0 14px 30px rgb(0 0 0 / .8)}
.panel{box-shadow:0 18px 40px rgb(0 0 0 / .35),inset 0 1px 0 rgb(236 210 154 / .06);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* العنوان تحت اللمبة */
.hero{position:relative;text-align:center;padding-top:118px;margin-top:-16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .lamp{position:absolute;top:calc(-1 * env(safe-area-inset-top,0px));left:0;right:0}
.hero .cord{height:calc(24px + env(safe-area-inset-top,0px))}
.hero .beam{top:calc(82px + env(safe-area-inset-top,0px));width:min(520px,100vw);height:300px;opacity:.8}
.hero h1{position:relative;font-size:clamp(3.6rem,20vw,5rem)}
.hero p{position:relative;max-width:30ch}
h2{font-size:1.35rem}
h3{font-size:1.02rem;color:var(--muted);font-weight:500}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.86rem}.err{color:var(--blood)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.code{font-family:var(--display);font-size:1.1rem;letter-spacing:.15em;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.m{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 45%,transparent)}
.chip.t{color:var(--town);border-color:color-mix(in srgb,var(--town) 45%,transparent)}
.chip.b{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:background .9s ease,border-color .9s ease}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:center;transition:transform .12s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,#8c6b2e);color:var(--brass-ink);border-color:#8c6b2e;box-shadow:0 2px 0 #5a4219,0 8px 18px rgb(0 0 0 / .35)}
.btn.ghost{background:transparent}.btn.danger{color:var(--blood)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.pick:focus-visible,input:focus-visible,.flip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 140px}
input{font:inherit;font-size:1.1rem;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input.big{font-family:var(--display);font-size:2.2rem;text-align:center;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{font:inherit;font-weight:500;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere;transition:transform .12s ease,background .2s ease}
.pick:active{transform:scale(.96)}
.pick.on{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.pick.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.pick.red.on{background:var(--blood);border-color:var(--blood);color:#fff}
@keyframes pop{50%{transform:scale(1.06)}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.li.out .nm{color:var(--muted);text-decoration:line-through}
.li.speak{background:color-mix(in srgb,var(--brass) 14%,transparent);border-radius:10px;padding-inline:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--blood)}
.dot.on{background:var(--town);box-shadow:0 0 0 3px color-mix(in srgb,var(--town) 25%,transparent)}
.announce{font-family:var(--display);font-size:1.22rem;line-height:1.5;border-inline-start:3px solid var(--brass);padding-inline-start:12px}
.script{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:1.05rem}
.script b{color:var(--brass)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--muted)}
.steps span.cur{background:var(--brass);color:var(--brass-ink);font-weight:700}
.steps span.done{color:var(--town)}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tally{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brass)}
.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.notes li{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.95rem}
.sep{height:1px;background:var(--line)}
.count{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;margin-inline-start:6px;border-radius:99px;background:var(--brass);color:var(--brass-ink);font-size:.85rem;font-weight:800;vertical-align:middle}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 10px;border-radius:14px;min-width:0;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,var(--panel2)),var(--panel2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.seat.new{animation:seatIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes seatIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
.seat .av{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--ruqaa);font-weight:700;font-size:1.7rem;line-height:1;
  color:#1d1408;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 4px 12px rgb(0 0 0 / .4),inset 0 0 0 2px rgb(255 255 255 / .15)}
.seat .on{position:absolute;bottom:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--town);box-shadow:0 0 0 3px var(--panel2)}
.seat .sn{font-weight:700;font-size:.95rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .st{font-size:.72rem;color:var(--muted)}
.seat.me{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.seat.me .st{color:var(--brass)}
.seat.off{opacity:.55}.seat.off .on{background:var(--blood)}.seat.off .st{color:var(--blood)}
.seat .kick{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:1.1rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.seat .kick:hover,.seat .kick:focus-visible{color:#fff;background:var(--blood);border-color:var(--blood);outline:none}
/* اللي يسولف عند اللاعبين */
.spk{text-align:center;align-items:center;gap:6px;padding:26px 16px;border-color:color-mix(in srgb,var(--brass) 45%,transparent);background:radial-gradient(90% 80% at 50% 0%,color-mix(in srgb,var(--brass) 18%,transparent),transparent 70%),var(--panel)}
.spk .lab{font-size:.9rem;color:var(--muted)}
.spk .nm{font-family:var(--ruqaa);font-weight:700;font-size:clamp(2.4rem,13vw,3.4rem);line-height:1.15;color:var(--fg);overflow-wrap:anywhere}
.spk.idle .nm{font-size:2rem;color:var(--muted)}
.spk.fresh{animation:turnIn .6s cubic-bezier(.2,1.4,.4,1) both}
.spk .dots i{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--brass);animation:dotb 1.2s ease-in-out infinite}
.spk .dots i:nth-child(2){animation-delay:.15s}.spk .dots i:nth-child(3){animation-delay:.3s}
/* أصوات التيم عند المافيا */
.teamv{margin:0;text-align:center;font-size:.85rem;color:#e9a39d;background:color-mix(in srgb,var(--blood) 14%,transparent);border:1px dashed color-mix(in srgb,var(--blood) 45%,transparent);border-radius:10px;padding:6px 10px}
.teamv b{color:#fff}
/* دوائر الأصوات */
.seats.vt .seat{padding-bottom:12px}
.seat .vn{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--blood);font-variant-numeric:tabular-nums}
.seat.bump{animation:bump .7s cubic-bezier(.2,1.5,.4,1)}
.seat.bump .vn{animation:numPop .7s cubic-bezier(.2,1.8,.4,1)}
/* أفضل لاعبين */
.best{text-align:center;align-items:center;border-color:color-mix(in srgb,var(--brass) 55%,transparent);background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--brass) 22%,transparent),transparent 70%),var(--panel)}
.best h2{font-family:var(--ruqaa);font-size:2.4rem;color:var(--brass-hi)}
.best.lost h2{color:var(--fg)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%}
.medal{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;animation:medalIn .7s cubic-bezier(.2,1.5,.4,1) both}
.medal.gold{order:2}.medal.silver{order:1}.medal.bronze{order:3}
.medal .disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.6rem;color:#2a1a06;box-shadow:0 6px 18px rgb(0 0 0 / .45),inset 0 0 0 4px rgb(255 255 255 / .25),inset 0 -6px 10px rgb(0 0 0 / .25)}
.medal.gold .disc{width:78px;height:78px;font-size:2rem;background:radial-gradient(circle at 35% 30%,#fff3c0,#e6b93f 55%,#a07415)}
.medal.silver .disc{background:radial-gradient(circle at 35% 30%,#ffffff,#c7ccd2 55%,#868c93)}
.medal.bronze .disc{background:radial-gradient(circle at 35% 30%,#ffd9b8,#c27a45 55%,#7e4720)}
.medal .mn{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.medal .ml{font-size:.75rem;color:var(--muted)}
@keyframes medalIn{from{opacity:0;transform:translateY(24px) scale(.6)}}
.links{display:flex;justify-content:center;gap:6px 22px;flex-wrap:wrap;margin-top:-4px}
.lnk{font:inherit;font-size:.95rem;background:none;border:0;padding:6px 2px;color:var(--brass-hi);cursor:pointer;text-decoration:underline;text-decoration-color:rgb(201 163 91 / .4);text-underline-offset:6px}
.lnk:disabled{opacity:.5}
.lnk:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.demoset{animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.back{position:relative;z-index:2;align-self:flex-start;color:var(--muted);text-decoration:none;font-size:.9rem;padding:4px 0}.back:hover{color:var(--brass)}
.conn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:40;background:var(--blood);color:#fff;text-align:center;border-radius:10px;padding:6px 10px;font-size:.9rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center;z-index:60;animation:rise .25s ease}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

.flip.gone{transition:opacity .4s ease,transform .4s ease;opacity:0;transform:scale(.9)}
.roles{padding:0;gap:0}
.roles-head{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;width:100%}
.roles-head:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;border-radius:14px}
.roles-head .muted{flex:1}
.chev{font-size:1.4rem;line-height:1;transition:transform .25s ease;color:var(--brass)}
.chev.up{transform:rotate(180deg)}
.roles-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.roles-body.anim{animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.roles-body.anim .li{animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.pick small{font-weight:400;font-size:.75rem}
/* نتيجة استعلام الشرطي على الاسم نفسه */
.pick.res{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:#fff;font-weight:800;opacity:1;cursor:default}
.pick.res.m{background:var(--blood);border-color:var(--blood)}
.pick.res.t{background:var(--town);border-color:var(--town);color:#06130e}
.pick.res .lbl{font-size:.8rem;padding:1px 8px;border-radius:99px;background:rgb(0 0 0 / .22)}
.pick.res .flash{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:inherit;opacity:0;pointer-events:none}
.pick.res.reveal{animation:resPulse 2.6s ease both}
.pick.res.reveal .flash{animation:resFlash 2.6s ease both}
@keyframes resPulse{0%{transform:scale(1) rotateY(90deg)}15%{transform:scale(1.12) rotateY(0)}25%{transform:scale(1.08)}35%{transform:scale(1.12)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes resFlash{0%,70%{opacity:1;letter-spacing:.05em}100%{opacity:0;letter-spacing:.3em}}
.pick.talk.done{background:color-mix(in srgb,var(--town) 22%,var(--panel2));border-color:var(--town);color:#d9f5e8}
.pick.talk.done small{color:var(--town)}
.pick.talk .ck{position:absolute;top:6px;left:8px;width:20px;height:20px;border-radius:50%;background:var(--town);color:#06130e;font-style:normal;font-size:.75rem;font-weight:800;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.li.said .nm{color:var(--town)}
.pick.dim{opacity:.35;cursor:default}
/* ---------- حركات عامة سلسة ---------- */
html{scroll-behavior:smooth}
.btn,.pick,.tab,.roles-head{position:relative;overflow:hidden;transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .25s ease,border-color .25s ease,opacity .25s ease,box-shadow .25s ease}
.btn:hover:not(:disabled),.pick:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgb(0 0 0 / .25)}
.btn:active:not(:disabled),.pick:active:not(:disabled),.tab:active{transform:scale(.96)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.grid:has(.pick.on) .pick:not(.on):not(.res){opacity:.55}
.enter>*{animation:enterUp .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.enter .grid>*{animation:enterUp .45s cubic-bezier(.2,.8,.2,1) both}
.enter .grid>*:nth-child(2){animation-delay:.25s}.enter .grid>*:nth-child(3){animation-delay:.29s}.enter .grid>*:nth-child(4){animation-delay:.33s}.enter .grid>*:nth-child(5){animation-delay:.37s}.enter .grid>*:nth-child(6){animation-delay:.41s}.enter .grid>*:nth-child(n+7){animation-delay:.45s}
.enter .grid>*:first-child{animation-delay:.21s}
@keyframes enterUp{from{opacity:0;transform:translateY(14px)}}
.demobar,.enter>.demobar{animation:none}
.li.new{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}}
.announce.changed{animation:annIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes annIn{from{opacity:0;transform:translateY(-8px);border-inline-start-color:transparent}}
.roles-body.closing{animation:fold .22s ease forwards}
@keyframes fold{to{opacity:0;transform:translateY(-8px)}}
.ring .t.tick{animation:tick .5s ease}
@keyframes tick{30%{transform:scale(1.35)}}
.chip{transition:color .3s ease,border-color .3s ease}
.dot{transition:background-color .4s ease,box-shadow .4s ease}
.toast{animation:rise .3s cubic-bezier(.2,.8,.2,1)}
/* ---------- وضع التجربة ---------- */
select{font:inherit;font-size:1rem;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgb(0 0 0 / .35)}
.demohead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demohead b{color:var(--brass)}.demohead .muted{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{position:relative;flex:none;font:inherit;font-weight:700;font-size:.9rem;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tab small{font-weight:400;font-size:.72rem;color:var(--muted)}
.tab.m small{color:var(--blood)}.tab.t small{color:var(--town)}
.tab.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.tab.on small{color:var(--brass-ink)}
.tab.out{opacity:.45;text-decoration:line-through}
.tab .need{position:absolute;top:-4px;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--blood);box-shadow:0 0 0 3px var(--bg);animation:breathe 1.2s ease-in-out infinite}

/* ---------- المؤقت ---------- */
/* مؤقت كبير يشوفه الكل */
.timer{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 16px 20px;border-radius:20px;color:var(--brass-hi);
  background:radial-gradient(90% 80% at 50% 0%,color-mix(in srgb,var(--brass) 26%,transparent),transparent 70%),var(--panel);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);
  box-shadow:0 18px 40px rgb(0 0 0 / .45);animation:timerIn .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes timerIn{from{opacity:0;transform:scale(.9)}}
.timer .lab{font-size:.9rem;color:var(--muted)}
.timer .who{font-family:var(--ruqaa);font-weight:700;font-size:clamp(2rem,10vw,2.6rem);line-height:1.15;color:var(--fg);overflow-wrap:anywhere}
.timer .over{display:none;font-family:var(--ruqaa);font-weight:700;font-size:2.2rem;color:#fff;line-height:1.1}
.timer.end{color:#fff;border-color:var(--blood);background:radial-gradient(90% 80% at 50% 0%,color-mix(in srgb,var(--blood) 55%,transparent),transparent 75%),var(--panel);animation:shake .5s ease 2}
.timer.end .over{display:block;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
.timer.end .t{opacity:.35}
.timer .ring{width:min(170px,46vw);height:min(170px,46vw)}
.timer .ring .t{font-size:clamp(3.4rem,15vw,4.4rem);font-weight:800;color:var(--fg)}
.timer .ring circle{stroke-width:4.5}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:color-mix(in srgb,currentColor 22%,transparent)}
.ring .fgc{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- الكرت ---------- */
.flip{perspective:1200px;border:0;background:none;padding:0;width:100%;cursor:pointer;font:inherit;color:inherit;text-align:inherit}
.flip-in{position:relative;display:grid;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);min-height:260px;display:flex;flex-direction:column;gap:8px;padding:22px 18px}
.face.back{align-items:center;justify-content:center;text-align:center;background:
  radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--brass) 30%,transparent) 0 42px,transparent 43px),
  repeating-linear-gradient(45deg,#2a0f0e 0 9px,#3a1513 9px 18px);box-shadow:inset 0 0 0 6px #2a0f0e,inset 0 0 0 7px color-mix(in srgb,var(--brass) 50%,transparent)}
.face.back .emb{width:64px;height:64px;color:var(--brass)}
.face.front{transform:rotateY(180deg);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%),var(--panel)}
.face .rn{font-family:var(--ruqaa);font-weight:700;font-size:2.2rem;color:var(--accent);line-height:1.2}
.face .ico{width:56px;height:56px;color:var(--accent);flex:none}
.ico svg,.emb svg{width:100%;height:100%;display:block}
.deal .flip-in{animation:deal .9s cubic-bezier(.2,.9,.2,1)}
@keyframes deal{from{transform:translateY(-60vh) rotate(-25deg) scale(.6);opacity:0}70%{transform:translateY(8px) rotate(2deg)}}
.hint{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* ---------- الليل ---------- */
.nightbox{text-align:center;padding:36px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;overflow:hidden}
.moon{width:70px;height:70px;border-radius:50%;box-shadow:-14px 8px 0 0 var(--brass);transform:rotate(-20deg);animation:float 5s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}

/* ---------- الحركات الكبيرة ---------- */
#fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:10px;overflow:hidden;cursor:pointer;padding:24px;touch-action:none}
#fx .fx-in{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px}
#fx .big{font-family:var(--ruqaa);font-weight:700;font-size:clamp(2.6rem,12vw,4.6rem);line-height:1.1}
#fx .sub{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
#fx .tap{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:.85rem;opacity:.6;z-index:2}
#fx canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.fx-enter{animation:fxin .45s ease both}
#fx.sticky{cursor:default}
#fx .judgeclose{opacity:1}
#fx .judgeclose .btn{min-width:220px;animation:fxin .4s 1.2s both}
@keyframes fxin{from{opacity:0}}
.fx-leave{animation:fxout .4s ease both}
@keyframes fxout{to{opacity:0}}
/* الليل يطيح */
.fx-dusk{background:radial-gradient(circle at 50% 120%,#1c2b4a,#05070c 70%);color:#dfe6f5}
.fx-dusk .moonbig{width:120px;height:120px;border-radius:50%;box-shadow:-24px 14px 0 0 #f1d48a;transform:rotate(-20deg);animation:moonup 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes moonup{from{translate:0 60vh;opacity:0}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 1.6s ease-in-out infinite alternate;z-index:1}
@keyframes tw{from{opacity:.1}to{opacity:1}}
/* مشاهد الليل والنهار */
.scene-svg{position:relative;z-index:2;overflow:visible;width:min(380px,92vw);height:auto;display:block;animation:sceneIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sceneIn{from{opacity:0;transform:translateY(18px) scale(.96)}}
.scene-svg .sw{transform-origin:180px 0;animation:sway2 6s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.scene-svg .bulb2{animation:bulbOn 2.4s ease-out both}
.scene-svg .ember{animation:ember 2.2s ease-in-out infinite}
@keyframes ember{0%,100%{fill:#ff6a3d;r:2.2px}45%{fill:#ffd08a;r:3px}}
.scene-svg .smk{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:smk 3.2s ease-out infinite}
.scene-svg .smk.d2{animation-delay:1.05s}.scene-svg .smk.d3{animation-delay:2.1s}
@keyframes smk{0%{opacity:0;transform:translateY(6px) scaleY(.4)}25%{opacity:.75}100%{opacity:0;transform:translateY(-28px) scaleY(1.2) translateX(6px)}}
.scene-svg .paper{transform-box:fill-box;transform-origin:50% 100%;animation:paper 4s ease-in-out infinite}
@keyframes paper{0%,40%,100%{transform:none}45%{transform:rotate(-1.5deg) translateY(-1px)}50%{transform:rotate(1deg)}55%{transform:none}}
.scene-svg .sunrise{transform-box:fill-box;animation:sunup2 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunup2{from{transform:translate(-20px,60px);opacity:0}}
.scene-svg .rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scene-svg .walker{animation:walk 11s linear infinite}
.scene-svg .w0{animation-duration:12s;animation-delay:-3s}
.scene-svg .w1{animation-duration:15s;animation-delay:-9s}
.scene-svg .w2{animation-duration:10s;animation-delay:-6.5s}
@keyframes walk{from{transform:translate(-30px,232px)}to{transform:translate(390px,232px)}}
.scene-svg .w1{animation-name:walkBack}
@keyframes walkBack{from{transform:translate(390px,214px) scaleX(-1)}to{transform:translate(-30px,214px) scaleX(-1)}}
.scene-svg .bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px) rotate(1.5deg)}}
.scene-svg .bird{animation:fly 9s linear infinite}
.scene-svg .b2{animation-duration:12s;animation-delay:-5s}
@keyframes fly{from{transform:translate(380px,60px)}50%{transform:translate(180px,40px)}to{transform:translate(-30px,70px)}}
.fx-dawn .scene-svg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.fx-dusk .big,.fx-dawn .big{position:relative;z-index:2;margin-top:4px}
/* الصبح */
.fx-dawn{background:radial-gradient(120% 70% at 85% 10%,#ffd98a,#e09a4a 30%,#9a5326 60%,#3a1d0c 95%);color:#fff4df}
.fx-dawn .big,.fx-dawn .sub{text-shadow:0 2px 14px rgb(60 25 5 / .7)}
.fx-dawn .sun{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#ffe7a6,#f4b24c);box-shadow:0 0 80px 30px rgb(244 178 76 / .55);animation:sunup 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunup{from{translate:0 50vh}}
/* اغتيال */
.fx-kill{background:radial-gradient(circle at 50% 45%,#5a0f0f,#120405 70%);color:#fff;animation:flash .5s ease}
@keyframes flash{0%{background:#ff3b30}}
.fx-kill .chalk{position:relative;z-index:2;width:min(260px,70vw);height:auto}
.fx-kill .chalk .ln,.fx-kill .chalk .ln2{fill:none;stroke:#f3ece0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:cut 1.1s .2s ease-out forwards;filter:drop-shadow(0 0 3px rgb(255 255 255 / .35))}
.fx-kill .chalk .ln2{stroke:#c9a35b;animation-delay:1s}
.fx-kill .chalk .blood{fill:#b8322c;opacity:0;transform-box:fill-box;transform-origin:center;animation:splat .5s 1.2s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes splat{from{opacity:0;transform:scale(0)}to{opacity:.85;transform:scale(1)}}
.fx-kill .slash path{stroke:#ff5b4f;stroke-width:10;fill:none;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:cut .35s .25s ease-out forwards;filter:drop-shadow(0 0 12px #ff3b30)}
@keyframes cut{to{stroke-dashoffset:0}}
.fx-kill .big{animation:slam .5s .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.4);opacity:0}}
.fx-kill .sub{animation:fxin .4s .9s both;text-shadow:0 0 14px #120405,0 0 4px #120405}
.fx-kill .slash path{opacity:.85}
/* الإنقاذ */
.fx-saved{background:radial-gradient(circle at 50% 45%,#0f3b31,#04110e 70%);color:#e9fff8}
.fx-saved .ecg{width:min(320px,80vw);height:90px}
.fx-saved .ecg path{fill:none;stroke:#7fe0bf;stroke-width:4;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:cut 1.2s ease-out forwards;filter:drop-shadow(0 0 8px #7fe0bf)}
.fx-saved .cross{width:90px;height:90px;color:#7fe0bf;animation:beat 1s .6s ease-in-out 2}
@keyframes beat{30%{transform:scale(1.18)}60%{transform:scale(.96)}}
/* طلع بالتصويت */
.fx-out{background:radial-gradient(circle at 50% 45%,#3a2a12,#0d0904 72%);color:#fff2d8}
.fx-out .stamp{font-family:var(--display);font-size:clamp(3rem,15vw,5.5rem);color:#e0b057;border:6px solid #e0b057;border-radius:14px;padding:0 22px;transform:rotate(-8deg);animation:stamp .5s .2s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(3);opacity:0}}
.fx-out.hit{animation:shake .35s .55s ease}
/* تعادل */
.fx-tie{background:radial-gradient(circle at 50% 45%,#262c38,#090b0f 72%);color:#e6e9ef}
.fx-tie .scale{width:120px;height:90px;color:var(--brass);animation:sway 1.4s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
/* القناص */
.fx-snipe{background:#070809;color:#fff}
.fx-snipe .cross-h{width:min(280px,70vw);height:min(280px,70vw);color:#ff5b4f;animation:aim 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes aim{from{transform:scale(3) rotate(40deg);opacity:0}80%{transform:scale(.95)}}
.fx-snipe .who{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;animation:fxin .3s 1s both}
/* الفوز */
.fx-win-town{background:radial-gradient(circle at 50% 40%,#2c4a3c,#0a1310 72%);color:#f4ffef}
.fx-win-mafia{background:radial-gradient(circle at 50% 40%,#4a1214,#0b0304 72%);color:#ffe9e6}
.fx-win .big{animation:slam .7s .2s cubic-bezier(.2,1.5,.4,1) both}
.fx-win .crown{width:110px;height:90px;animation:drop 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{translate:0 -60vh}}
/* جواب الشرطي */
.fx-answer-m{background:radial-gradient(circle at 50% 45%,#5a0f0f,#120405 72%);color:#fff}
.fx-answer-t{background:radial-gradient(circle at 50% 45%,#0f3b31,#04110e 72%);color:#e9fff8}
.fx-answer .big{animation:slam .5s .1s cubic-bezier(.2,1.6,.4,1) both}
.fx-answer .bar{width:min(260px,70vw);height:6px;border-radius:9px;background:rgb(255 255 255 / .15);overflow:hidden;margin-top:8px}
.fx-answer .bar i{display:block;height:100%;background:currentColor;transform-origin:right;animation:drain 10s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
/* توزيع */
.fx-deal{background:radial-gradient(circle at 50% 50%,#2a2214,#0b0906 72%);color:#f6ead0}
.fan{position:relative;width:200px;height:150px}
.fan i{position:absolute;inset-inline-start:70px;top:10px;width:64px;height:96px;border-radius:9px;background:repeating-linear-gradient(45deg,#2a0f0e 0 6px,#3a1513 6px 12px);border:2px solid #c9a35b;transform-origin:50% 120%;animation:fanout .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes fanout{from{transform:rotate(0)}}

/* ---------- التصويت بالدور ---------- */
.turn{position:relative;overflow:hidden;text-align:center;align-items:center;border-color:color-mix(in srgb,var(--brass) 55%,transparent);background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--brass) 20%,transparent),transparent 65%),var(--panel)}
.turn .lab{font-size:.9rem;color:var(--muted)}
.turn .who{font-family:var(--ruqaa);font-weight:700;font-size:clamp(2rem,10vw,2.8rem);color:var(--brass);line-height:1.2;overflow-wrap:anywhere}
.turn .dots i{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--brass);animation:dotb 1.2s ease-in-out infinite}
.turn .dots i:nth-child(2){animation-delay:.15s}.turn .dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-7px);opacity:1}}
.turn.fresh{animation:turnIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes turnIn{from{transform:scale(.85) rotateX(40deg);opacity:0}}
.turn.mine{border-color:var(--blood);background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--blood) 26%,transparent),transparent 65%),var(--panel)}
.turn.mine .who{color:var(--blood)}
.turn.mine::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--blood);animation:breathe 1.2s ease-in-out infinite;pointer-events:none}
.queue{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.queue span{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.queue span.done{color:var(--town);border-color:color-mix(in srgb,var(--town) 40%,transparent)}
.queue span.cur{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);overflow:hidden;min-width:0}
.rk .bar{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--blood) 22%,transparent);border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rk>*:not(.bar){position:relative}
.rk .pos{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:800;background:var(--panel2);color:var(--muted)}
.rk.top .pos{background:var(--blood);color:#fff}
.rk.top{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blood) 60%,transparent)}
.rk .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.rk .by{font-size:.78rem;color:var(--muted);flex-basis:100%;padding-inline-start:36px;margin-top:-6px}
.rk .n{font-family:var(--display);font-size:1.4rem;color:var(--blood);font-variant-numeric:tabular-nums}
.rk.bump{animation:bump .7s cubic-bezier(.2,1.5,.4,1)}
.rk.bump .n{animation:numPop .7s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{30%{transform:scale(1.04);background:color-mix(in srgb,var(--blood) 18%,var(--bg))}}
@keyframes numPop{30%{transform:scale(1.7)}}
.cast{display:flex;align-items:center;gap:8px;font-size:.92rem;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cast:last-child{border-bottom:0}.cast b{color:var(--blood)}
.cast.new{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both}
/* صورة الصوت */
.fx-cast{background:radial-gradient(circle at 50% 45%,#3b1416,#0c0506 72%);color:#fff}
.fx-cast .voter{font-size:1.4rem;font-weight:700;animation:fxin .3s both}
.fx-cast .arrow{width:60px;height:60px;color:#ff8a80;animation:arrowDown .5s .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes arrowDown{from{transform:translateY(-30px);opacity:0}}
.fx-cast .target{font-family:var(--ruqaa);font-weight:700;font-size:clamp(2.4rem,13vw,4rem);color:#ff6b62;border:5px solid #ff6b62;border-radius:14px;padding:2px 20px;transform:rotate(-5deg);animation:stamp .5s .5s cubic-bezier(.3,1.8,.5,1) both;overflow-wrap:anywhere;max-width:90vw}
.fx-cast .nextup{margin-top:16px;font-size:1.05rem;opacity:.85;animation:fxin .4s 1.1s both}
.fx-cast.hit{animation:shake .35s .8s ease}
/* ---------- اختيار الربع (تحت يسار) ---------- */
.mate{position:relative;align-self:flex-end;width:min(230px,100%);font:inherit;color:#fff;text-align:center;cursor:pointer;border:2px solid var(--blood);border-radius:18px;padding:12px 14px 14px;background:radial-gradient(120% 100% at 50% 0%,#5a1517,#1a0809);box-shadow:0 14px 40px rgb(0 0 0 / .55),0 0 0 6px color-mix(in srgb,var(--blood) 18%,transparent);display:flex;flex-direction:column;gap:4px;animation:mateIn .55s cubic-bezier(.2,1.4,.4,1) both}
.mate .ttl{font-size:.82rem;opacity:.85}
.mate .who{font-family:var(--ruqaa);font-weight:700;font-size:clamp(1.8rem,9vw,2.4rem);line-height:1.15;overflow-wrap:anywhere;color:#ffb0a9}
.mate .how{font-size:.8rem;line-height:1.4;background:rgb(0 0 0 / .3);border-radius:10px;padding:5px 8px;margin-top:4px}
.mate.with{border-color:var(--town);background:radial-gradient(120% 100% at 50% 0%,#164336,#07130f);box-shadow:0 14px 40px rgb(0 0 0 / .55),0 0 0 6px color-mix(in srgb,var(--town) 20%,transparent)}
.mate.with .who{color:#9fe5c9}

.mate:not(.with){animation:mateIn .55s cubic-bezier(.2,1.4,.4,1) both,matePulse 1.6s 1s ease-in-out infinite}
.mate:active{transform:scale(.96)}
@keyframes mateIn{from{transform:translateX(-40px) rotate(-6deg);opacity:0}}
@keyframes mateSwap{0%{transform:rotateY(90deg)}100%{transform:none}}

/* زر الرجوع للقاضي فوق صورة النتيجة بالتجربة */
#fx .democlose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:3;display:flex;justify-content:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>

<body>
<div class="noir" aria-hidden="true"><span class="smoke s1"></span><span class="smoke s2"></span><span class="smoke s3"></span><span class="vig"></span><span class="grain"></span></div>
<div class="wrap" id="app">
  <div><h1>غرفة المافيا</h1><p class="muted">لحظة…</p></div>
</div>
<div class="conn" id="conn" hidden>النت فصل، قاعد يرجع يتصل…</div>
<div class="toast" id="toast" hidden></div>
<div id="fx" hidden></div>

<script>
"use strict";
/* ---------- القواعد للعرض ---------- */
const ROLE={
  mafia:{n:"مافيا",team:"m",d:"أنت من المافيا. تعرف ربعك، وكل ليلة تختارون منو تغتالون والأغلبية تفوز. وإذا تعادلتوا القاضي يختار من اختياراتكم."},
  cop:{n:"الشرطي الحقيقي",team:"t",d:"أنت من الشعب. كل ليلة تستعلم عن شخص ويطلع لك: مافيا ولا شعب."},

const $=s=>document.querySelector(s);

function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3400)}

/* ---------- الحالة ---------- */
let sess=lsGet("mafia.sess"); // {code, token, judge}
let demoOpen=false,view="home", st=null, ws=null, offset=0, lastEv=null, firstState=true, retry=0, homeErr="", busy=false;
let cardOpen=false, dealAnim=false, lastGen=null, notesSeen=null, rolesOpen=false;


/* ---------- الاتصال ---------- */
function connect(){
  if(!sess||!sess.code)return;
  try{ws&&ws.close()}catch{}
  const proto=location.protocol==="https:"?"wss":"ws";
  const sock=new WebSocket(`${proto}://${location.host}/api/ws?code=${sess.code}`);ws=sock;
  sock.onopen=()=>{retry=0;$("#conn").hidden=true;sock.send(JSON.stringify({t:"hello",token:sess.token||null}))};
  sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}onMsg(m)};
  sock.onclose=()=>{if(ws!==sock||!sess)return;$("#conn").hidden=view!=="game";retry++;setTimeout(()=>{if(ws===sock&&sess)connect()},Math.min(8000,700*retry))};
}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"t":"ping"}');if(demo)demo.list.forEach(p=>{if(p.ws&&p.ws.readyState===1&&p.ws!==ws)p.ws.send('{"t":"ping"}')})},25000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sess&&(!ws||ws.readyState>1))connect()});
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast("النت فاصل، لحظة ويرجع.")}

function onMsg(m){
  if(m.t==="need-name"){if(sess&&sess.judge){endSession("الغرفة خلصت.");return}view="name";render();return}
  if(m.t==="joined"){sess.token=m.token;lsSet("mafia.sess",sess);return}
  if(m.t==="error"){toast(m.text);return}
  if(m.t==="kicked"){endSession("القاضي شالك من الغرفة.");return}
  if(m.t==="gone"){endSession("الغرفة خلصت.");return}
  if(m.t==="state"){
    offset=m.now-Date.now();
    const prev=st;st=m;view="game";
    if(st.me&&st.gen!==lastGen){if(lastGen!==null||st.phase==="night0")cardOpen=false;lastGen=st.gen}
    handleEvent(prev);
    voteFx(prev);
    if(st.me&&st.me.notes){const n=st.me.notes.length;
      if(notesSeen!==null&&n>notesSeen&&!/^الليلة/.test(st.me.notes[n-1])){fxQ.push({id:"a"+Date.now(),type:"answer",text:st.me.notes[n-1]});cardOpen=false;playNext()}
      notesSeen=n}
    render();
  }
}
/* كل صوت جديد يطلع للكل: فلان صوّت على فلان، والدور الجاي */
function voteFx(prev){
  const a=prev&&prev.vote,b=st.vote;
  if(!b||!a||prev.gen!==st.gen||a.order.join()!==b.order.join())return;
  b.order.slice(a.turn,b.turn).forEach((v,i,arr)=>{const t=b.votes[v];if(!t)return;
    const last=i===arr.length-1,nx=last&&b.cur?b.cur:null;
    fxQ.push({id:"c"+v+st.gen,type:"cast",voter:nm(v),target:nm(t),me:st.me&&st.me.id,v,t,next:nx?nm(nx):null,nextMe:!!(nx&&st.me&&nx===st.me.id)})});
  playNext();
}
function endSession(msg){if(demo){endDemo(msg);return}sess=null;lsSet("mafia.sess",null);try{ws&&ws.close()}catch{}ws=null;st=null;view="home";homeErr=msg;render()}

/* ---------- الدخول ---------- */
async function createRoom(){
  busy=true;render();
  try{const r=await fetch("/api/create",{method:"POST"});const j=await r.json();if(!r.ok)throw new Error(j.error);
    sess={code:j.code,token:j.token,judge:true};lsSet("mafia.sess",sess);firstState=true;connect();}
  catch(e){homeErr=e.message||"ما قدرت أفتح غرفة.";}
  busy=false;render();
}
async function joinCode(c){
  c=en(c).trim();homeErr="";
  if(!/^\d{4}$/.test(c)){homeErr="رقم الغرفة 4 أرقام.";return render()}
  busy=true;render();
  try{const r=await fetch("/api/exists?code="+c);const j=await r.json();
    if(!j.ok){homeErr="ما لقيت غرفة بهالرقم، تأكد من القاضي.";busy=false;return render()}}
  catch{homeErr="ما في إنترنت؟ جرّب مرة ثانية.";busy=false;return render()}
  const old=lsGet("mafia.tok."+c);
  sess={code:c,token:old||null,judge:false};lsSet("mafia.sess",sess);busy=false;firstState=true;connect();
}
function submitName(n){n=String(n||"").trim();if(!n)return toast("اكتب اسمك");lsSet("mafia.name",n);send({t:"join",name:n})}
function leave(){if(demo)return endDemo("");if(st&&st.me&&st.phase==="lobby")send({t:"leave"});endSession("")}

/* ---------- وضع التجربة: قاضي ولاعبين وهميين على جهاز واحد ---------- */
let demo=null; // {code, active, list:[{key,label,token,judge,ws,st,lastEv,notesSeen,lastGen}]}
async function startDemo(n){
  busy=true;render();
  try{
    const r=await fetch("/api/demo?n="+n,{method:"POST"});const j=await r.json();if(!r.ok)throw new Error(j.error);
    if(ws){try{ws.close()}catch{}}sess=null;lsSet("mafia.sess",null);
    demo={code:j.code,active:0,list:[{key:"judge",label:"القاضي",token:j.token,judge:true},...j.players.map(p=>({key:p.id,label:p.name,token:p.token}))]};
    demo.list.forEach(demoConnect);ws=demo.list[0].ws;st=null;lastEv=null;notesSeen=null;lastGen=null;firstState=false;view="game";homeErr="";
  }catch(e){homeErr=e.message||"ما قدرت أفتح التجربة.";}
  busy=false;render();
}
function demoConnect(p){
  const proto=location.protocol==="https:"?"wss":"ws";
  const sock=new WebSocket(`${proto}://${location.host}/api/ws?code=${demo.code}`);p.ws=sock;
  if(demo.list[demo.active]===p)ws=sock;
  sock.onopen=()=>sock.send(JSON.stringify({t:"hello",token:p.token}));
  sock.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch{return}
    if(!demo)return;
    if(demo.list[demo.active]===p){onMsg(m);if(demo){p.st=st;p.lastEv=lastEv;p.notesSeen=notesSeen;p.lastGen=lastGen}return}
    if(m.t==="state"){p.st=m;p.lastEv=m.event?m.event.id:null;p.notesSeen=m.me&&m.me.notes?m.me.notes.length:null;p.lastGen=m.gen;render()}
    else if(m.t==="error")toast(p.label+": "+m.text);
  };
  sock.onclose=()=>{setTimeout(()=>{if(demo&&p.ws===sock)demoConnect(p)},1500)};
}
function switchPersona(i){
  if(!demo||!demo.list[i])return;
  const p=demo.list[i];demo.active=i;ws=p.ws;st=p.st;lastEv=p.lastEv;notesSeen=p.notesSeen;lastGen=p.lastGen;firstState=false;cardOpen=false;
  fxQ.length=0;if(!$("#fx").hidden)closeFx();
  render();window.scrollTo({top:0});
  const ev=st&&st.event;
  if(ev){const pend=[];if(ev.type==="win"&&ev.after&&STICKY.has(ev.after.type)&&!ev.after.closed)pend.push(ev.after);if(STICKY.has(ev.type)&&!ev.closed)pend.push(ev);
    if(pend.length){setTimeout(()=>{pend.forEach(x=>fxQ.push(x));playNext()},420)}}
}
function endDemo(msg){
  const d=demo;demo=null;if(d)d.list.forEach(p=>{try{p.ws.close()}catch{}});
  ws=null;st=null;view="home";homeErr=msg||"";render();
}
/* منو عليه الدور الحين (عشان تنتقل له) */
function demoNeeds(){
  const need=new Set();if(!demo)return need;
  const J=demo.list[0].st;if(!J||!J.judge)return need;
  const R=J.judge.roles,alive=id=>{const p=J.players.find(x=>x.id===id);return p&&p.alive};
  const ids=Object.keys(R).filter(alive);
  if(J.sniperPending)need.add(J.sniperPending);
  else if(J.phase==="night0"||J.phase==="night"){
    if(J.step==="police")ids.filter(i=>R[i]==="cop").forEach(i=>{if(!J.judge.night.queried&&J.judge.queriesLeft)need.add(i)});
    if(J.step==="mafia")ids.filter(i=>isM(R[i])).forEach(i=>{const m=J.phase==="night0"?J.judge.night.fake:J.judge.night.sugg;if(!(m&&m[i]))need.add(i)});
    if(J.step==="doctor")ids.filter(i=>R[i]==="doctor").forEach(i=>{if(!J.judge.night.save)need.add(i)});
  }else if(J.phase==="vote"&&J.vote&&J.vote.cur)need.add(J.vote.cur);
  if(!J.players.length||J.phase==="lobby")need.clear();
  return need;
}
function demoBar(){
  if(!demo)return"";
  const J=demo.list[0].st,R=J&&J.judge?J.judge.roles:{},need=demoNeeds(),j=J&&J.judge;
  return`<div class="demobar"><div class="demohead"><b>وضع التجربة</b><span class="muted small">دوس على أي واحد تشوف شاشته</span><button class="btn sm ghost" data-a="endDemo">سكّر التجربة</button></div>
  <div class="tabs">${demo.list.map((p,i)=>{
    const r=R[p.key],pl=J&&J.players.find(x=>x.id===p.key),out=pl&&!pl.alive;
    const lab=p.judge?"القاضي":`${esc(p.label)}${r?`<small>${ROLE[r].n}${j.fakeCop===p.key?" · مزيف":""}</small>`:""}`;
    return`<button class="tab ${i===demo.active?"on":""} ${r?ROLE[r].team:""} ${out?"out":""}" data-a="persona" data-i="${i}">${need.has(p.key)?`<i class="need"></i>`:""}${lab}</button>`}).join("")}</div></div>`;
}

/* ---------- الحركات ---------- */
const fxQ=[];let fxBusy=false,fxTimer=null,confettiStop=null;
const STICKY=new Set(["kill","saved","nokill","out","tie","snipe"]);
let curFx=null;

function handleEvent(prev){
  const e=st.event;
  if(curFx&&STICKY.has(curFx.type)&&fxClosed(curFx.id))closeFx(true);
  if(!e){lastEv=null;firstState=false;return}
  if(e.id===lastEv){firstState=false;return}
  const fresh=st.now-e.at<7000||(STICKY.has(e.type)&&!e.closed)||(e.after&&STICKY.has(e.after.type)&&!e.after.closed);
  lastEv=e.id;
  if(firstState&&!fresh){firstState=false;return}
  firstState=false;
  if(e.type==="win"&&e.after&&!e.after.closed)fxQ.push(e.after);
  fxQ.push(e);playNext();
}
function playNext(){
  if(fxBusy||!fxQ.length)return;

  if(STICKY.has(e.type)&&fxClosed(e.id))return playNext();
  fxBusy=true;curFx=e;
  const night=e.type==="dusk", isMe=st&&st.me;
  let cls="",html="",dur=3200;
  const tap=`<div class="tap">دوس عشان تكمل</div>`;
  if(e.type==="answer"){const bad=/مافيا/.test(e.text);cls="fx-answer "+(bad?"fx-answer-m":"fx-answer-t");dur=10000;
    html=`<div class="big">${bad?"مافيا!":"شعب"}</div><div class="sub">${esc(ar(e.text))}</div><div class="bar"><i></i></div><div class="muted small">احفظها، ما بترجع تطلع لك</div>`;buzz(bad?[60,40,60]:40)}
  else if(e.type==="deal"){cls="fx-deal";dur=2400;html=`<div class="fan">${[-30,-15,0,15,30].map((r,i)=>`<i style="transform:rotate(${r}deg);animation-delay:${i*.06}s"></i>`).join("")}</div><div class="big">توزعت الكروت</div><div class="sub">${isMe?"اقلب كرتك وغطّ الشاشة عن اللي جنبك":"كل واحد يشوف دوره بجواله"}</div>`;dealAnim=true;buzz(60)}
  else if(e.type==="dusk"){cls="fx-dusk";dur=7000;html=stars(30)+SCENE_NIGHT+`<div class="big">الليل</div><div class="sub">كل واحد يتابع جواله</div>`}
  else if(e.type==="dawn"){cls="fx-dawn";dur=7000;html=SCENE_DAY+`<div class="big">الصبح</div><div class="sub">بدا النهار</div>`}
  else if(e.type==="kill"){cls="fx-kill";dur=12000;html=`<svg class="chalk" viewBox="0 0 220 150" aria-hidden="true"><path class="ln" d="M110 22a14 14 0 1 1-0.1 0M104 50c-6 2-10 8-12 16l-30-8-22 10M116 50c6 2 10 8 12 16l26-20 24-4M96 66l-2 30-20 26-24 6M124 66l4 30 14 28 22 10M96 96h30"/><path class="ln2" d="M150 30c8-8 22-8 30 0l4 6h-38zM144 36h46"/><circle class="blood" cx="120" cy="84" r="9"/></svg><div class="big">اغتيال</div><div class="sub">${esc(e.who)} طلع من اللعبة</div><div class="sub" style="animation-delay:1.3s">صيدة سهلة والطبيب مدوّج 😴</div>${e.sniper?`<div class="chip m" style="font-size:1rem">قناص! بيسحب واحد وياه</div>`:""}`;buzz([80,60,200])}
  else if(e.type==="saved"){cls="fx-saved";dur=12000;html=`<svg class="cross" viewBox="0 0 64 64" fill="currentColor"><path d="M24 6h16v18h18v16H40v18H24V40H6V24h18z"/></svg><svg class="ecg" viewBox="0 0 320 90"><path d="M0 50 H90 L105 20 L120 80 L140 8 L158 70 L172 50 H320"/></svg><div class="big">اغتيال شامط</div><div class="sub">الطبيب موجووووود 🔥</div>`;buzz([40,80,40])}
  else if(e.type==="nokill"){cls="fx-dawn";dur=12000;html=`<div class="sun"></div><div class="big">ليلة هادية</div><div class="sub">ما صار اغتيال</div>`}
  else if(e.type==="out"){cls="fx-out hit";dur=12000;html=`<div class="stamp">طلع</div><div class="sub" style="margin-top:14px">${esc(e.who)} طلع بالتصويت</div><div class="muted">${ar(e.votes)} صوت</div>${e.sniper?`<div class="chip m" style="font-size:1rem">قناص! بيسحب واحد وياه</div>`:""}`;buzz([30,40,160])}
  else if(e.type==="tie"){cls="fx-tie";dur=12000;html=`<svg class="scale" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M60 8v74M30 84h60M14 22h92M14 22 4 52h22zM106 22l-10 30h22z"/></svg><div class="big">${e.none?"ما أحد صوّت":"تعادل"}</div><div class="sub">التصويت ما ينحسب</div>`}
  else if(e.type==="snipe"){cls="fx-snipe";dur=12000;html=`<div style="position:relative"><svg class="cross-h" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="22" stroke-dasharray="4 5"/><path d="M50 2v26M50 72v26M2 50h26M72 50h26"/></svg><div class="who">${esc(e.who)}</div></div><div class="big" style="font-size:2.4rem">القناص سحبه</div>`;buzz([20,30,20,30,200])}
  else if(e.type==="cast"){cls="fx-cast hit";dur=2600;
    const me=st&&st.me&&st.me.id;
    html=`<div class="voter">${e.v===me?"أنت صوّتت على":esc(e.voter)+" صوّت على"}</div><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg><div class="target">${e.t===me?"أنت":esc(e.target)}</div>${e.next?`<div class="nextup">${e.nextMe?"<b>دورك الحين!</b>":"الدور على "+esc(e.next)}</div>`:`<div class="nextup">الكل صوّت</div>`}`;
    buzz(e.t===me?[60,40,120]:30)}
  else if(e.type==="win"){const t=e.winner==="town";cls="fx-win fx-win-"+(t?"town":"mafia");dur=6000;
    html=(t?`<svg class="crown" viewBox="0 0 110 90" fill="#e9c46a"><path d="M10 70 4 18l26 22L55 6l25 34 26-22-6 52z"/><rect x="10" y="74" width="90" height="10" rx="3"/></svg>`:`<svg class="crown" viewBox="0 0 64 64" fill="#ff6b62">${ICON.mafia.replace(/<\/?svg[^>]*>/g,"")}</svg>`)+`<div class="big">${t?"فاز الشعب":"فازت المافيا"}</div><div class="sub">${t?"صادوا كل المافيا":"صاروا قد الشعب"}</div>`;
    buzz([100,60,100,60,300])}
  else {fxBusy=false;return playNext()}
  const sticky=STICKY.has(e.type);
  const tapH=!sticky?tap:(st&&st.judge?`<div class="tap judgeclose"><button class="btn primary" data-fx="close">سكّر النتيجة عند الكل</button></div>`:`<div class="tap">القاضي يسكرها لما يشوفها الكل</div>`);
  const demoH=demo&&st&&!st.judge?`<div class="democlose"><button class="btn sm" data-fx="judge">رجوع لشاشة القاضي</button></div>`:"";
  fx.className="fx-enter "+cls+(sticky?" sticky":"");fx.innerHTML=html+tapH+demoH;fx.hidden=false;
  if(e.type==="win")confettiStop=confetti(fx,e.winner==="town"?["#e9c46a","#72b096","#f4ffef","#d2a74c"]:["#cf5c55","#7a1d1f","#ffb4ab","#2a0a0b"],e.winner!=="town");
  clearTimeout(fxTimer);if(!sticky)fxTimer=setTimeout(closeFx,matchMedia("(prefers-reduced-motion: reduce)").matches?Math.min(dur,1800):dur);

function closeFx(){
  const fx=$("#fx");curFx=null;if(fx.hidden){fxBusy=false;return playNext()}
  clearTimeout(fxTimer);fx.classList.add("fx-leave");
  setTimeout(()=>{fx.hidden=true;fx.innerHTML="";fx.className="";if(confettiStop){confettiStop();confettiStop=null}fxBusy=false;playNext()},380);
}
$("#fx").addEventListener("click",e=>{
  if(e.target.closest("[data-fx=close]")){send({t:"closeFx"});closeFx();return}
  if(e.target.closest("[data-fx=judge]")){switchPersona(0);return}
  if(curFx&&STICKY.has(curFx.type))return; // صورة النتيجة يسكرها القاضي بس
  closeFx();
});
function stars(n){let h="";for(let i=0;i<n;i++)h+=`<span class="star" style="top:${Math.random()*70}%;left:${Math.random()*100}%;animation-delay:${(Math.random()*1.6).toFixed(2)}s;opacity:.${2+Math.floor(Math.random()*7)}"></span>`;return h}
function confetti(host,colors,embers){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return null;
  const c=document.createElement("canvas");host.prepend(c);const x=c.getContext("2d");
  const dpr=Math.min(2,devicePixelRatio||1);let W,H;
  const size=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr};size();
  const parts=Array.from({length:embers?90:160},()=>({x:Math.random()*W,y:embers?H+Math.random()*H:-Math.random()*H*.6,
    vx:(Math.random()-.5)*2*dpr,vy:embers?-(1+Math.random()*2.5)*dpr:(2+Math.random()*4)*dpr,r:(3+Math.random()*5)*dpr,
    a:Math.random()*6,va:(Math.random()-.5)*.25,col:colors[Math.floor(Math.random()*colors.length)]}));
  let raf,on=true;
  (function loop(){if(!on)return;x.clearRect(0,0,W,H);
    for(const p of parts){p.x+=p.vx+Math.sin(p.a)*.6*dpr;p.y+=p.vy;p.a+=p.va;
      if(embers){if(p.y<-20)p.y=H+20;x.globalAlpha=.75;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r*.7,0,7);x.fill()}
      else{if(p.y>H+20){p.y=-20;p.x=Math.random()*W}x.globalAlpha=1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}}
    raf=requestAnimationFrame(loop)})();
  return()=>{on=false;cancelAnimationFrame(raf)};
}

let lastBuzzT=null;
function drawTimer(){
  const el=$("#timer");if(!el)return;
  if(!st||!st.timer){el.hidden=true;return}
  const left=Math.max(0,(st.timer.endsAt-(Date.now()+offset))/1000);
  el.hidden=false;el.classList.toggle("end",left<=0);
  const tt=el.querySelector(".t"),sec=left<=0?"0":ar(Math.ceil(left));
  if(tt.textContent!==sec){tt.textContent=sec;if(left<=10){tt.classList.remove("tick");void tt.offsetWidth;tt.classList.add("tick")}}
  const C=2*Math.PI*26;el.querySelector(".fgc").style.strokeDashoffset=String(C*(1-left/st.timer.dur));
  if(left<=0&&lastBuzzT!==st.timer.id){lastBuzzT=st.timer.id;buzz([200,80,200])}
}

  (me.team||[]).filter(x=>x.id!==me.id&&isAlive(x.id)&&x.pick&&isAlive(x.pick)).forEach(x=>{t[x.pick]=(t[x.pick]||0)+1;at[x.pick]=Math.max(at[x.pick]||0,x.at||0)});
  const ids=Object.keys(t);if(!ids.length){lastMate=null;return""}
  const pick=ids.sort((a,b)=>t[b]-t[a]||at[b]-at[a])[0],n=t[pick];
  if(pick===me.id)return"";
  const withThem=me.sel.kill===pick,swap=lastMate&&lastMate!==pick;lastMate=pick;
  const mates=(me.team||[]).filter(x=>x.id!==me.id&&isAlive(x.id)&&x.pick===pick).map(x=>esc(nm(x.id))).join(" و");
  return`<button class="mate ${withThem?"with":""} ${swap?"swap":""}" ${withThem?"disabled":`data-a="act" data-k="kill" data-id="${pick}"`} aria-label="صوّت مع ربعك على ${esc(nm(pick))}">
    <span class="ttl">${n>1?"ربعك اختاروا":"خويك "+mates+" اختار"}</span><span class="who">${esc(nm(pick))}</span>
    <span class="how">${withThem?"صوّتت ويا خويك ✓":"دوس هني وصوّت ويا خويك على نفس الشخص"}</span></button>`;
}
const revealed=new Map();
function queryBox(others){
  const q=st.me.sel.query,left=st.me.queriesLeft,max=st.me.queryMax;
  const count=`<span class="chip b">باقي لك ${ar(left)} من ${ar(max)}</span>`;
  if(q){
    const bad=st.me.queryMafia,word=bad?"مافيا":"شعب",key=[st.gen,st.round,q].join("|");
    if(!revealed.has(key)){revealed.set(key,performance.now());buzz(bad?[60,40,60]:40)}
    const age=performance.now()-revealed.get(key),fresh=age<2600,d=`style="animation-delay:-${Math.round(age)}ms"`;
    const ids=others.includes(q)?others:[q,...others];
    return`<div class="panel"><h2>نتيجة الاستعلام</h2>${count}<div class="grid">${ids.map(id=>id===q
      ?`<button class="pick res ${bad?"m":"t"} ${fresh?"reveal":""}" ${fresh?d:""} disabled><span class="nmv">${esc(nm(id))}</span><span class="lbl">${word}</span>${fresh?`<span class="flash" ${d}>${word}</span>`:""}</button>`
      :`<button class="pick dim" disabled>${esc(nm(id))}</button>`).join("")}</div><p class="muted small">احفظ الجواب، يروح لما يقلب القاضي للخطوة الجاية.</p></div>`;
  }
  if(!left)return`<div class="panel nightbox"><h2>خلصت استعلاماتك</h2><p style="font-size:1.2rem">عاد الحين أنت وربعك بيّضوها 🔥</p></div>`;
  return`<div class="panel"><h2>استعلم عن مجرم</h2>${count}<p class="muted small">استعلام واحد بالليلة، وعدد استعلاماتك كلها بعدد المافيا. دوس على الشخص والجواب يطلع على اسمه.</p>${picker("query",others)}</div>`;
}
function bestPanel(){
  const b=st.best||[],town=st.winner==="town";
  const medal=["gold","silver","bronze"],lab=["الأول","الثاني","الثالث"];
  return`<div class="panel best ${town?"":"lost"}">${town?`<h2>أفضل لاعبين</h2>`:`<h2>ماقصرتو</h2><p class="muted">ترتيب الشعب</p>`}
    ${b.length?`<div class="podium">${b.map((x,i)=>`<div class="medal ${medal[i]}" style="animation-delay:${.3+i*.25}s"><span class="disc">${i+1}</span><span class="mn">${esc(x.name)}${st.me&&x.id===st.me.id?" (أنت)":""}</span><span class="ml">${lab[i]}</span></div>`).join("")}</div>`:`<p class="muted small">ما أحد من الشعب صوّت صح على مافيا.</p>`}</div>`;
}
function overView(){
  const w=st.winner;
  return bestPanel()+`<div class="panel"><h2 style="color:var(--${w==="town"?"town":"blood"})">${w==="town"?"فاز الشعب":"فازت المافيا"}</h2><table>${st.players.map(p=>{const r=st.reveal[p.id];return`<tr><td>${esc(p.name)}${p.id===st.me.id?" (أنت)":""}</td><td class="${isM(r.role)?"err":""}">${ROLE[r.role].n}${r.fake?" · شرطي مزيف":""}</td></tr>`}).join("")}</table><p class="muted small">انطر القاضي يبدا لعبة جديدة.</p></div>`;
}

/* ---------- الأحداث ---------- */
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="joinF")joinCode($("#codeIn").value);if(e.target.id==="nameF")submitName($("#nameIn").value)});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==="create")createRoom();
  else if(a==="leave")leave();
  else if(a==="endDemo")endDemo("");
  else if(a==="demoOpen"){demoOpen=!demoOpen;render()}
  else if(a==="persona")switchPersona(+b.dataset.i);
  else if(a==="demo")startDemo(+($("#demoN")&&$("#demoN").value||8));
  else if(a==="cmd")send({t:b.dataset.c,id});
  else if(a==="card"){
    cardOpen=!cardOpen;b.classList.toggle("open",cardOpen);
    buzz(15)}
  else if(a==="roles"){const body=document.querySelector(".roles-body");
    if(rolesOpen&&body){body.classList.add("closing");document.querySelector(".chev").classList.remove("up");setTimeout(()=>{rolesOpen=false;render()},230)}
    else{rolesOpen=true;rolesJust=true;render();rolesJust=false}}
  else if(a==="act"){const k=b.dataset.k;if((k==="query"||k==="vote")&&st.me.sel[k])return;send({t:"act",k,id,gen:st.gen});buzz(25)}
});
/* تموّج خفيف عند الضغط على أي زر */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.pick,.tab,.roles-head");if(!b||b.disabled||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.4,sp=document.createElement("span");
  sp.className="rip";sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(sp);setTimeout(()=>sp.remove(),650);
});
/* حفظ توكن اللاعب لكل غرفة عشان لو طلع ورجع */
setInterval(()=>{if(sess&&!sess.judge&&sess.token)lsSet("mafia.tok."+sess.code,sess.token)},1500);

if(sess&&sess.code){view="game";render();connect()}else render();

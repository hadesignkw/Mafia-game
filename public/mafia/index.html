// الصندوق اللي تحت على اليسار: نفس الشكل عند الكل
function camo(kind){
  const top=st.me.nightTop&&st.me.nightTop[kind],sel=st.me.sel[kind];
  const ttl=kind==="fguess"?"أكثر واحد يتوقعونه نصاب":"الشعب يشك أكثر شي في";
  if(!top||top.id===st.me.id)return`<button class="mate camo" disabled><span class="ttl">${ttl}</span><span class="who">محد اختار</span><span class="how">أول ما يختارون يطلع هني</span></button>`;
  const w=sel===top.id;
  return`<button class="mate camo ${w?"with":""}" ${w?"disabled":`data-a="act" data-k="${kind}" data-id="${top.id}"`}><span class="ttl">${ttl}</span><span class="who">${esc(nm(top.id))}</span><span class="how">${w?"اخترت نفسهم ✓":"دوس هني واختار نفسهم"}</span></button>`;
}
function mateCamo(fake){
  if(!fake){const h=mateCard();if(h)return h}
  const me=st.me,t={};(me.team||[]).filter(x=>x.id!==me.id&&isAlive(x.id)&&x.pick).forEach(x=>t[x.pick]=(t[x.pick]||0)+1);
  const ids=Object.keys(t).sort((a,b)=>t[b]-t[a]);
  if(fake&&ids.length){const id=ids[0],w=me.sel.fakecop===id;return`<button class="mate camo ${w?"with":""}" ${w?"disabled":`data-a="act" data-k="fakecop" data-id="${id}"`}><span class="ttl">ربعك اختاروا</span><span class="who">${id===me.id?"أنت":esc(nm(id))}</span><span class="how">${w?"اخترت وياهم ✓":"دوس هني واختار وياهم"}</span></button>`}
  return`<button class="mate camo" disabled><span class="ttl">ربعك اختاروا</span><span class="who">محد اختار</span><span class="how">أول ما يختارون يطلع هني</span></button>`;
}
/* الصبح: نسبة شك الشعب على كل لاعب، بدون أسماء المخمنين */
function suspectPanel(){
  const S=st.suspect;if(!st.adv||!S||!S.list.length)return"";
  return`<div class="panel suspect"><h3>شك الشعب الليلة اللي طافت</h3><div class="sbars">${S.list.map(x=>`<div class="sb"><span class="nm">${esc(nm(x.id))}</span><span class="bar"><i style="width:${x.pct}%"></i></span><b>${ar(x.pct)}٪</b></div>`).join("")}</div><p class="muted small">من تخمينات الكل بالليل، ومحد يعرف منو خمّن منو.</p></div>`;
}
function detectivePanel(){
  const d=st.detectives||[];if(!st.adv&&!st.online)return"";
  return`<div class="panel best det"><h2>أحسن محقق 🕵️</h2>${d.length?`<div class="list">${d.map((x,i)=>`<div class="li"><span class="nm">${["🥇","🥈","🥉"][i]} ${esc(x.name)}${st.me&&x.id===st.me.id?" (أنت)":""}</span><span class="chip t">${ar(x.pts)} ${x.pts===1?"نقطة":"نقاط"}</span></div>`).join("")}</div>`:`<p class="muted small">ما أحد من الشعب خمّن صح.</p>`}</div>`;
}
/* بالنهار اللاعبين يشوفون بس منو يسولف */
let lastSpk=null;
function speakerCard(){
  const t=st.timer;
  if(t)return""; // المؤقت الكبير فوق يبين للكل
  const k=t?t.id:null,fresh=k!==lastSpk;lastSpk=k;
  if(st.sniperPending)return`<div class="panel spk"><span class="lab">القناص يختار</span><span class="nm">${esc(nm(st.sniperPending))}</span><span class="muted small">يختار منو يسحب وياه.</span></div>`;
  return t?`<div class="panel spk ${fresh?"fresh":""}"><span class="lab">يسولف الحين</span><span class="nm">${esc(t.name)}</span><span class="dots"><i></i><i></i><i></i></span></div>`
    :`<div class="panel spk idle"><span class="lab">النهار</span><span class="nm">ننطر القاضي</span><span class="muted small">يختار منو يسولف.</span></div>`;
}
/* تحت يسار: الشخص اللي اختاره ربعك (الأكثر اختياراً)، تضغط عليه وتصوّت معهم */
let lastMate=null;
function mateCard(){
  const me=st.me,t={},at={};
  (me.team||[]).filter(x=>x.id!==me.id&&isAlive(x.id)&&x.pick&&isAlive(x.pick)).forEach(x=>{t[x.pick]=(t[x.pick]||0)+1;at[x.pick]=Math.max(at[x.pick]||0,x.at||0)});
  const ids=Object.keys(t);if(!ids.length){lastMate=null;return""}
  const pick=ids.sort((a,b)=>t[b]-t[a]||at[b]-at[a])[0],n=t[pick];
  if(pick===me.id)return"";
  const withThem=me.sel.kill===pick,swap=lastMate&&lastMate!==pick;lastMate=pick;
  const mates=(me.team||[]).filter(x=>x.id!==me.id&&isAlive(x.id)&&x.pick===pick).map(x=>esc(nm(x.id))).join(" و");
  return`<button class="mate ${withThem?"with":""} ${swap?"swap":""}" ${withThem?"disabled":`data-a="act" data-k="kill" data-id="${pick}"`} aria-label="صوّت مع ربعك على ${esc(nm(pick))}">
    <span class="ttl">${n>1?"ربعك اختاروا":"خويك "+mates+" اختار"}</span><span class="who">${esc(nm(pick))}</span>
    <span class="how">${withThem?"صوّتت ويا خويك ✓":"دوس هني وصوّت ويا خويك على نفس الشخص"}</span></button>`;
}
const revealed=new Map();
function queryBox(others){
  const q=st.me.sel.query,left=st.me.queriesLeft,max=st.me.queryMax;
  const count=`<span class="chip b">باقي لك ${ar(left)} من ${ar(max)}</span>`;
  if(q){
    const bad=st.me.queryMafia,word=bad?"مافيا":"شعب",key=[st.gen,st.round,q].join("|");
    if(!revealed.has(key)){revealed.set(key,performance.now());buzz(bad?[60,40,60]:40)}
    const age=performance.now()-revealed.get(key),fresh=age<2600,d=`style="animation-delay:-${Math.round(age)}ms"`;
    const ids=others.includes(q)?others:[q,...others];
    return`<div class="panel"><h2>نتيجة التفتيش</h2>${count}<div class="grid">${ids.map(id=>id===q
      ?`<button class="pick res ${bad?"m":"t"} ${fresh?"reveal":""}" ${fresh?d:""} disabled><span class="nmv">${esc(nm(id))}</span><span class="lbl">${word}</span>${fresh?`<span class="flash" ${d}>${word}</span>`:""}</button>`
      :`<button class="pick dim" disabled>${esc(nm(id))}</button>`).join("")}</div><p class="muted small">احفظ الجواب، يروح لما يقلب القاضي للخطوة الجاية.</p></div>`;
  }
  if(!left)return`<div class="panel nightbox"><h2>خلاص قزرتها، ما عندك أسئلة</h2><p style="font-size:1.2rem">عاد الحين أنت وربعك بيّضوها 🔥</p></div>`;
  return`<div class="panel"><h2>فتّش عن نصاب</h2>${count}<p class="muted small">تفتيش واحد بالليلة، وعدد تفتيشاتك كلها بعدد المافيا. دوس على الشخص والجواب يطلع على اسمه.</p>${picker("query",others)}</div>`;
}
function bestPanel(){
  const b=st.best||[],town=st.winner==="town";
  const medal=["gold","silver","bronze"],lab=["الأول","الثاني","الثالث"];
  return`<div class="panel best ${town?"":"lost"}">${town?`<h2>أفضل لاعبين</h2>`:`<h2>ماقصرتو</h2><p class="muted">ترتيب الشعب</p>`}
    ${b.length?`<div class="podium">${b.map((x,i)=>`<div class="medal ${medal[i]}" style="animation-delay:${.3+i*.25}s"><span class="disc">${i+1}</span><span class="mn">${esc(x.name)}${st.me&&x.id===st.me.id?" (أنت)":""}</span><span class="ml">${lab[i]}</span></div>`).join("")}</div>`:`<p class="muted small">ما أحد من الشعب صوّت صح على مافيا.</p>`}</div>`;
}
function overView(){
  const w=st.winner;
  return bestPanel()+detectivePanel()+`<div class="panel"><h2 style="color:var(--${w==="town"?"town":"blood"})">${w==="town"?"فاز الشعب":"فازت المافيا"}</h2><div class="reveal">${st.players.map((p,i)=>{const r=st.reveal[p.id],t=ROLE[r.role].team;return`<div class="mini ${t} ${p.alive?"":"out"} ${p.id===st.me.id?"me":""}" style="animation-delay:${(.4+i*.12).toFixed(2)}s">${portrait(r.role,"bust")}<b>${esc(p.name)}${p.id===st.me.id?" (أنت)":""}</b><span class="chip ${t}">${ROLE[r.role].n}${r.fake?" · النصاب":""}</span></div>`}).join("")}</div>${st.online?(st.me&&st.me.host?`<button class="btn primary" data-a="cmd" data-c="newGame">لعبة جديدة بنفس الغرفة</button>`:`<p class="muted small">انطر المضيف يبدا لعبة جديدة.</p>`):`<p class="muted small">انطر القاضي يبدا لعبة جديدة.</p>`}</div>`;
}

/* ---------- الأحداث ---------- */
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="joinF")joinCode($("#codeIn").value);if(e.target.id==="nameF")submitName($("#nameIn").value);if(e.target.id==="acctF")acctSubmit()});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==="create")createRoom();
  else if(a==="createOpen"){homeErr="";view="create";render();acctRefresh()}
  else if(a==="acctOpen"){acctMsg="";view="acct";render();acctRefresh()}
  else if(a==="acctBack"){acctMsg="";homeErr="";view="home";render()}
  else if(a==="acctMode"){acctMode=acctMode==="login"?"signup":"login";acctMsg="";render()}
  else if(a==="acctBuy")acctBuy(id);
  else if(a==="acctOut"){acctOut();acctMsg="";view="home";render()}
  else if(a==="leave")leave();
  else if(a==="guide")openGuide();
  else if(a==="endDemo")endDemo("");
  else if(a==="share")shareRoom();
  else if(a==="demoOpen"){demoOpen=!demoOpen;render()}
  else if(a==="persona")switchPersona(+b.dataset.i);
  else if(a==="demo")startDemo(+($("#demoN")&&$("#demoN").value||8));
  else if(a==="cmd")send(b.dataset.by?{t:b.dataset.c,id,by:b.dataset.by}:{t:b.dataset.c,id});
  else if(a==="set"&&st&&(st.judge||st.hostJ)){const JJ=st.judge||st.hostJ;const c={cops:1,docs:1,...(JJ.settings||{mode:"default",mafia:2,talk:40})};const k=b.dataset.k,v=b.dataset.v;if(k==="mode"){c.mode=v;if(v==="custom"){if(JJ.mafiaNext)c.mafia=JJ.mafiaNext;if(!c.cap||c.cap===30)c.cap=Math.max(st.minPlayers||6,st.players.length,15)}}else c[k]=+v;send({t:"settings",...c})}
  else if(a==="card"){
    cardOpen=!cardOpen;b.classList.remove("tilt","still");b.dataset.keep=`card|${st.gen}|${cardOpen?1:0}|${b.dataset.h}`;b.classList.toggle("open",cardOpen);
    const fi=b.querySelector(".flip-in");if(fi){fi.style.removeProperty("--rx");fi.style.removeProperty("--ry")}
    receptionAudio?.play(cardOpen?"flip":"slide",{gain:.9});buzz(cardOpen?[20,40,60]:15)}
  else if(a==="roles"){const body=document.querySelector(".roles-body");
    if(rolesOpen&&body){body.classList.add("closing");document.querySelector(".chev").classList.remove("up");setTimeout(()=>{rolesOpen=false;render()},230)}
    else{rolesOpen=true;rolesJust=true;render();rolesJust=false}}
  else if(a==="advHelp"){advHelpOpen=!advHelpOpen;render()}
  else if(a==="onlineToggle"){onlineCreate=!onlineCreate;render()}
  else if(a==="hostToggle"){hostOpen=!hostOpen}
  else if(a==="kickMid"){if(confirm(`تطرد ${nm(id)} من اللعبة؟ ما يقدر يرجع لها.`))send({t:"kick",id})}
  else if(a==="cancelGame"){if(confirm("تلغي اللعبة وترجع الكل للانتظار؟ اللي يبي يدخل يقدر يدخل بعدها."))send({t:"newGame"})}
  else if(a==="ready"){send({t:"ready",v:b.dataset.v==="1"})}
  else if(a==="act"){const k=b.dataset.k;if((k==="query"||k==="vote")&&st.me.sel[k])return;send({t:"act",k,id,gen:st.gen});buzz(25)}
});
/* تموّج خفيف عند الضغط على أي زر */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.pick,.tab,.roles-head");if(!b||b.disabled||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.4,sp=document.createElement("span");
  sp.className="rip";sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(sp);setTimeout(()=>sp.remove(),650);
});
/* الكرت يميل مع الإصبع والضو يلحقه */
const noMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
document.addEventListener("pointermove",e=>{
  const f=e.target.closest&&e.target.closest(".flip");if(!f||noMotion())return;
  const r=f.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const fi=f.querySelector(".flip-in"),open=f.classList.contains("open");if(!fi)return;
  f.classList.add("tilt");
  fi.style.setProperty("--rx",((.5-y)*12).toFixed(2)+"deg");fi.style.setProperty("--ry",((x-.5)*(open?-16:16)).toFixed(2)+"deg");
  f.style.setProperty("--gx",((open?1-x:x)*100).toFixed(1)+"%");f.style.setProperty("--gy",(y*100).toFixed(1)+"%");
});
const untilt=f=>{if(!f)return;f.classList.remove("tilt");const fi=f.querySelector(".flip-in");if(fi){fi.style.removeProperty("--rx");fi.style.removeProperty("--ry")}};
document.addEventListener("pointerout",e=>{const f=e.target.closest&&e.target.closest(".flip");if(f&&!f.contains(e.relatedTarget))untilt(f)});
document.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")untilt(e.target.closest&&e.target.closest(".flip"))});
/* حفظ توكن اللاعب لكل غرفة عشان لو طلع ورجع */
setInterval(()=>{if(sess&&!sess.judge&&sess.token)lsSet("mafia.tok."+sess.code,sess.token)},1500);

const linkCode=(new URLSearchParams(location.search).get("r")||"").replace(/\D/g,"");
if(linkCode)try{history.replaceState(null,"",location.pathname)}catch{}
if(/^\d{4}$/.test(linkCode)&&!(sess&&sess.code===linkCode)){
  if(sess){try{ws&&ws.close()}catch{}sess=null;lsSet("mafia.sess",null)}
  render();(async()=>{await nap(1700);for(let k=1;k<=4;k++){nbInput(linkCode.slice(0,k));await nap(260)}await nap(600);joinCode(linkCode)})();
}else if(sess&&sess.code){view="game";render();connect()}else render();
</script>

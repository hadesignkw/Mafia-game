<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>طيران الزفت</title>
<link rel="icon" href="/plane/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/plane/apple-touch-icon.png">
<link rel="manifest" href="/plane/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طيران الزفت">
<meta property="og:title" content="طيران الزفت">
<meta property="og:description" content="أسوأ شركة طيران بالعالم، وإنتوا الطاقم.">
<meta property="og:image" content="https://ha-games.habeeb3.workers.dev/plane/og.jpg">
<link rel="preload" href="/fonts/readex-pro-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/readex-pro-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/noir.css">
<style>
:root{--ink:#0b1020;--paper:#f3ecd9;--brass:#c9a35b;--brass-hi:#ecd29a;--sky:#7fb7e8;--red:#d94c3d;--font:"Readex Pro",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--font);-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* ---------- الاستقبال ---------- */
#lobby{position:fixed;inset:0;z-index:5;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% -10%,#1d2f55,#0b1020 60%)}
.wrap{max-width:460px;margin:0 auto}
h1{margin:18px 0 4px;font-size:2.6rem;line-height:1.05;text-align:center;text-shadow:0 2px 0 #000,0 0 24px rgb(127 183 232 / .3)}
.sub{margin:0 0 22px;text-align:center;color:#a9b4c8;font-size:.95rem}
.card{background:rgb(255 255 255 / .05);border:1px solid rgb(255 255 255 / .1);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:#a9b4c8;margin:0 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgb(255 255 255 / .15);background:rgb(0 0 0 / .3);color:var(--paper);font:inherit;font-size:1.05rem;text-align:center}
input:focus{outline:2px solid var(--sky)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:1.1rem;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#1d1408;box-shadow:0 6px 18px rgb(0 0 0 / .4);margin-top:12px}
.btn.alt{background:rgb(255 255 255 / .08);color:var(--paper);border:1px solid rgb(255 255 255 / .15);box-shadow:none}
.btn:disabled{opacity:.45}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.look{padding:10px 6px;border-radius:12px;border:2px solid transparent;background:rgb(0 0 0 / .25);text-align:center;font-size:.85rem;display:grid;gap:4px;justify-items:center}
.look i{display:block;width:34px;height:34px;border-radius:50% 50% 40% 40%;position:relative}
.look i::after{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;border-radius:50%;background:#e8b98f;transform:translateX(-50%)}
.look.on{border-color:var(--brass-hi);background:rgb(201 163 91 / .15)}
.code{font-size:3rem;letter-spacing:.25em;text-align:center;font-weight:700;color:var(--brass-hi);text-shadow:0 2px 0 #000;margin:4px 0}
.code small{display:block;font-size:.8rem;letter-spacing:0;color:#a9b4c8;font-weight:400}
.list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.list span{padding:6px 12px;border-radius:99px;background:rgb(255 255 255 / .08);font-size:.9rem}
.list span.host{border:1px solid var(--brass)}
.list span.off{opacity:.4}
.err{color:#ff9f93;text-align:center;min-height:1.4em;font-size:.9rem;margin-top:8px}
.hide{display:none !important}
/* ---------- اللعبة ---------- */
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{pointer-events:auto;padding:7px 12px;border-radius:99px;background:rgb(0 0 0 / .45);backdrop-filter:blur(6px);font-size:.82rem;border:1px solid rgb(255 255 255 / .12)}
.pill b{color:var(--brass-hi)}
#feed{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 44px);left:0;right:0;display:grid;justify-items:center;gap:6px;pointer-events:none}
#feed div{padding:8px 16px;border-radius:14px;background:rgb(0 0 0 / .55);font-weight:700;font-size:1rem;animation:pop .35s cubic-bezier(.2,1.4,.4,1),fade .5s 2.6s both;max-width:85vw;text-align:center}
#feed div.big{font-size:1.4rem;background:rgb(217 76 61 / .85);color:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{to{opacity:0;transform:translateY(-8px)}}
#tilt{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 4px);left:50%;transform:translateX(-50%);width:70px;height:26px;border-radius:99px;background:rgb(0 0 0 / .45);border:1px solid rgb(255 255 255 / .12);overflow:hidden}
#tilt i{position:absolute;left:50%;top:50%;width:46px;height:3px;background:var(--brass-hi);transform-origin:center;transform:translate(-50%,-50%) rotate(0)}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .18);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgb(255 255 255 / .35);transform:translate(-50%,-50%);box-shadow:0 4px 12px rgb(0 0 0 / .4)}
.acts{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));display:grid;gap:12px;justify-items:end;pointer-events:auto}
.act{width:84px;height:84px;border-radius:50%;background:rgb(201 163 91 / .85);color:#1d1408;font-weight:800;font-size:1.05rem;box-shadow:0 6px 18px rgb(0 0 0 / .45);display:grid;place-items:center;line-height:1.1;text-align:center}
.act.small{width:64px;height:64px;font-size:.9rem;background:rgb(255 255 255 / .25);color:var(--paper)}
.act:active{transform:scale(.93)}
.act.hide{display:none}
#say{position:absolute;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#say button{padding:8px 11px;border-radius:99px;background:rgb(0 0 0 / .5);border:1px solid rgb(255 255 255 / .15);font-size:.8rem}
#sat{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 44px);right:12px;display:flex;align-items:center;gap:8px;font-size:.78rem;background:rgb(0 0 0 / .45);padding:5px 10px;border-radius:99px;border:1px solid rgb(255 255 255 / .12)}
#sat i{display:block;width:90px;height:8px;border-radius:99px;background:rgb(255 255 255 / .15);overflow:hidden}#sat b{display:block;height:100%;width:100%;background:#5dc46f;transition:width .6s}
#galley{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(130px + env(safe-area-inset-bottom));display:grid;gap:8px;pointer-events:auto}
#galley button{padding:10px 14px;border-radius:99px;background:rgb(242 177 52 / .9);color:#1d1408;font-weight:700;font-size:.95rem;box-shadow:0 4px 12px rgb(0 0 0 / .4)}
#end{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgb(11 16 32 / .82);pointer-events:auto;padding:16px}
#end .box{background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .12);border-radius:22px;padding:18px 22px;max-width:520px;width:100%;text-align:center;max-height:92vh;overflow:auto}
#end img{width:70px;display:block;margin:0 auto 6px}#end h2{margin:4px 0 10px;font-size:1.4rem}
#end .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}#end .stats div{background:rgb(0 0 0 / .3);border-radius:12px;padding:8px 4px}#end .stats b{display:block;font-size:1.3rem;color:var(--brass-hi)}#end .stats span{font-size:.72rem;color:#a9b4c8}
#end .btn{margin-top:4px}#end .sub{margin:8px 0 0;font-size:.8rem}
#hand{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:.95rem;background:rgb(0 0 0 / .5);padding:6px 14px;border-radius:99px;border:1px solid rgb(255 255 255 / .15)}
#rot{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:var(--ink);text-align:center;padding:30px;font-size:1.3rem;font-weight:700}
@media (orientation:portrait){#rot.on{display:grid}}
</style>
</head>
<body>
<div class="noir" aria-hidden="true"><span class="smoke"></span><span class="grain"></span><span class="vignette"></span></div>

<section id="lobby">
  <div class="wrap">
    <img src="/plane/logo-dark.jpg" alt="طيران الزفت" style="display:block;width:min(82%,340px);margin:4px auto 6px;border-radius:18px">
    <p class="sub">أسوأ شركة طيران بالعالم، وإنتوا الطاقم. نسخة تجربة.</p>

    <div class="card" id="c-enter">
      <label>اسمك</label>
      <input id="name" maxlength="16" autocomplete="off" placeholder="اكتب اسمك">
      <label style="margin-top:12px">شكلك بالطاقم</label>
      <div class="looks" id="looks"></div>
      <button class="btn" id="bCreate">افتح طيارة جديدة</button>
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
        <input id="code" inputmode="numeric" maxlength="4" placeholder="رمز الطيارة" style="flex:1">
        <button class="btn alt" id="bJoin" style="margin:0;flex:1">ادخل</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div class="card hide" id="c-wait">
      <div class="code" id="codeBox">0000<small>عطوا الرمز للربع يدخلون من تلفوناتهم</small></div>
      <div class="list" id="plist"></div>
      <button class="btn" id="bStart">ابدأ الرحلة</button>
      <p class="sub" id="waitNote" style="margin:10px 0 0"></p>
      <button class="btn alt" id="bLeave">اطلع</button>
    </div>
  </div>
</section>

<div id="rot">لف التلفون بالعرض 📱↔️<br><small style="font-weight:400;font-size:.9rem">اللعبة تنلعب بالعرض عشان تشوف الطيارة كلها</small></div>

<div id="game" class="hide">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="top">
      <div class="pill" id="who"><b>—</b></div>
      <div class="pill" id="info">✈️ <b id="pilotName">بدون طيار!</b> · ⏱ <b id="flight">5:00</b></div>
    </div>
    <div id="sat"><span>رضا الركاب</span><i><b id="satBar"></b></i><span id="satN">100%</span></div>
    <div id="galley" class="hide"><button data-k="1">🥤 ماي</button><button data-k="2">☕ شاي</button><button data-k="3">🍗 أكل</button></div>
    <div id="end" class="hide"><div class="box"><img src="/plane/badge.png" alt=""><div id="endTxt"></div><button class="btn hide" id="bAgain">رحلة ثانية ✈️</button><p class="sub">ننطر المضيف يفتح رحلة ثانية…</p></div></div>
    <div id="tilt"><i></i></div>
    <div id="feed"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="hand" class="hide"></div>
    <div id="say">
      <button data-s="اسكت واقعد!">اسكت واقعد!</button><button data-s="منو الحمار اللي يسوق؟!">منو الحمار اللي يسوق؟!</button><button data-s="يمّه!">يمّه!</button><button data-s="بنزّلك من الباب!">بنزّلك من الباب!</button>
    </div>
    <div class="acts">
      <button class="act small hide" id="bJump">نط</button>
      <button class="act" id="bAct">مسك</button>
    </div>
  </div>
</div>

<script type="module">
import * as T from "./three.min.js";
import {makeChar,setFace,pose} from "./chars.js";
import {buildCabin as buildCabin2,makeProp,PROP_KINDS,C as PAL} from "./cabin.js";
"use strict";
/* ================= الإعدادات ================= */
const LOOKS={captain:{n:"الكابتن",c:0x24365c},steward:{n:"المضيف",c:0x9b2d3a},stewardess:{n:"المضيفة",c:0x7a3b7a},guard:{n:"الأمن",c:0x1a1a1f},mechanic:{n:"الفني",c:0x5a6b3a},cleaner:{n:"عامل النظافة",c:0x2a7a86}};
const PAX_LINES=["وين القبلة؟!","هذا شاي؟ هذا ماي حار!","أبي آيباد!","قلت لكم نروح بالسيارة","يمّه قلبي!","خخخ…","منو الحمار اللي يسوق؟!","أبي أنزل من هالزفت!","الحين نهبط ولا شنو؟","صوروا المطب!","شنو هالطيران الزبالة؟","هذا طيار ولا سواق وانيت؟","يا خبل انتبه!","الله يقطع هالشركة","ولد! وين الأكل؟","أنا دافع ٣٠٠ دينار على هالخرابة؟","مضيف هبيل","خلصونا نبي ننزل","يا حمار الباب مفتوح!","لا تلمسني يا زقرتي!"];
const LINES_TURB=["يا حمار! انتبه!","منو هالخبل اللي يسوق؟!","يمّه! قلبي طاح!","شنو هالسواقة الزفت!","الله ياخذك يا طيار","أنا بشتكي عليكم!","طيران حمير والله","بطني! بطني!"];
const LINES_NOPILOT=["وين راح الطيار يا بهايم؟!","محد يسوق؟! محد يسوق؟!","الطيار بالحمام والطيارة تطيح!","يا الله يا الله!","منو المسؤول هني؟ منو؟!","شركة زبالة!"];
const LINES_GRAB=["حطني! حطني يا حمار!","لا تلمسني يا زقرتي!","بشتكي عليك!","ليش أنا؟! ليش؟!","يمّه! بيرموني!","خل عنك يا خبل!"];
const LINES_THROWN=["يا كلاااب!","بتشوفون!!","أممممي!","الله ياخذكم!","يا حميييير!"];
const ITEMS={1:{n:"ماي",e:"🥤"},2:{n:"شاي",e:"☕"},3:{n:"أكل",e:"🍗"}};
const LINES_REQ={1:["ولد! ماي!","أبي ماي، عطشان!","وين الماي يا جماعة؟"],2:["شاي! شاي حليب!","أبي شاي، مو ماي!","وين الشاي؟ من ساعة أطلب"],3:["جوعان! وين الأكل؟","أبي أكل، أي شي!","الأكل متى؟ بموت جوع"]};
const LINES_MOOD1=["ولد! وين طلبي؟","من ساعة وأنا أطلب!","هذي خدمة ولا شنو؟","أنا أكلمك يا مضيف!","والله عيب عليكم","ما تشوفوني رافع يدي؟"];
const LINES_MOOD2=["يا كلب وين طلبي؟!","يلعن أبو هالشركة!","يا حيوان أنا أكلمك!","غبي! غبي! غبي!","والله لأطيحك من الطيارة!","تافهين كلكم!","يا بهيمة تعال هني!","شركة حمير وطاقم حمير!","بشتكي وبخرب بيتكم!"];
const LINES_MOOD3=["خلاص بجيب طلبي بنفسي يا كلاب!","قوموا كلكم! وين المطبخ؟!","أنا بسوق بنفسي أحسن منكم!","بكسر الطيارة على روسكم!"];
const LINES_WRONG=["قلت {w} يا غبي! مو {g}!","هذا {g}؟! أنا طلبت {w} يا حمار!","يا بهيمة {w}! {w}!"];
const LINES_THANKS=["أخيراً يا بطيء","عمرك ما تشتغل بمكان محترم","يالله روح من وجهي","هاه، تدري تشتغل!","وين كنت يا حيوان؟ هات"];
const LINES_SIT=["لا لا هذا بيقتلنا","الله يستر","هذا يعرف يسوق؟","عطوه سيارة لعبة أول"];
const PAX_NAMES=["العم","اليدة","الياهل","السنابي","النايم","بوشنط","المتوتر","بوجيم","السايح","بزنس","الخالة","بوسبحة","ناصر","جاسم","بدر","مشعل","الخروف"];
const CAB={w:8.4,h:2.9,z0:-13,z1:13,door:{z0:1.2,z1:2.9}};   // الكابينة: عرض وطول وموقع الباب (يسار)
const PILOT={x:0,y:0,z:-12};
const SEAT_ROWS=[];for(let z=-7;z<=10;z+=2.1)SEAT_ROWS.push(z);
const SEATS=[];for(const z of SEAT_ROWS)for(const x of[-3.5,-2.75,2.75,3.5])SEATS.push({x,z});
const G=14;
const FLIGHT_SEC=300; // طول الرحلة: ٥ دقايق
/* ================= حالة ================= */
let ws=null,me=null,room=null,isHost=false,started=false,pid=null,token=null;
const others={};   // اللاعبين الثانين: pid → actor
let sim=null;      // المضيف: الفيزياء (الركاب والأغراض والطيارة)
let world={roll:0,pitch:0,pilot:null,k:0};  // آخر حالة من المضيف
const lastPos={};
/* ================= الاستقبال ================= */
const $=s=>document.querySelector(s);
const err=t=>{$("#err").textContent=t||""};
let look=localStorage.getItem("plane.look")||"steward";
$("#name").value=localStorage.getItem("plane.name")||"";
function drawLooks(){$("#looks").innerHTML=Object.entries(LOOKS).map(([k,v])=>`<button class="look ${k===look?"on":""}" data-k="${k}"><i style="background:#${v.c.toString(16).padStart(6,"0")}"></i>${v.n}</button>`).join("");
  $("#looks").querySelectorAll(".look").forEach(b=>b.onclick=()=>{look=b.dataset.k;localStorage.setItem("plane.look",look);drawLooks();if(ws&&ws.readyState===1)send({t:"look",look})})}
drawLooks();
$("#bCreate").onclick=async()=>{const n=$("#name").value.trim();if(!n)return err("اكتب اسمك أول.");err("");$("#bCreate").disabled=true;
  try{const r=await fetch("/api/plane/create",{method:"POST"});const j=await r.json();if(!r.ok)throw new Error(j.error||"ما قدرت");connect(j.code,n)}catch(e){err(e.message)}finally{$("#bCreate").disabled=false}};
$("#bJoin").onclick=async()=>{const n=$("#name").value.trim(),c=$("#code").value.trim();if(!n)return err("اكتب اسمك أول.");if(!/^\d{4}$/.test(c))return err("الرمز ٤ أرقام.");err("");
  const j=await fetch("/api/plane/exists?code="+c).then(r=>r.json()).catch(()=>({}));if(!j.ok)return err("ما فيه طيارة بهالرمز.");connect(c,n)};
$("#bStart").onclick=()=>{audioInit();send({t:"start"})};
$("#bLeave").onclick=()=>{send({t:"leave"});location.reload()};
function connect(code,name){localStorage.setItem("plane.name",name);
  const saved=JSON.parse(sessionStorage.getItem("plane."+code)||"null");
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/plane/ws?code="+code);
  ws.onopen=()=>send({t:"join",name,look,pid:saved&&saved.pid,token:saved&&saved.token});
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{if(started)toast("انقطع الاتصال… نحاول نرجع");setTimeout(()=>{if(room)connect(code,name)},1500)};
  setInterval(()=>send({t:"ping"}),25e3)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function onMsg(m){
  if(m.t==="error")return err(m.text);
  if(m.t==="gone"){alert(m.text);location.reload();return}
  if(m.t==="you"){pid=m.pid;token=m.token;me={name:m.name,look:m.look};$("#who").innerHTML=`<b>${esc(m.name)}</b>`;return}
  if(m.t==="room"){room=m;sessionStorage.setItem("plane."+m.code,JSON.stringify({pid,token}));const wasHost=isHost;isHost=m.host===pid;
    $("#c-enter").classList.add("hide");$("#c-wait").classList.remove("hide");$("#codeBox").firstChild.textContent=m.code;

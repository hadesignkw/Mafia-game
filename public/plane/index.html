<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>طيران الديوان</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/readex-pro-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/readex-pro-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/noir.css">
<style>
:root{--ink:#0b1020;--paper:#f3ecd9;--brass:#c9a35b;--brass-hi:#ecd29a;--sky:#7fb7e8;--red:#d94c3d;--font:"Readex Pro",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--font);-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* ---------- الاستقبال ---------- */
#lobby{position:fixed;inset:0;z-index:5;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% -10%,#1d2f55,#0b1020 60%)}
.wrap{max-width:460px;margin:0 auto}
h1{margin:18px 0 4px;font-size:2.6rem;line-height:1.05;text-align:center;text-shadow:0 2px 0 #000,0 0 24px rgb(127 183 232 / .3)}
.sub{margin:0 0 22px;text-align:center;color:#a9b4c8;font-size:.95rem}
.card{background:rgb(255 255 255 / .05);border:1px solid rgb(255 255 255 / .1);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:#a9b4c8;margin:0 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgb(255 255 255 / .15);background:rgb(0 0 0 / .3);color:var(--paper);font:inherit;font-size:1.05rem;text-align:center}
input:focus{outline:2px solid var(--sky)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:1.1rem;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#1d1408;box-shadow:0 6px 18px rgb(0 0 0 / .4);margin-top:12px}
.btn.alt{background:rgb(255 255 255 / .08);color:var(--paper);border:1px solid rgb(255 255 255 / .15);box-shadow:none}
.btn:disabled{opacity:.45}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.look{padding:10px 6px;border-radius:12px;border:2px solid transparent;background:rgb(0 0 0 / .25);text-align:center;font-size:.85rem;display:grid;gap:4px;justify-items:center}
.look i{display:block;width:34px;height:34px;border-radius:50% 50% 40% 40%;position:relative}
.look i::after{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;border-radius:50%;background:#e8b98f;transform:translateX(-50%)}
.look.on{border-color:var(--brass-hi);background:rgb(201 163 91 / .15)}
.code{font-size:3rem;letter-spacing:.25em;text-align:center;font-weight:700;color:var(--brass-hi);text-shadow:0 2px 0 #000;margin:4px 0}
.code small{display:block;font-size:.8rem;letter-spacing:0;color:#a9b4c8;font-weight:400}
.list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.list span{padding:6px 12px;border-radius:99px;background:rgb(255 255 255 / .08);font-size:.9rem}
.list span.host{border:1px solid var(--brass)}
.list span.off{opacity:.4}
.err{color:#ff9f93;text-align:center;min-height:1.4em;font-size:.9rem;margin-top:8px}
.hide{display:none !important}
/* ---------- اللعبة ---------- */
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{pointer-events:auto;padding:7px 12px;border-radius:99px;background:rgb(0 0 0 / .45);backdrop-filter:blur(6px);font-size:.82rem;border:1px solid rgb(255 255 255 / .12)}
.pill b{color:var(--brass-hi)}
#feed{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 44px);left:0;right:0;display:grid;justify-items:center;gap:6px;pointer-events:none}
#feed div{padding:8px 16px;border-radius:14px;background:rgb(0 0 0 / .55);font-weight:700;font-size:1rem;animation:pop .35s cubic-bezier(.2,1.4,.4,1),fade .5s 2.6s both;max-width:85vw;text-align:center}
#feed div.big{font-size:1.4rem;background:rgb(217 76 61 / .85);color:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{to{opacity:0;transform:translateY(-8px)}}
#tilt{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 4px);left:50%;transform:translateX(-50%);width:70px;height:26px;border-radius:99px;background:rgb(0 0 0 / .45);border:1px solid rgb(255 255 255 / .12);overflow:hidden}
#tilt i{position:absolute;left:50%;top:50%;width:46px;height:3px;background:var(--brass-hi);transform-origin:center;transform:translate(-50%,-50%) rotate(0)}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .18);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgb(255 255 255 / .35);transform:translate(-50%,-50%);box-shadow:0 4px 12px rgb(0 0 0 / .4)}
.acts{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));display:grid;gap:12px;justify-items:end;pointer-events:auto}
.act{width:84px;height:84px;border-radius:50%;background:rgb(201 163 91 / .85);color:#1d1408;font-weight:800;font-size:1.05rem;box-shadow:0 6px 18px rgb(0 0 0 / .45);display:grid;place-items:center;line-height:1.1;text-align:center}
.act.small{width:64px;height:64px;font-size:.9rem;background:rgb(255 255 255 / .25);color:var(--paper)}
.act:active{transform:scale(.93)}
.act.hide{display:none}
#say{position:absolute;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#say button{padding:8px 11px;border-radius:99px;background:rgb(0 0 0 / .5);border:1px solid rgb(255 255 255 / .15);font-size:.8rem}
#rot{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:var(--ink);text-align:center;padding:30px;font-size:1.3rem;font-weight:700}
@media (orientation:portrait){#rot.on{display:grid}}
</style>
</head>
<body>
<div class="noir" aria-hidden="true"><span class="smoke"></span><span class="grain"></span><span class="vignette"></span></div>

<section id="lobby">
  <div class="wrap">
    <h1>طيران الديوان ✈️</h1>
    <p class="sub">أسوأ شركة طيران بالعالم، وإنتوا الطاقم. نسخة تجربة.</p>

    <div class="card" id="c-enter">
      <label>اسمك</label>
      <input id="name" maxlength="16" autocomplete="off" placeholder="اكتب اسمك">
      <label style="margin-top:12px">شكلك بالطاقم</label>
      <div class="looks" id="looks"></div>
      <button class="btn" id="bCreate">افتح طيارة جديدة</button>
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
        <input id="code" inputmode="numeric" maxlength="4" placeholder="رمز الطيارة" style="flex:1">
        <button class="btn alt" id="bJoin" style="margin:0;flex:1">ادخل</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div class="card hide" id="c-wait">
      <div class="code" id="codeBox">0000<small>عطوا الرمز للربع يدخلون من تلفوناتهم</small></div>
      <div class="list" id="plist"></div>
      <button class="btn" id="bStart">ابدأ الرحلة</button>
      <p class="sub" id="waitNote" style="margin:10px 0 0"></p>
      <button class="btn alt" id="bLeave">اطلع</button>
    </div>
  </div>
</section>

<div id="rot">لف التلفون بالعرض 📱↔️<br><small style="font-weight:400;font-size:.9rem">اللعبة تنلعب بالعرض عشان تشوف الطيارة كلها</small></div>

<div id="game" class="hide">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="top">
      <div class="pill" id="who"><b>—</b></div>
      <div class="pill" id="info">✈️ <b id="pilotName">بدون طيار!</b></div>
    </div>
    <div id="tilt"><i></i></div>
    <div id="feed"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="say">
      <button data-s="هلا والله!">هلا والله!</button><button data-s="منو يسوق؟!">منو يسوق؟!</button><button data-s="يمّه!">يمّه!</button><button data-s="اقعد مكانك!">اقعد مكانك!</button>
    </div>
    <div class="acts">
      <button class="act small hide" id="bJump">نط</button>
      <button class="act" id="bAct">مسك</button>
    </div>
  </div>
</div>

<script type="module">
import * as T from "./three.min.js";
"use strict";
/* ================= الإعدادات ================= */
const LOOKS={captain:{n:"الكابتن",c:0x24365c},steward:{n:"المضيف",c:0x9b2d3a},stewardess:{n:"المضيفة",c:0x7a3b7a},guard:{n:"الأمن",c:0x1a1a1f},mechanic:{n:"الفني",c:0x5a6b3a},cleaner:{n:"عامل النظافة",c:0x2a7a86}};
const PAX_LINES=["وين القبلة؟!","هذا شاي؟ هذا ماي حار!","أبي آيباد!","قلت لكم نروح بالسيارة","يمّه قلبي!","خخخ…","منو يسوق هالطيارة؟!","أبي أنزل!","الحين نهبط؟","صوروا المطب!"];
const PAX_NAMES=["العم","اليدة","الياهل","السنابي","النايم","بوشنط","المتوتر","بوجيم","السايح","بزنس","الخالة","بوسبحة","ناصر","جاسم","بدر","مشعل"];
const CAB={w:4.8,h:2.5,z0:-13,z1:13,door:{z0:1.2,z1:2.9}};   // الكابينة: عرض وطول وموقع الباب (يسار)
const PILOT={x:0,y:0,z:-12};
const SEAT_ROWS=[];for(let z=-7;z<=10;z+=1.7)SEAT_ROWS.push(z);
const SEATS=[];for(const z of SEAT_ROWS)for(const x of[-1.95,-1.3,1.3,1.95])SEATS.push({x,z});
const G=14;
/* ================= حالة ================= */
let ws=null,me=null,room=null,isHost=false,started=false,pid=null,token=null;
const others={};   // اللاعبين الثانين: pid → actor
let sim=null;      // المضيف: الفيزياء (الركاب والأغراض والطيارة)
let world={roll:0,pitch:0,pilot:null,k:0};  // آخر حالة من المضيف
const lastPos={};
/* ================= الاستقبال ================= */
const $=s=>document.querySelector(s);
const err=t=>{$("#err").textContent=t||""};
let look=localStorage.getItem("plane.look")||"steward";
$("#name").value=localStorage.getItem("plane.name")||"";
function drawLooks(){$("#looks").innerHTML=Object.entries(LOOKS).map(([k,v])=>`<button class="look ${k===look?"on":""}" data-k="${k}"><i style="background:#${v.c.toString(16).padStart(6,"0")}"></i>${v.n}</button>`).join("");
  $("#looks").querySelectorAll(".look").forEach(b=>b.onclick=()=>{look=b.dataset.k;localStorage.setItem("plane.look",look);drawLooks();if(ws&&ws.readyState===1)send({t:"look",look})})}
drawLooks();
$("#bCreate").onclick=async()=>{const n=$("#name").value.trim();if(!n)return err("اكتب اسمك أول.");err("");$("#bCreate").disabled=true;
  try{const r=await fetch("/api/plane/create",{method:"POST"});const j=await r.json();if(!r.ok)throw new Error(j.error||"ما قدرت");connect(j.code,n)}catch(e){err(e.message)}finally{$("#bCreate").disabled=false}};
$("#bJoin").onclick=async()=>{const n=$("#name").value.trim(),c=$("#code").value.trim();if(!n)return err("اكتب اسمك أول.");if(!/^\d{4}$/.test(c))return err("الرمز ٤ أرقام.");err("");
  const j=await fetch("/api/plane/exists?code="+c).then(r=>r.json()).catch(()=>({}));if(!j.ok)return err("ما فيه طيارة بهالرمز.");connect(c,n)};
$("#bStart").onclick=()=>send({t:"start"});
$("#bLeave").onclick=()=>{send({t:"leave"});location.reload()};
function connect(code,name){localStorage.setItem("plane.name",name);
  const saved=JSON.parse(sessionStorage.getItem("plane."+code)||"null");
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/plane/ws?code="+code);
  ws.onopen=()=>send({t:"join",name,look,pid:saved&&saved.pid,token:saved&&saved.token});
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{if(started)toast("انقطع الاتصال… نحاول نرجع");setTimeout(()=>{if(room)connect(code,name)},1500)};
  setInterval(()=>send({t:"ping"}),25e3)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function onMsg(m){
  if(m.t==="error")return err(m.text);
  if(m.t==="gone"){alert(m.text);location.reload();return}
  if(m.t==="you"){pid=m.pid;token=m.token;me={name:m.name,look:m.look};$("#who").innerHTML=`<b>${esc(m.name)}</b>`;return}
  if(m.t==="room"){room=m;sessionStorage.setItem("plane."+m.code,JSON.stringify({pid,token}));const wasHost=isHost;isHost=m.host===pid;
    $("#c-enter").classList.add("hide");$("#c-wait").classList.remove("hide");$("#codeBox").firstChild.textContent=m.code;
    $("#plist").innerHTML=m.players.map(p=>`<span class="${p.id===m.host?"host":""} ${p.on?"":"off"}">${esc(p.name)} · ${LOOKS[p.look].n}${p.id===m.host?" 👑":""}</span>`).join("");
    $("#bStart").classList.toggle("hide",!isHost);$("#waitNote").textContent=isHost?"إنت المضيف: تلفونك يحسب الفيزياء للكل. ابدأ لما يدخل الربع.":"ننطر المضيف يبدي الرحلة…";
    for(const p of m.players)if(p.id!==pid&&!others[p.id])others[p.id]=mkActor({id:p.id,name:p.name,look:p.look,player:true});
    for(const id in others)if(!m.players.some(p=>p.id===id)){scene.remove(others[id].g);delete others[id]}
    if(m.started&&!started)startGame(m.seed);
    if(started&&isHost&&!wasHost&&!sim){sim=mkSim(m.seed);sim.adopt(world);toast("صرت المضيف 👑")}
    if(started&&!isHost&&sim)sim=null;
    return}
  if(!started)return;
  if(m.t==="pos"){for(const id in m.p){if(id===pid)continue;const a=others[id];if(!a)continue;const v=m.p[id];a.tx=v[0];a.ty=v[1];a.tz=v[2];a.try=v[3];a.anim=v[4]}return}
  if(m.t==="state"){if(!isHost)applyState(m);return}
  if(m.t==="act"){if(sim)sim.act(m.pid,m.a,m.d);return}
  if(m.t==="ev"){onEvent(m);return}
  if(m.t==="say"){const a=m.pid===pid?my:others[m.pid];if(a)bubble(a,m.text);return}
  if(m.t==="need"&&sim){sim.sendState(m.pid);return}
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ================= المشهد ================= */
const cv=$("#cv"),R=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(0x9fcbee);scene.fog=new T.Fog(0x9fcbee,30,80);
const cam=new T.PerspectiveCamera(70,1,.05,120);
const cabin=new T.Group();scene.add(cabin);
const sky=new T.Group();scene.add(sky);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener("resize",resize);resize();
scene.add(new T.HemisphereLight(0xfff4e0,0x6b7a8f,1.1));const sun=new T.DirectionalLight(0xffffff,1.4);sun.position.set(3,6,-4);scene.add(sun);
const M=(c,o={})=>new T.MeshLambertMaterial({color:c,...o});
function box(w,h,d,c,x,y,z,parent=cabin){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);parent.add(m);return m}
function buildCabin(){
  const L=CAB.z1-CAB.z0,zc=(CAB.z0+CAB.z1)/2;
  box(CAB.w,.1,L,0x3b4a6b,0,-.05,zc);                       // الأرضية
  const aisle=box(1.5,.02,L,0x6b3b3b,0,.01,zc);              // سجاد الممر
  box(CAB.w,.1,L,0xe9eef4,0,CAB.h,zc);                        // السقف
  for(let z=CAB.z0+2;z<CAB.z1;z+=3){const l=box(.6,.02,1.6,0xffffff,0,CAB.h-.06,z);l.material=new T.MeshBasicMaterial({color:0xfff8e0})}
  // الجدران مع الشبابيك والباب
  const wallMat=M(0xdfe6ee),winMat=new T.MeshBasicMaterial({color:0x8ec5f0});
  for(const side of[-1,1]){
    for(let z=CAB.z0;z<CAB.z1;z+=1){const isDoor=side<0&&z>=CAB.door.z0-.2&&z<CAB.door.z1-.2;
      if(isDoor)continue;
      const w=new T.Mesh(new T.BoxGeometry(.12,CAB.h,1.02),wallMat);w.position.set(side*(CAB.w/2+.06),CAB.h/2,z+.5);cabin.add(w);
      if(Math.floor(z)%2===0&&z>CAB.z0+1&&z<CAB.z1-2){const win=new T.Mesh(new T.PlaneGeometry(.55,.4),winMat);win.position.set(side*(CAB.w/2-.01),1.35,z+.5);win.rotation.y=side<0?Math.PI/2:-Math.PI/2;cabin.add(win)}}
    // فوق الباب وتحته: نخلي فتحة الباب من الأرض لـ ٢ متر
    if(side<0){box(.12,CAB.h-2,CAB.door.z1-CAB.door.z0+.2,0xdfe6ee,side*(CAB.w/2+.06),2+(CAB.h-2)/2,(CAB.door.z0+CAB.door.z1)/2);
      box(.1,2.05,.08,0xd94c3d,side*(CAB.w/2+.06),1.02,CAB.door.z0-.22);box(.1,2.05,.08,0xd94c3d,side*(CAB.w/2+.06),1.02,CAB.door.z1-.2)}}
  box(CAB.w,CAB.h,.15,0xdfe6ee,0,CAB.h/2,CAB.z1+.07);          // الجدار الخلفي
  // الحمام ورا على اليمين
  box(.08,CAB.h,2.2,0xc9d2dc,.95,CAB.h/2,CAB.z1-1.1);box(1.6,CAB.h,.08,0xc9d2dc,1.7,CAB.h/2,CAB.z1-2.2);
  const wc=box(.5,.5,.5,0xffffff,1.8,.25,CAB.z1-.6);const sign=mkLabel("🚽 الحمام",1.1);sign.material.depthTest=true;sign.position.set(1.7,2.15,CAB.z1-2.35);cabin.add(sign);
  // الكابينة قدام: كونسول وكرسي الطيار
  box(CAB.w,CAB.h,.15,0x9fb2c8,0,CAB.h/2,CAB.z0-.07);
  const glass=new T.Mesh(new T.PlaneGeometry(2.6,.9),new T.MeshBasicMaterial({color:0xa8d4f5}));glass.position.set(0,1.55,CAB.z0+.01);cabin.add(glass);
  box(2.4,.6,.6,0x3a3f4a,0,.75,CAB.z0+.45);for(let i=-1;i<=1;i++){const l=box(.12,.12,.02,[0xff4040,0x40ff70,0xffd040][i+1],i*.5,1.1,CAB.z0+.14);l.material=new T.MeshBasicMaterial({color:l.material.color})}
  const yoke=box(.5,.08,.08,0x222,0,1.05,CAB.z0+.85);box(.06,.4,.06,0x222,0,.85,CAB.z0+.85);
  mkSeat(PILOT.x,PILOT.z,0x333a44,true);
  // كراسي الركاب
  for(const s of SEATS)mkSeat(s.x,s.z,0x2f4d8a,false);
  // عربة الخدمة وشنط
}
function mkSeat(x,z,c,pilot){const g=new T.Group();g.position.set(x,0,z);const b=box(.55,.12,.55,c,0,.42,0,g);box(.55,.7,.12,c,0,.78,pilot?-.22:.22,g);box(.1,.42,.5,0x1f2a40,-.3,.22,0,g);box(.1,.42,.5,0x1f2a40,.3,.22,0,g);
  if(pilot)g.rotation.y=Math.PI;cabin.add(g);return g}
function buildSky(){const geo=new T.SphereGeometry(60,16,8);const m=new T.Mesh(geo,new T.MeshBasicMaterial({color:0x8ec5f0,side:T.BackSide}));sky.add(m);

  if(mine){if(mine.st==="carried"){my.st="carried";my.by=mine.by;my.carry=null}
    if(mine.v&&mine.k!==my.kseq){my.kseq=mine.k;kickMe(mine.v)}}
  else if(my.st==="carried"){my.st="rag";my.by=null;my.vy=1}
  for(const id in m.pl||{}){if(id===pid)continue;const o=others[id];if(o){o.st=m.pl[id].st;o.by=m.pl[id].by}}
  for(const id in others)if(!(m.pl&&m.pl[id])&&others[id].st==="carried"){others[id].st="walk";others[id].by=null}
}
function kickMe(v){if(world.pilot===pid)return;my.st="rag";my.ragT=0;my.vx+=v[0];my.vy+=v[1];my.vz+=v[2];my.carry=null;vib(60)}
function onEvent(m){
  const who=m.who?esc(m.who):"";
  const txt={turb:"مطب! 💥",turbBig:"مطب قوي!! 🌪️",out:who+" طاح برا الطيارة! 😱",outObj:"شنطة طارت برا! 🧳",sit:who+" قعد يسوق ✈️",stand:who+" ترك القيادة! منو يسوق؟! 😨",grab:"",throw:who+" رمى أحد! 🙌",joined:""}[m.k];
  if(txt)toast(txt,m.k==="turbBig"||m.k==="out"||m.k==="stand");
  if(m.k==="turb"||m.k==="turbBig"){shake=m.k==="turbBig"?.5:.25;vib(m.k==="turbBig"?120:60)}
  if(m.k==="sit"||m.k==="stand")$("#pilotName").textContent=m.k==="sit"?who:"بدون طيار!";
}
let shake=0;const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch{}};
function toast(t,big){const d=document.createElement("div");d.textContent=t;if(big)d.className="big";$("#feed").appendChild(d);setTimeout(()=>d.remove(),3200);while($("#feed").children.length>4)$("#feed").firstChild.remove()}
/* ================= أنا ================= */
let my=null;
const stick={x:0,y:0,id:null};let camYaw=0,orb={id:null,x0:0,y0:0};
function setupInput(){
  const el=$("#stick"),knob=$("#knob");const R2=48;
  const upd=(e)=>{const r=el.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>R2){dx*=R2/d;dy*=R2/d}stick.x=dx/R2;stick.y=dy/R2;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`};
  el.addEventListener("pointerdown",e=>{stick.id=e.pointerId;try{el.setPointerCapture(e.pointerId)}catch{}upd(e)});
  el.addEventListener("pointermove",e=>{if(e.pointerId===stick.id)upd(e)});
  const end=e=>{if(e.pointerId===stick.id){stick.id=null;stick.x=stick.y=0;knob.style.transform="translate(-50%,-50%)"}};el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  // سحب على يمين الشاشة يلف الكاميرا
  cv.addEventListener("pointerdown",e=>{if(orb.id===null){orb.id=e.pointerId;orb.x0=e.clientX}});
  cv.addEventListener("pointermove",e=>{if(e.pointerId===orb.id){camYaw-=(e.clientX-orb.x0)*.006;orb.x0=e.clientX}});
  const oe=e=>{if(e.pointerId===orb.id)orb.id=null};cv.addEventListener("pointerup",oe);cv.addEventListener("pointercancel",oe);
  $("#bAct").onclick=()=>{const k=actKind();if(k==="sit")act("sit");else if(k==="stand")act("stand");else if(k==="throw")act("throw");else act("grab")};
  $("#bJump").onclick=()=>act("jump");
  $("#say").querySelectorAll("button").forEach(b=>b.onclick=()=>send({t:"say",text:b.dataset.s}));
}
function act(a,d){if(isHost&&sim)sim.act(pid,a,d);else send({t:"act",a,d})}
function actKind(){if(world.pilot===pid)return"stand";if(my.carry)return"throw";if(my.st==="walk"&&Math.hypot(my.x-PILOT.x,my.z-PILOT.z)<1.6&&!world.pilot)return"sit";return"grab"}
let ctlT=0,posT=0;
function stepMe(dt){
  const seated=world.pilot===pid;
  $("#bAct").textContent={sit:"اقعد\nتسوق",stand:"قم",throw:"ارمِ",grab:"مسك"}[actKind()];
  $("#bJump").classList.toggle("hide",seated||my.st!=="walk");
  if(seated){my.x=PILOT.x;my.z=PILOT.z+.05;my.y=0;my.ry=0;my.st="seated";my.vx=my.vy=my.vz=0;
    ctlT+=dt;if(ctlT>.15){ctlT=0;if(stick.x||stick.y)act("ctl",[r2(stick.x),r2(stick.y)])}
    return}
  if(my.st==="seated")my.st="walk";
  if(my.st==="carried"){const c=others[my.by];if(c){const f={x:-Math.sin(c.ry),z:-Math.cos(c.ry)};my.x=c.x+f.x*.6;my.z=c.z+f.z*.6;my.y=.9;my.ry=c.ry}return}
  if(my.st==="rag"){const out=stepFree(my,dt);if(out){toast("طحت برا الطيارة! 😱 … بترجع بعد شوي",true);if(isHost&&sim)send({t:"ev",k:"out",who:my.name});return}
    my.ragT=(my.ragT||0)+dt;if(my.y===0&&Math.hypot(my.vx,my.vz)<.5&&my.ragT>1){my.st="walk";my.vx=my.vz=0}return}
  if(my.st==="out"){my.outT=(my.outT||0)+dt;my.x-=12*dt;my.y+=2*dt;my.ry+=dt*8;if(my.outT>2.5){my.st="walk";my.outT=0;my.x=.3;my.y=0;my.z=CAB.z1-1.5;my.vx=my.vy=my.vz=0;toast("رجعت من الباب الخلفي 🤫")}return}
  // المشي
  const g=gravity(),lat=Math.hypot(g.x,g.z);
  if(lat>8.5){my.st="rag";my.ragT=0;my.vx=g.x*.4;my.vz=g.z*.4;my.vy=2;vib(40);return}
  const sp=3.2,mx=stick.x,mz=stick.y,moving=Math.hypot(mx,mz)>.08;
  if(moving){const cy=camYaw+my.camBase;const wx=(mx*Math.cos(cy)-mz*Math.sin(cy)),wz=(mx*Math.sin(cy)+mz*Math.cos(cy));
    my.vx=wx*sp+g.x*.3;my.vz=wz*sp+g.z*.3;const tr=Math.atan2(-wx,-wz);let d=tr-my.ry;d=Math.atan2(Math.sin(d),Math.cos(d));my.ry+=d*Math.min(1,12*dt)}
  else{my.vx=g.x*.3;my.vz=g.z*.3}
  my.vy+=g.y*dt;my.y+=my.vy*dt;if(my.y<0){my.y=0;my.vy=0}
  my.x+=my.vx*dt;my.z+=my.vz*dt;clampCabin(my,true);
  if(inDoor(my.x,my.z,my.y)){my.st="out";my.outT=0;my.carry=null;toast("طحت برا الطيارة! 😱 … بترجع بعد شوي",true);if(isHost&&sim)send({t:"ev",k:"out",who:my.name});else send({t:"say",text:"طحت برا! 😱"})}
}
/* ================= التشغيل ================= */
let last=0;
function startGame(seed){
  started=true;$("#lobby").classList.add("hide");$("#game").classList.remove("hide");$("#rot").classList.add("on");
  buildCabin();buildSky();setupInput();
  my=mkActor({id:pid,name:me.name,look:me.look,player:true});my.x=(Math.random()-.5)*.8;my.z=CAB.z1-2.5-Math.random()*2;my.camBase=0;my.kseq=0;
  if(isHost)sim=mkSim(seed);
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch{}
  requestAnimationFrame(loop);
}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||.016);last=t;
  if(sim)sim.step(dt);
  stepMe(dt);
  // الثانين: نقرّب لآخر مكان وصلنا
  for(const id in others){const a=others[id];const k=Math.min(1,10*dt);
    if(a.st==="carried"&&sim&&a.hx!==undefined){a.x=a.hx;a.y=a.hy;a.z=a.hz}
    else{a.x+=(a.tx-a.x)*k;a.y+=(a.ty-a.y)*k;a.z+=(a.tz-a.z)*k;let d=a.try-a.ry;d=Math.atan2(Math.sin(d),Math.cos(d));a.ry+=d*k}
    poseActor(a,dt)}
  if(sim){for(const a of sim.pax)poseActor(a,dt);for(const o of sim.objs){o.m.position.set(o.x,o.y+.15,o.z);o.m.rotation.y=o.ry;if(o.st==="out")o.m.rotation.z+=dt*6}}
  else{const k=Math.min(1,10*dt);for(const id in paxView){const a=paxView[id];a.x+=(a.tx-a.x)*k;a.y+=(a.ty-a.y)*k;a.z+=(a.tz-a.z)*k;let d=a.try-a.ry;d=Math.atan2(Math.sin(d),Math.cos(d));a.ry+=d*k;poseActor(a,dt)}
    for(const id in objView){const o=objView[id];o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k;o.z+=(o.tz-o.z)*k;o.m.position.set(o.x,o.y+.15,o.z);o.m.rotation.y=o.try||0}}
  my.anim=my.st==="rag"||my.st==="out"?2:my.st==="carried"?3:my.st==="seated"?4:Math.hypot(my.vx,my.vz)>.6?1:0;
  poseActor(my,dt);my.label.visible=false;my.g.visible=cam.position.distanceTo(my.g.position.clone().setY(my.y+1))>.8;
  // إرسال مكاني ١٠ مرات بالثانية
  posT+=dt;if(posT>=.1){posT=0;send({t:"p",v:[r2(my.x),r2(my.y),r2(my.z),r2(my.ry),my.anim]})}
  // الكاميرا: ورا شخصيتي، تلف معاه، وتميل مع الطيارة
  const seated=world.pilot===pid;
  if(!orb.id&&!seated&&Math.hypot(stick.x,stick.y)>.1){let d=(my.ry)-(camYaw+my.camBase);d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*Math.min(1,1.5*dt)}
  const rag=my.st==="rag"||my.st==="out";const cy=camYaw+my.camBase,dist=seated?2.2:rag?4.2:3.2,hgt=seated?2.0:rag?2.3:1.9;
  const cx=my.x+Math.sin(cy)*dist,cz=my.z+Math.cos(cy)*dist;
  cam.position.lerp(new T.Vector3(cx,my.y+hgt,cz),Math.min(1,8*dt));
  // الكاميرا ما تطلع من الكابينة
  cam.position.x=Math.max(-CAB.w/2+.2,Math.min(CAB.w/2-.2,cam.position.x));cam.position.z=Math.max(CAB.z0+.3,Math.min(CAB.z1-.2,cam.position.z));cam.position.y=Math.min(CAB.h-.15,cam.position.y);
  cam.lookAt(my.x,my.y+1.1,my.z);
  const sh=shake>0?(shake-=dt,shake):0;cam.rotation.z+=world.roll*.5+(sh>0?(Math.random()-.5)*sh*.3:0);cam.position.y+=sh>0?(Math.random()-.5)*sh*.2:0;
  // السما برا تميل عكس الطيارة
  sky.rotation.z=-world.roll;sky.rotation.x=-world.pitch;sky.position.copy(cam.position);
  $("#tilt i").style.transform=`translate(-50%,-50%) rotate(${-world.roll*57}deg)`;
  R.render(scene,cam);
}
addEventListener("visibilitychange",()=>{last=performance.now()});
window.__p={get my(){return my},get sim(){return sim},get world(){return world},act,PILOT};
</script>

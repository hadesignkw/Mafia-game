<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head><body>
<script type="module">
import * as T from "./three.min.js";import {makeChar,KINDS,setFace,pose,FACES} from "./chars.js";
const q=new URLSearchParams(location.search);const kinds=(q.get("k")||Object.keys(KINDS).join(",")).split(",");const face=q.get("f")||"n";const anim=q.get("a")||"idle";const yaw=+(q.get("y")||0);
const W=+(q.get("w")||1600),H=+(q.get("h")||600);
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setClearColor(0xffffff);document.body.appendChild(r.domElement);
const s=new T.Scene();s.add(new T.HemisphereLight(0xffffff,0x888888,1.4));const d=new T.DirectionalLight(0xffffff,1.6);d.position.set(2,5,4);s.add(d);
const n=kinds.length,gap=1.1;const hw=n*gap/2,hh=hw*(H/W);const c=new T.OrthographicCamera(-hw,hw,1+hh,1-hh,0,100);c.position.set(0,1,10);c.lookAt(0,1,0);
kinds.forEach((k,i)=>{const g=makeChar(k);g.position.x=(i-(n-1)/2)*gap;g.rotation.y=yaw;setFace(g,face);pose(g,anim,1.3);s.add(g)});
r.render(s,c);document.title="done";
</script></body></html>

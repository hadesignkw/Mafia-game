<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08120f">
<title>تسجيل برلمان</title>
<link rel="icon" href="/parliament/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/parliament/icon.svg">
<meta name="description" content="الحكم فتح الجلسة. ادخل برقم الغرفة وسجّل اسمك.">
<meta property="og:title" content="تسجيل برلمان · ارررحبو">
<meta property="og:description" content="الحكم فتح الجلسة. ادخل برقم الغرفة وسجّل اسمك.">
<meta property="og:locale" content="ar_KW">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Aref+Ruqaa:wght@400;700&display=swap">
<link rel="stylesheet" href="/noir.css">
<style>
/* قاعة مجلس الأمة بالليل: جلد أخضر، نحاس، ورق تصويت، وختم أحمر */
:root{
  --bg:#08120f;--panel:rgb(15 28 23 / .92);--panel2:#13241e;--line:#26392f;
  --seat:#1d4a3a;--seat-hi:#2f6e56;--brass:#c9a35b;--brass-hi:#ecd29a;--brass-ink:#1d1408;
  --paper:#efe6cf;--paper-ink:#2a2116;--stamp:#c23b2e;--fg:#ece4cf;--muted:#9aa89f;--good:#7cc3a0;
  --ruqaa:"Aref Ruqaa","Almarai",serif;--body:"Almarai",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-family:var(--ruqaa);font-weight:700;font-size:clamp(3.2rem,17vw,4.6rem);line-height:1.05;color:var(--fg);text-shadow:0 2px 0 #5b4a25,0 0 28px rgb(236 210 154 / .28),0 14px 30px rgb(0 0 0 / .8)}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1rem;font-weight:700;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.88rem}.err{color:#f08b80}.good{color:var(--good)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 18px 40px rgb(0 0 0 / .35),inset 0 1px 0 rgb(236 210 154 / .05);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.panel>h2+*{margin-top:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:14px 0}

/* أزرار */
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:1rem;transition:transform .12s ease,filter .2s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.seatbtn:focus-visible,.li:focus-visible,input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.gold{border:0;color:var(--brass-ink);background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,#8c6b2e);box-shadow:0 2px 0 #5a4219,0 8px 18px rgb(0 0 0 / .4)}
.btn.red{border:0;background:linear-gradient(180deg,#d9574a,var(--stamp) 60%,#8a2219);color:#fff;box-shadow:0 2px 0 #5c160f}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:11px}
input{font:inherit;color:var(--fg);background:#0c1814;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 14px;width:100%}
input::placeholder{color:#62736a}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.red{color:#ffb3aa;border-color:#6b2a24;background:rgb(194 59 46 / .15)}
.chip.gold{color:var(--brass-hi);border-color:#6a5530}
.chip.green{color:var(--good);border-color:#2d5a47}

/* ---------- العنوان: سقف المجلس والكراسي ---------- */
.hero{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.hall{width:min(420px,100%);height:auto;display:block;overflow:visible}
.hall .roof{transform-origin:50% 100%;animation:roof 1.2s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes roof{from{opacity:0;transform:translateY(-14px) scaleY(.85)}}
.hall .glow{animation:glow 2.4s .4s ease-out both}
@keyframes glow{0%,10%{opacity:0}14%{opacity:1}18%{opacity:.3}24%,100%{opacity:1}}
.hall .s{fill:#16302a;stroke:#0a1512;stroke-width:1;animation:seatOn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes seatOn{from{fill:#0d1a16;transform:translateY(6px);opacity:0}}
.hall .s.lit{fill:var(--seat-hi)}
.hero h1{margin-top:-6px}
.hero .sub{max-width:32ch}

/* ---------- القاعة الحية (نفس الكراسي باللعبة) ---------- */
.chamber{position:relative;margin-top:6px}
.chamber svg{width:100%;height:auto;display:block;overflow:visible}
.seatbtn{cursor:pointer}
.seatbtn circle.body{fill:var(--seat);stroke:#0a1512;stroke-width:2;transition:fill .3s}
.seatbtn.top circle.body{fill:var(--brass)}
.seatbtn.resigned circle.body{fill:#3a3a33}
.seatbtn.off circle.body{opacity:.5}
.seatbtn text{font-family:var(--body);font-weight:800;fill:var(--fg);pointer-events:none}
.seatbtn.top text{fill:var(--brass-ink)}
.seatbtn.top text.nm{fill:var(--brass-hi)}
.seatbtn .nm{font-size:11px;font-weight:700;fill:var(--muted)}
.seatbtn .pend{fill:var(--stamp)}
.podium{fill:#241a10;stroke:var(--brass);stroke-opacity:.5}
.rounds{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.rd{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.8rem;font-weight:800;border:1px solid var(--line);color:var(--muted);background:#0c1814}
.rd.cur{border-color:var(--brass);color:var(--brass-hi);box-shadow:0 0 0 3px rgb(201 163 91 / .18)}
.rd.sorted{background:var(--seat);color:var(--fg);border-color:var(--seat-hi)}
.rd.cards{background:#2a3a33;color:var(--fg)}
.rd.dissolved{background:rgb(194 59 46 / .25);border-color:#7a2a22;color:#ffb3aa}
.rd.lock{position:relative}
.rd.lock::after{content:"";position:absolute;inset:-4px;border:1px dashed rgb(194 59 46 / .5);border-radius:11px}

/* القوائم */
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:#0c1814;border:1px solid var(--line);width:100%;text-align:right}
button.li{cursor:pointer}
.li .rank{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--panel2);color:var(--muted)}
.li .rank.r1{background:var(--brass);color:var(--brass-ink)}
.li .rank.r2{background:#a7b0ab;color:#18201c}
.li .rank.r3{background:#9a6b43;color:#1d1408}
.li .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sc{text-align:left;line-height:1.2}
.li .sc b{display:block;font-size:1.15rem}
.li .sc small{color:var(--muted);font-size:.78rem}
.li.out{opacity:.55}
.dot{width:8px;height:8px;border-radius:50%;background:#45524b;flex:none}.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}

/* ورقة التصويت (طلبات تنطر الحكم) */
.ballot{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:12px 14px;box-shadow:0 8px 20px rgb(0 0 0 / .4);transform:rotate(-.6deg)}
.ballot:nth-child(even){transform:rotate(.5deg)}
.ballot b{font-size:1.05rem}
.ballot .amt{font-size:1.6rem;font-weight:800}
.ballot input{background:#fffaf0;color:var(--paper-ink);border-color:#cbbd9a;min-height:42px}
.ballot .btn{border-color:#cbbd9a;background:#e4d7b6;color:var(--paper-ink)}
.ballot .btn.gold{background:linear-gradient(180deg,#3a7a5f,#245644);color:#fff;box-shadow:none}

/* الحاسبة */
.calc{background:#0c1814;border:1px solid var(--line);border-radius:16px;padding:10px}
.calc .disp{min-height:64px;padding:6px 10px;border-radius:11px;background:#06100d;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;direction:ltr}
.calc .expr{color:var(--muted);font-size:.95rem;min-height:1.3em;word-break:break-all}
.calc .res{font-size:2rem;font-weight:800;color:var(--brass-hi);line-height:1.1}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;direction:ltr}
.calc .keys button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:1.25rem;font-weight:800}
.calc .keys button:active{transform:scale(.95)}
.calc .keys .op{color:var(--brass-hi)}
.calc .keys .cl{color:#f08b80}

/* الشيت اللي يطلع من تحت */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgb(0 0 0 / .6);animation:fade .2s both}
.sheet .box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel2);border-radius:22px 22px 0 0;border-top:1px solid #3a5446;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1) both;overscroll-behavior:contain}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#3d5248;margin:0 auto 10px}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet .hd h2{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* شريط الأوامر تحت */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgb(8 18 15 / .96) 30%);}
.dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dock .btn{min-height:56px;padding:6px 4px;flex-direction:column;gap:0;font-size:.8rem;border-radius:14px;line-height:1.25}
.dock .btn svg{width:22px;height:22px}

/* السجل */
.rec .rh{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.rec .rh b{font-size:1.02rem}
.rec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rec li{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:10px;background:#0c1814;font-size:.94rem}
.rec li .t{color:var(--muted);font-size:.8rem;flex:none}
.rec li.x{text-decoration:line-through;opacity:.5}
.rec li.wipe{opacity:.55}
.rec li.sw{border-inline-start:3px solid var(--brass)}
.rec li.rs{border-inline-start:3px solid #8a8a7a}
.rec .tot{display:flex;justify-content:space-between;padding:8px 10px;font-weight:800}

/* شريط الجلسة السرية */
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;margin-top:12px;background:repeating-linear-gradient(-45deg,#1c1310 0 10px,#241813 10px 20px);border:1px solid #6a3a2a;color:#ffd9c8}
.banner svg{flex:none;width:22px;height:22px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--paper);color:var(--paper-ink);font-weight:700;padding:10px 18px;border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .5);max-width:90vw;text-align:center}
.conn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;background:#3a1c18;color:#ffd0c8;font-size:.85rem;padding:5px 14px;border-radius:99px}
.code{font-size:3rem;font-weight:800;letter-spacing:.18em;color:var(--brass-hi);text-align:center;line-height:1.1}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 0}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:right;padding:14px;border-radius:16px;border:1px solid var(--line);background:#0c1814}
.mode svg{flex:none;width:44px;height:44px;color:var(--brass)}
.mode b{display:block;font-size:1.08rem}
.mine li{display:flex;justify-content:space-between}

/* ---------- الحركات الكبيرة ---------- */
.fx{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(80% 60% at 50% 45%,rgb(20 40 32 / .96),rgb(3 8 6 / .98));text-align:center;padding:24px;cursor:pointer;animation:fade .25s both;overflow:hidden}
.fx .big{font-family:var(--ruqaa);font-weight:700;font-size:clamp(3rem,16vw,4.6rem);line-height:1.1;color:var(--paper);text-shadow:0 3px 0 #000}
.fx .sub{font-size:1.15rem;color:var(--muted);max-width:28ch}
.fx .tap{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:.85rem;color:#6b7a72}
/* المطرقة */
.gavel{width:150px;height:120px;overflow:visible}
.gavel .hammer{transform-origin:118px 96px;animation:strike 1.1s .2s cubic-bezier(.5,0,.2,1) both}
@keyframes strike{0%{transform:rotate(-42deg)}45%{transform:rotate(-48deg)}62%{transform:rotate(4deg)}72%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.gavel .ring{transform-origin:60px 104px;animation:ring .7s .9s ease-out both}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(2.2);opacity:0}}
.fx-round .big{animation:slam .5s .85s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.4);opacity:0}}
/* الفرز: ورق يطيح بالصندوق */
.box3{position:relative;width:180px;height:190px}
.box3 svg{position:absolute;bottom:0;left:0;width:180px;height:130px}
.box3 i{position:absolute;top:0;left:70px;width:42px;height:56px;background:var(--paper);border-radius:3px;box-shadow:0 2px 6px rgb(0 0 0 / .4);animation:drop 1.1s cubic-bezier(.5,0,.8,.6) both}
.box3 i::before{content:"";position:absolute;inset:10px 8px auto;height:4px;background:#b8ab88;box-shadow:0 9px 0 #b8ab88,0 18px 0 #d6caa8}
@keyframes drop{0%{transform:translate(var(--x),-120px) rotate(var(--r));opacity:0}20%{opacity:1}80%{transform:translate(0,58px) rotate(0)}100%{transform:translate(0,80px) rotate(0);opacity:0}}
/* الحل: ختم أحمر */
.fx-dissolve{animation:fade .2s both,shake .5s .75s both}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.stamp{width:min(78vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:8px double var(--stamp);color:var(--stamp);font-family:var(--ruqaa);font-weight:700;font-size:clamp(2.6rem,13vw,3.6rem);line-height:1.05;transform:rotate(-14deg);animation:stampIn .55s .5s cubic-bezier(.3,1.4,.5,1) both;mix-blend-mode:screen;text-shadow:0 0 1px var(--stamp)}
@keyframes stampIn{from{transform:rotate(-14deg) scale(3);opacity:0}}
.fx-dissolve .seatsdim{display:flex;gap:6px}
.fx-dissolve .seatsdim span{width:16px;height:16px;border-radius:50%;background:var(--seat-hi);animation:dim .4s both}
@keyframes dim{to{background:#1f2a25;transform:translateY(4px)}}
/* الاستقالة: ورقة تنشق */
.tear{position:relative;width:200px;height:250px}
.tear span{position:absolute;top:0;width:100px;height:250px;background:var(--paper);color:var(--paper-ink);overflow:hidden}
.tear span::before{content:"استقالة";position:absolute;top:40px;width:200px;text-align:center;font-family:var(--ruqaa);font-size:2.3rem;font-weight:700}
.tear span::after{content:"";position:absolute;top:110px;width:200px;height:6px;background:#c9bd9d;box-shadow:0 18px 0 #c9bd9d,0 36px 0 #c9bd9d,0 54px 0 #d9cfb2}
.tear .l{right:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8% 80%,0 60%,10% 40%,0 20%);animation:tl 1s 1.1s cubic-bezier(.5,0,.7,.5) both}
.tear .l::before,.tear .l::after{right:0}
.tear .r{left:0;animation:tr 1s 1.1s cubic-bezier(.5,0,.7,.5) both}
.tear .r::before,.tear .r::after{left:0}
@keyframes tl{to{transform:translate(40px,260px) rotate(22deg);opacity:0}}
@keyframes tr{to{transform:translate(-40px,260px) rotate(-22deg);opacity:0}}
/* البدل: كرتين يتبادلون */
.swap{position:relative;width:260px;height:150px}
.swap .c{position:absolute;top:10px;width:104px;height:136px;border-radius:12px;background:var(--paper);color:var(--paper-ink);display:flex;align-items:center;justify-content:center;padding:8px;font-weight:800;font-size:1.05rem;box-shadow:0 10px 24px rgb(0 0 0 / .5),inset 0 0 0 4px var(--paper),inset 0 0 0 5px #bfae85;text-align:center;word-break:break-word}
.swap .a{right:0;animation:swA 1.4s .3s cubic-bezier(.6,0,.3,1) both}
.swap .b{left:0;animation:swB 1.4s .3s cubic-bezier(.6,0,.3,1) both}
@keyframes swA{50%{transform:translate(-78px,-40px) rotate(-10deg)}100%{transform:translate(-156px,0)}}
@keyframes swB{50%{transform:translate(78px,40px) rotate(10deg)}100%{transform:translate(156px,0)}}
.fx-swap .big{animation:slam .5s 1.5s cubic-bezier(.2,1.6,.4,1) both}
/* الجلسة السرية: ستارة */
.fx-secret .cur{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#4b1210 0 18px,#5f1a16 18px 36px);box-shadow:inset 0 -40px 60px rgb(0 0 0 / .5)}
.fx-secret .cur.l{right:0;animation:curL .9s cubic-bezier(.5,0,.2,1) both}
.fx-secret .cur.r{left:0;animation:curR .9s cubic-bezier(.5,0,.2,1) both}
@keyframes curL{from{transform:translateX(100%)}}
@keyframes curR{from{transform:translateX(-100%)}}
.fx-secret .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;animation:fade .4s .8s both}
.fx-secret .inner svg{width:70px;height:70px;color:var(--brass-hi)}
/* خلصت الكروت */
.fall{position:absolute;inset:0;pointer-events:none}
.fall i{position:absolute;top:-80px;width:46px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,#16302a 0 5px,#1d4a3a 5px 10px);box-shadow:inset 0 0 0 2px var(--brass);animation:fall 2.2s cubic-bezier(.4,0,.8,.6) both}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
/* النهاية: ورق يتطاير */
.conf i{background:var(--paper);box-shadow:none;width:14px;height:18px;border-radius:2px}
.conf i:nth-child(3n){background:var(--brass)}
.conf i:nth-child(5n){background:var(--stamp)}
.podium3{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.podium3 div{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:rise .6s cubic-bezier(.2,1.3,.4,1) both}
.podium3 b{font-size:.98rem;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium3 span.p{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:start center;padding-top:6px;font-family:var(--ruqaa);font-size:2rem;font-weight:700;color:var(--brass-ink)}
.podium3 .p1 span.p{height:120px;background:linear-gradient(var(--brass-hi),var(--brass))}
.podium3 .p2 span.p{height:86px;background:linear-gradient(#cfd6d2,#97a19b)}
.podium3 .p3 span.p{height:62px;background:linear-gradient(#c58c5c,#8a5a33)}
.podium3 .p1{animation-delay:.9s}.podium3 .p2{animation-delay:.5s}.podium3 .p3{animation-delay:.3s}
@keyframes rise{from{transform:translateY(50px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div class="noir" aria-hidden="true"><span class="smoke s1"></span><span class="smoke s2"></span><span class="vig"></span><span class="grain"></span></div>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<div id="dock"></div>
<div id="fx"></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="conn" id="conn" hidden>النت فصل، قاعد يرجع يتصل…</div>
<script>
"use strict";
/* ---------- أدوات ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const en=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const fmt=n=>`<span class="num">${Number(n||0).toLocaleString("en-US")}</span>`;
const hm=t=>{const d=new Date(t);return`<span class="num">${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</span>`};
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};
const ICON={
  gavel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 13-8.4 8.4a2 2 0 0 1-2.8-2.8L11 10"/><path d="m16 16 6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18v8H3zM8 12V4h8v8M10 8h4"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m8 8 8 8M16 8l-8 8"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="11" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h6M8 12h6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  phones:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="8" height="15" rx="2"/><rect x="13" y="6" width="8" height="15" rx="2"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
};

/* ---------- الحالة ---------- */
let sess=lsGet("parl.sess"); // {code, token, judge}
let view="home", st=null, ws=null, retry=0, busy=false, homeErr="";
let sheet=null; // {type, ...}
let calcExpr="";
const seenEv=new Set();

/* ---------- الاتصال ---------- */
function connect(){
  if(!sess||!sess.code)return;
  try{ws&&ws.close()}catch{}
  const proto=location.protocol==="https:"?"wss":"ws";
  const sock=new WebSocket(`${proto}://${location.host}/api/parl/ws?code=${sess.code}`);ws=sock;
  sock.onopen=()=>{retry=0;$("#conn").hidden=true;sock.send(JSON.stringify({t:"hello",token:sess.token||null}))};
  sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}onMsg(m)};
  sock.onclose=()=>{if(ws!==sock||!sess)return;$("#conn").hidden=view!=="game";retry++;setTimeout(()=>{if(ws===sock&&sess)connect()},Math.min(8000,700*retry))};
}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"t":"ping"}')},25000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sess&&(!ws||ws.readyState>1))connect()});
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast("النت فاصل، لحظة ويرجع.")}

function onMsg(m){
  if(m.t==="need-name"){if(sess&&sess.judge){endSession("الجلسة خلصت.");return}if(m.mode==="manual"){endSession("هالجلسة الحكم يسجل فيها بروحه، ما تحتاج تدخل.");return}view="name";render();return}
  if(m.t==="joined"){sess.token=m.token;lsSet("parl.sess",sess);return}
  if(m.t==="error"){toast(m.text);buzz(60);return}
  if(m.t==="sent"){toast("وصل للحكم، ينطر يعتمده.");calcExpr="";render();return}
  if(m.t==="kicked"){endSession("الحكم شالك من الجلسة.");return}
  if(m.t==="gone"){endSession("الجلسة تسكّرت.");return}
  if(m.t==="state"){
    const first=!st;st=m;view="game";
    // أول ما يتصل ما نعيد آخر حركة، بس اللي تصير بعدها
    if(st.event&&!seenEv.has(st.event.id)){seenEv.add(st.event.id);if(!first&&st.now-st.event.at<15000)playFx(st.event)}
    if(sheet&&sheet.type==="player"&&!st.players.some(p=>p.id===sheet.id))sheet=null;
    render();
  }
}
function endSession(msg){sess=null;lsSet("parl.sess",null);st=null;sheet=null;try{ws&&ws.close()}catch{}ws=null;view="home";homeErr=msg||"";render()}

/* ---------- حسابات من السجل ---------- */
const P=id=>st.players.find(p=>p.id===id);
const nm=id=>(P(id)||{}).name||"لاعب";
function totalsOf(rec){return rec?rec.totals:{}}
function ranking(rec,players){
  const t=totalsOf(rec);
  const arr=players.map(p=>({...p,total:t[p.id]||0}));
  arr.sort((a,b)=>b.total-a.total);
  let rank=0,prev=null;arr.forEach((p,i)=>{if(p.total!==prev){rank=i+1;prev=p.total}p.rank=rank});
  return arr;
}
function curScore(id){if(!st.record||!st.round)return 0;const r=st.record.rounds[st.round.no-1];return r?r.score[id]||0:0}
const roundLock=no=>no===1||no===(st.round&&st.round.of);

/* ---------- الحاسبة ---------- */
function calcEval(x){
  const s=en(x).replace(/×/g,"*").replace(/−/g,"-").replace(/\s/g,"");
  if(!s)return null;
  if(!/^[\d+\-*]+$/.test(s))return null;
  const parts=s.match(/\d+|[+\-*]/g);if(!parts)return null;
  // ضرب أول، بعدين جمع وطرح
  const t=[];for(const p of parts){if(t.length&&t[t.length-1]==="*"){t.pop();const a=t.pop();if(typeof a!=="number"||!/^\d+$/.test(p))return null;t.push(a*Number(p))}else t.push(/^\d+$/.test(p)?Number(p):p)}
  let r=0,op="+";for(const v of t){if(typeof v==="number"){r=op==="+"?r+v:r-v}else op=v}
  return Number.isFinite(r)?r:null;
}
function calcHTML(){
  const v=calcEval(calcExpr);
  const k=(l,c="",a=l)=>`<button type="button" class="${c}" data-a="ck" data-k="${a}" aria-label="${a}">${l}</button>`;
  return`<div class="calc"><div class="disp"><div class="expr">${esc(calcExpr)||"&nbsp;"}</div><div class="res num">${v==null?"0":v.toLocaleString("en-US")}</div></div>
  <div class="keys">${k("7")}${k("8")}${k("9")}${k("⌫","cl","back")}${k("4")}${k("5")}${k("6")}${k("+","op")}${k("1")}${k("2")}${k("3")}${k("−","op","-")}${k("0")}${k("00")}${k("×","op","*")}${k("C","cl","clear")}</div></div>`;
}
function calcKey(key){
  if(key==="back")calcExpr=calcExpr.slice(0,-1);
  else if(key==="clear")calcExpr="";
  else if("+-*".includes(key)){if(!calcExpr&&key!=="-")return;calcExpr=calcExpr.replace(/[+\-*]$/,"")+(key==="*"?"×":key==="-"?"−":"+")}
  else if(calcExpr.replace(/[^\d]/g,"").length<14)calcExpr+=key;
  buzz(8);renderSheetOrApp();
}
function renderSheetOrApp(){if(sheet)renderSheet();else render()}

/* ---------- الشاشات ---------- */
function hallSVG(){
  // سقف المجلس المنحني فوق أعمدة، وتحته كراسي القاعة تنور وحدة وحدة
  let seats="",i=0;
  [[150,9],[118,7],[86,5]].forEach(([R,n],row)=>{for(let k=0;k<n;k++){const a=Math.PI*(k+.5)/n;const x=210-R*Math.cos(a),y=258-R*.55*Math.sin(a);seats+=`<circle class="s${(i%3===0)?" lit":""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${9-row}" style="animation-delay:${(.9+i*.05).toFixed(2)}s"/>`;i++}});
  return`<svg class="hall" viewBox="0 0 420 280" aria-hidden="true">
  <defs><linearGradient id="rf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e9dcbc"/><stop offset="1" stop-color="#a99a72"/></linearGradient>
  <radialGradient id="gl" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffdca0" stop-opacity=".22"/><stop offset="1" stop-color="#ffdca0" stop-opacity="0"/></radialGradient></defs>
  <g class="roof">
    <path d="M10 92C90 58 150 22 210 14c60 8 120 44 200 78l-6 10C330 74 270 44 210 38c-60 6-120 36-194 64z" fill="url(#rf)"/>
    <path d="M16 102C90 74 150 44 210 38c60 6 120 36 194 64" stroke="#5b4a25" stroke-width="2" fill="none" opacity=".6"/>
    ${[60,105,150,195,225,270,315,360].map(x=>`<rect x="${x-3}" y="${x<210?102-(x-16)*.36:102-(404-x)*.36}" width="6" height="${x<210?60+(x-16)*.36:60+(404-x)*.36}" fill="#cfc19c" opacity=".85"/>`).join("")}
    <rect x="0" y="160" width="420" height="4" fill="#5b4a25" opacity=".7"/>
  </g>
  <ellipse class="glow" cx="210" cy="170" rx="200" ry="110" fill="url(#gl)"/>
  <rect class="podium" x="186" y="236" width="48" height="26" rx="4"/>
  ${seats}
  </svg>`;
}

function render(){
  const app=$("#app");
  document.title=st?`جلسة ${st.code} · برلمان`:"تسجيل برلمان";
  if(view==="home")app.innerHTML=homeView();
  else if(view==="mode")app.innerHTML=modeView();
  else if(view==="join")app.innerHTML=joinView();
  else if(view==="name")app.innerHTML=nameView();
  else if(view==="game"&&st)app.innerHTML=st.judge?judgeView():playerView();
  else app.innerHTML=`<p class="muted" style="text-align:center;margin-top:40vh">قاعد أتصل بالجلسة…</p>`;
  renderDock();renderSheet();
}

function homeView(){
  return`<a class="back" href="/">${"‹"} الصفحة الرئيسية</a>
  <section class="hero">${hallSVG()}<h1>تسجيل برلمان</h1><p class="muted sub">الحكم يسجل أصوات كل لاعب، جولة ورا جولة، والسجل محفوظ لين تسكرون الجلسة.</p></section>
  ${homeErr?`<p class="err" style="text-align:center;margin-top:10px">${esc(homeErr)}</p>`:""}
  <div class="panel"><button class="btn gold block" data-a="goMode">${ICON.gavel.replace("<svg",'<svg width="22" height="22"')} افتح جلسة، أنا الحكم</button>
  <div class="sep"></div><button class="btn block" data-a="goJoin">ادخل جلسة برقم الغرفة</button></div>`;
}
function modeView(){
  return`<button class="back" style="background:none;border:0" data-a="home">‹ رجوع</button>
  <h2 style="margin-top:6px">شلون تبون تسجلون؟</h2>
  <div class="modes" style="margin-top:12px">
    <button class="mode" data-a="create" data-m="manual" ${busy?"disabled":""}>${ICON.pen}<span><b>يدوي</b><span class="muted small">أنت تكتب الأسامي وتسجل كل الأصوات والبدلات من تلفونك. اللاعبين ما يحتاجون يدخلون.</span></span></button>
    <button class="mode" data-a="create" data-m="players" ${busy?"disabled":""}>${ICON.phones}<span><b>اللاعبين يسجلون</b><span class="muted small">كل واحد يدخل برقم الغرفة ويكتب أصواته، وأنت تعتمدها. الأصوات ما يشوفها إلا أنت.</span></span></button>
  </div>`;
}
function joinView(){
  return`<button class="back" style="background:none;border:0" data-a="home">‹ رجوع</button>
  <div class="panel"><h2>رقم الغرفة</h2><p class="muted small">خذه من الحكم.</p>
  <form data-f="join" class="row" style="margin-top:12px"><input name="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="مثلاً 4821" class="grow num" style="text-align:center;font-size:1.4rem;letter-spacing:.2em" required><button class="btn gold" ${busy?"disabled":""}>دخول</button></form></div>`;
}
function nameView(){
  return`<div class="panel" style="margin-top:30px"><h2>اكتب اسمك</h2><p class="muted small">الحكم والربع بيشوفونه.</p>
  <form data-f="name" class="row" style="margin-top:12px"><input name="name" maxlength="24" placeholder="اسمك" class="grow" required autocomplete="nickname"><button class="btn gold">دخول الجلسة</button></form>
  <button class="btn ghost sm" style="margin-top:8px" data-a="leave">رجوع</button></div>`;
}

/* ---------- القاعة الحية ---------- */
function chamberSVG(click){
  const ps=st.players,n=ps.length;if(!n)return"";
  const rk=st.record?ranking(st.record,ps):[];const topId=rk.length&&rk[0].total>0?rk[0].id:null;
  const rows=n<=9?[n]:n<=18?[Math.ceil(n*.56),n-Math.ceil(n*.56)]:[Math.ceil(n*.42),Math.ceil(n*.33),n-Math.ceil(n*.42)-Math.ceil(n*.33)];
  const W=400,cx=200,cy=200;let html="",idx=0,minY=cy;
  const pend=new Set((st.pending||[]).flatMap(p=>p.kind==="swap"?[p.a,p.b]:[p.pid]));
  rows.forEach((cnt,row)=>{const R=170-row*48;const r=Math.max(13,Math.min(22,R*Math.PI/cnt/2.3));
    for(let k=0;k<cnt;k++){const p=ps[idx++];if(!p)break;const a=Math.PI*(k+.5)/cnt;const x=cx+R*Math.cos(a),y=cy-R*.78*Math.sin(a);minY=Math.min(minY,y-r);
      const res=st.round&&st.round.resigned.includes(p.id);
      const cls=["seatbtn",p.id===topId&&st.judge?"top":"",res?"resigned":"",st.mode==="players"&&!p.online&&st.phase!=="over"?"off":""].join(" ");
      html+=`<g class="${cls}" ${click?`data-a="seat" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}"`:""}><circle class="body" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"/>
      <text x="${x.toFixed(1)}" y="${(y+r*.36).toFixed(1)}" text-anchor="middle" font-size="${(r*.95).toFixed(1)}">${esc([...p.name][0]||"؟")}</text>
      ${n<=12?`<text class="nm" x="${x.toFixed(1)}" y="${(y+r+13).toFixed(1)}" text-anchor="middle">${esc(p.name.length>7?p.name.slice(0,7)+"…":p.name)}</text>`:""}
      ${pend.has(p.id)&&st.judge?`<circle class="pend" cx="${(x+r*.75).toFixed(1)}" cy="${(y-r*.75).toFixed(1)}" r="5"/>`:""}</g>`}});
  const top=Math.max(0,Math.floor(minY-12));
  return`<div class="chamber"><svg viewBox="0 ${top} ${W} ${228-top}"><rect class="podium" x="176" y="196" width="48" height="26" rx="4"/>${html}</svg></div>`;
}
function roundsStrip(){
  if(!st.round&&!st.rounds.length)return"";
  const of=st.round?st.round.of:st.players.length;let h="";
  for(let i=1;i<=of;i++){const r=st.rounds[i-1];const cls=r?(r.status==="open"?"cur":r.status):"";
    h+=`<span class="rd ${cls} ${(i===1||i===of)&&st.phase==="play"?"lock":""}" title="${r?statusName(r.status):"جاية"}">${r&&r.status==="dissolved"?"✕":i}</span>`}
  return`<div class="rounds" aria-label="الجولات">${h}</div>`;
}
const statusName=s=>({counting:"نجمع المجاميع",open:"شغالة",sorted:"انفرزت",cards:"خلصت الكروت",dissolved:"انحل المجلس"})[s]||s;

/* ---------- شاشة الحكم ---------- */
function judgeView(){
  const s=st;let h=`<div class="row" style="justify-content:space-between"><a class="back" href="/">‹ الرئيسية</a><span class="chip gold">غرفة <span class="num">${s.code}</span></span></div>`;
  if(s.secret)h+=`<div class="banner">${ICON.lock}<span class="grow"><b>جلسة سرية:</b> ${esc(nm(s.secret))} يشوف السجل الحين.</span><button class="btn sm" data-a="secretClose">سكّرها</button></div>`;
  if(s.phase==="setup")return h+judgeSetup();
  if(s.phase==="over")return h+overView();
  // اللعب
  h+=`<div style="text-align:center;margin-top:8px"><h1 style="font-size:2.6rem">الجولة <span class="num">${s.round.no}</span></h1><p class="muted small">من ${fmt(s.round.of)} جولات${s.round.no===1?"، وما فيها فرز ولا حل":s.round.no===s.round.of?"، وما فيها حل مجلس":""}</p></div>`;
  h+=roundsStrip()+chamberSVG(true);
  if(s.counting)h+=countingHTML();
  else if(s.resignNeed&&s.resignNeed.length)h+=`<div class="panel"><h2>ننطر مجموع المستقيل</h2><div class="list" style="margin-top:10px">${s.resignNeed.map(id=>`<button class="li" data-a="seat" data-id="${id}"><span class="nm">${esc(nm(id))}</span><span class="chip gold">${(s.pending||[]).some(p=>p.kind==="final"&&p.pid===id)?"وصل، اعتمده":"ينطر"}</span></button>`).join("")}</div></div>`;
  if(s.pending&&s.pending.length)h+=`<div class="panel"><h2>تنطر موافقتك</h2><div class="list" style="gap:12px">${s.pending.map(pendHTML).join("")}</div></div>`;
  h+=scoreboard();
  return h;
}
function countingHTML(){
  const c=st.counting,left=c.need.filter(id=>!c.done[id]),last=st.round.no===st.round.of;
  const kindN={sort:"فرز الأصوات",cards:"خلصت الكروت",dissolve:"انحل المجلس"}[st.round.endKind]||"";
  return`<div class="panel"><div class="row"><h2 class="grow">مجاميع الجولة</h2><span class="chip ${st.round.endKind==="dissolve"?"red":"gold"}">${kindN}</span></div>
  <p class="muted small">${st.round.endKind==="dissolve"?"ننطر المستقيلين بس، والباقين انمسحوا.":"كل واحد يحط أصواته اللي بإيده. دوس على اسم عشان تسجل بداله."}</p>
  <div class="list" style="margin-top:10px">${c.need.map(id=>{const w=(st.pending||[]).find(p=>p.kind==="final"&&p.pid===id);const d=c.done[id];
    // الرقم اللي سجله: من السجل إذا انعتمد، أو من الطلب إذا ينطر
    const rr=st.record.rounds[st.round.no-1],cx=new Set(rr.ev.filter(e=>e.k==="cancel").map(e=>e.target));
    const f=d?rr.ev.filter(e=>e.k==="add"&&e.final&&e.pid===id&&!cx.has(e.id)).pop():null;
    const n=f?f.amt:w?w.amt:null;
    return`<button class="li" data-a="seat" data-id="${id}"><span class="nm">${esc(nm(id))}</span>${n!=null?`<b class="num" style="font-size:1.15rem">${Number(n).toLocaleString("en-US")}</b>`:""}${d?`<span class="chip green">انسجل</span>`:w?`<span class="chip gold">وصل، اعتمده</span>`:`<span class="chip">ينطر</span>`}</button>`}).join("")}</div>
  <button class="btn gold block" style="margin-top:12px" data-a="nextRound" ${left.length?"disabled":""}>${left.length?`باقي ${left.length}`:last?"طلّع النتيجة":`ابدا الجولة ${st.round.no+1}`}</button></div>`;
}
function pendHTML(p){
  if(p.kind==="swap")return`<div class="ballot"><div class="row"><span class="grow"><b>بدل: ${esc(nm(p.a))} ويا ${esc(nm(p.b))}</b><br><span class="small">كتبه ${esc(nm(p.by))} ${hm(p.at)}</span></span><span class="amt num">${Number(p.total).toLocaleString("en-US")}</span></div>
  <div class="row" style="margin-top:8px"><button class="btn gold sm grow" data-a="approve" data-id="${p.id}">اعتمد البدل</button><button class="btn sm" data-a="reject" data-id="${p.id}">ارفض</button></div></div>`;
  return`<div class="ballot"><div class="row"><span class="grow"><b>${esc(nm(p.pid))}</b> <span class="small">${Number(p.amt)===0?"ما عنده ولا صوت":"مجموع أصواته"}</span><br><span class="small">${p.calc?esc(p.calc)+" · ":""}${hm(p.at)}</span></span></div>

  if(!man)h+=`<div class="panel"><p class="muted small" style="text-align:center">رقم الغرفة</p><div class="code num">${s.code}</div>
  <div class="row" style="margin-top:10px"><button class="btn grow" data-a="share" data-url="${esc(url)}">ارسل رابط الجلسة</button></div></div>`;
  h+=`<div class="panel"><div class="row"><h2 class="grow">الأعضاء</h2><span class="chip">${fmt(s.players.length)} لاعب · ${fmt(s.players.length)} جولات</span></div>

  <form data-f="addName" class="row" style="margin-top:12px"><input name="name" maxlength="24" placeholder="${man?"اسم لاعب":"أضف اسم بنفسك (اختياري)"}" class="grow"><button class="btn">أضف</button></form>

function archiveHTML(){
  if(!st.archive||!st.archive.length)return"";
  return`<div class="panel"><h2>الجلسات السابقة</h2><div class="list" style="margin-top:10px">${st.archive.slice().reverse().map(g=>{const w=g.players.slice().sort((a,b)=>(g.totals[b.id]||0)-(g.totals[a.id]||0))[0];
    return`<button class="li" data-a="arch" data-id="${g.id}"><span class="rank">${g.no}</span><span class="nm">القيم ${g.no}<br><span class="muted small">${hm(g.at)} · فاز ${esc(w?w.name:"")}</span></span><span class="sc"><b class="num">${(g.totals[w&&w.id]||0).toLocaleString("en-US")}</b></span></button>`}).join("")}</div></div>`;
}

function playerView(){
  const s=st,me=s.me;let h=`<div class="row" style="justify-content:space-between"><a class="back" href="/">‹ الرئيسية</a><span class="chip gold">${esc(me.name)}</span></div>`;
  if(s.secretName&&!s.record)h+=`<div class="banner">${ICON.lock}<span><b>جلسة سرية:</b> ${esc(s.secretName)} يشوف السجل الحين.</span></div>`;
  if(s.phase==="setup"){
    h+=`<section class="hero" style="margin-top:4px">${hallSVG()}<h1 style="font-size:2.6rem">حياك ${esc(me.name)}</h1><p class="muted">ننطر الحكم يبدا الجلسة.</p></section>`;
    h+=`<div class="panel"><h2>الأعضاء</h2><div class="list" style="margin-top:10px">${s.players.map(p=>`<div class="li"><span class="dot ${p.online?"on":""}"></span><span class="nm">${esc(p.name)}${p.id===me.id?" (أنت)":""}</span></div>`).join("")}</div></div>`;
    h+=archiveHTML();
    return h+`<button class="btn ghost block" style="margin-top:14px" data-a="leave">اطلع من الجلسة</button>`;
  }
  if(s.phase==="over")return h+overView();
  if(s.record&&s.secretName===me.name){
    h+=`<div class="banner">${ICON.lock}<span><b>جلسة سرية:</b> الحكم سمح لك تشوف السجل. لما يسكرها الحكم يختفي.</span></div>`;
    h+=`<div class="panel"><h2>السجل كامل</h2>${recordTable(s.record,s.players,false)}</div>`;
    return h;
  }
  h+=`<div style="text-align:center;margin-top:8px"><h1 style="font-size:2.6rem">الجولة <span class="num">${s.round.no}</span></h1><p class="muted small">من ${fmt(s.round.of)} جولات</p></div>`+roundsStrip();
  if(me.ask){
    const v=calcEval(calcExpr);
    h+=`<div class="panel"><h2>حط مجموع أصواتك</h2><p class="muted small">${me.resigned?"استقلت، اكتب أصواتك اللي بإيدك.":"الجولة خلصت، اكتب أصواتك اللي بإيدك (بدون البدل)."} يروح للحكم يعتمده، ومحد غيره يشوفه.</p><div style="margin-top:10px">${calcHTML()}</div>
    <button class="btn gold block" style="margin-top:10px" data-a="submit" ${v!=null&&v>0?"":"disabled"}>ارسل ${v>0?fmt(v):""} للحكم</button>
    <button class="btn block" style="margin-top:8px" data-a="submitZero">ما عندي ولا صوت</button></div>`;
  }
  else if(me.waiting)h+=`<div class="panel" style="text-align:center">${ICON.box.replace("<svg",'<svg width="40" height="40" style="color:var(--brass)"')}<h2>وصل للحكم</h2><p class="muted">ينطر يعتمد مجموعك.</p></div>`;
  else if(me.done&&me.counting)h+=`<div class="panel" style="text-align:center"><h2>انسجل مجموعك</h2><p class="muted">ننطر ${me.left?`${fmt(me.left)} يحطون مجاميعهم`:"الحكم يبدا الجولة الجاية"}.</p></div>`;
  else if(me.resigned)h+=`<div class="panel" style="text-align:center"><h2>استقلت بهالجولة</h2><p class="muted">مجموعك انسجل، وترجع تلعب الجولة الجاية.</p></div>`;
  else if(me.counting)h+=`<div class="panel" style="text-align:center"><h2>الجولة خلصت</h2><p class="muted">ننطر المستقيلين يحطون مجاميعهم.</p></div>`;
  else h+=`<section class="hero" style="margin-top:6px">${hallSVG()}<p class="muted sub">الجولة شغالة. لما تخلص يطلع لك تحط مجموع أصواتك.</p></section>`;
  return h;
}

  <div class="panel"><h2>الترتيب</h2><div class="list" style="margin-top:10px">${rk.map(p=>`<button class="li" data-a="hist" data-id="${p.id}"><span class="rank ${p.total>0?"r"+p.rank:""}">${p.rank}</span><span class="nm">${esc(p.name)}</span><span class="sc"><b class="num">${p.total.toLocaleString("en-US")}</b></span></button>`).join("")}</div>

  if(st.judge)h+=`<div class="panel"><button class="btn gold block" data-a="again">قيم ثاني</button><p class="muted small" style="margin-top:8px">نفس الأسامي، وتقدر تغيرها. هالقيم ينحفظ بالجلسات السابقة.</p></div>`;

/* ---------- السجل ---------- */
function evLines(r,filterId,players){
  const name=id=>(players.find(p=>p.id===id)||{}).name||"لاعب";
  const cancelled=new Set(r.ev.filter(e=>e.k==="cancel").map(e=>e.target));
  const wiped=id=>r.status==="dissolved"&&!r.resigned.includes(id);
  const out=[];
  for(const e of r.ev){
    if(e.k==="add"&&(!filterId||e.pid===filterId)){const x=cancelled.has(e.id);
      out.push(`<li class="${x?"x":wiped(e.pid)?"wipe":""}"><span class="t">${hm(e.at)}</span><span class="grow">${filterId?"":`<b>${esc(name(e.pid))}</b> `}${e.final?(e.amt===0?"ما عنده ولا صوت":"مجموع أصواته"):e.amt<0?"تصحيح":"جمع"} <b class="num">${e.amt>0?"+":""}${e.amt.toLocaleString("en-US")}</b>${e.calc?` <span class="muted small num">(${esc(e.calc)})</span>`:""}${e.by==="self"?` <span class="muted small">من تلفونه${e.asked!=null&&e.asked!==e.amt?`، كتب ${Number(e.asked).toLocaleString("en-US")}`:""}</span>`:""}${x?` <span class="chip red">انلغى</span>`:""}</span>${!x&&st.judge&&st.phase==="play"&&(r.status==="open"||r.status==="counting")&&!filterId?`<button class="btn sm ghost" data-a="cancel" data-id="${e.id}">الغِ</button>`:""}</li>`)}
    else if(e.k==="swap"&&(!filterId||e.a===filterId||e.b===filterId)){const x=cancelled.has(e.id);const other=filterId?(e.a===filterId?e.b:e.a):null;
      out.push(`<li class="sw ${x?"x":""}"><span class="t">${hm(e.at)}</span><span class="grow">${filterId?`بدل ويا <b>${esc(name(other))}</b>`:`بدل: <b>${esc(name(e.a))}</b> ويا <b>${esc(name(e.b))}</b>`} انضاف <b class="num">${e.total.toLocaleString("en-US")}</b>${filterId?"":" لكل واحد"}${x?` <span class="chip red">انلغى</span>`:""}</span>${!x&&st.judge&&st.phase==="play"&&r.status==="open"&&!filterId?`<button class="btn sm ghost" data-a="cancel" data-id="${e.id}">الغِ</button>`:""}</li>`)}
    else if(e.k==="resign"&&(!filterId||e.pid===filterId))out.push(`<li class="rs"><span class="t">${hm(e.at)}</span><span class="grow"><b>${esc(name(e.pid))}</b> استقال، أصواته محفوظة</span></li>`);
    else if(e.k==="rej"&&st.judge&&(!filterId||e.pid===filterId||e.a===filterId||e.b===filterId))out.push(`<li class="x"><span class="t">${hm(e.at)}</span><span class="grow">${e.kind==="swap"?`بدل ${esc(name(e.a))} ويا ${esc(name(e.b))} بـ${Number(e.total).toLocaleString("en-US")}`:`${esc(name(e.pid))} طلب +${Number(e.amt).toLocaleString("en-US")}`} <span class="chip red">انرفض</span></span></li>`);
  }
  return out;
}
function recordTable(rec,players,filterId){
  let h=`<div class="rec">`;
  rec.rounds.forEach(r=>{
    const lines=evLines(r,filterId,players);
    const sc=filterId?(r.score[filterId]||0):null;
    h+=`<div class="rh"><b>الجولة ${r.no}</b><span class="chip ${r.status==="dissolved"?"red":r.status==="open"?"gold":"green"}">${statusName(r.status)}</span>${filterId?`<span class="grow"></span><b class="num">${sc.toLocaleString("en-US")}</b>`:""}</div>`;
    if(r.status==="dissolved")h+=`<p class="small muted" style="margin-bottom:4px">انحل المجلس: انمسحت أصوات الكل إلا المستقيلين.</p>`;
    h+=lines.length?`<ul>${lines.join("")}</ul>`:`<p class="muted small">ما صار شي.</p>`;
    if(!filterId){const items=players.map(p=>({p,v:r.score[p.id]||0})).filter(x=>x.v).sort((a,b)=>b.v-a.v);if(items.length)h+=`<p class="small muted" style="margin-top:6px">${items.map(x=>`${esc(x.p.name)} ${fmt(x.v)}`).join("، ")}</p>`}
  });
  const t=rec.totals;
  if(filterId)h+=`<div class="tot"><span>المجموع</span><span class="num">${(t[filterId]||0).toLocaleString("en-US")}</span></div>`;
  else h+=`<div class="sep"></div><div class="list">${ranking(rec,players).map(p=>`<div class="li"><span class="rank ${p.total>0?"r"+p.rank:""}">${p.rank}</span><span class="nm">${esc(p.name)}</span><span class="sc"><b class="num">${p.total.toLocaleString("en-US")}</b></span></div>`).join("")}</div>`;
  return h+`</div>`;
}

/* ---------- الشيت ---------- */
function renderSheet(){
  const el=$("#sheet");
  if(!sheet||!st){el.innerHTML="";return}
  let inner="";
  const close=`<button class="btn sm ghost" data-a="closeSheet" aria-label="سكّر">✕</button>`;
  if(sheet.type==="player"){
    const p=P(sheet.id);if(!p){sheet=null;el.innerHTML="";return}
    const res=st.round&&st.round.resigned.includes(p.id);const play=st.phase==="play";
    inner=`<div class="hd"><h2>${esc(p.name)}</h2>${res?`<span class="chip">مستقيل</span>`:""}${close}</div>
    <div class="row"><div class="li grow" style="flex-direction:column;align-items:flex-start;gap:0"><span class="muted small">هالجولة</span><b class="num" style="font-size:1.5rem">${curScore(p.id).toLocaleString("en-US")}</b></div>
    <div class="li grow" style="flex-direction:column;align-items:flex-start;gap:0"><span class="muted small">المجموع</span><b class="num" style="font-size:1.5rem">${(st.record.totals[p.id]||0).toLocaleString("en-US")}</b></div></div>`;
    const needF=play&&((st.counting&&st.counting.need.includes(p.id)&&!st.counting.done[p.id])||(st.resignNeed||[]).includes(p.id));
    if(needF){
      const v=calcEval(calcExpr);
      inner+=`<h3 style="margin-top:14px">حط مجموعه بداله</h3><div style="margin-top:8px">${calcHTML()}</div>
      <div class="row" style="margin-top:10px"><button class="btn gold grow" data-a="finalFor" data-id="${p.id}" ${v!=null&&v>=0&&calcExpr?"":"disabled"}>سجّل ${v!=null&&calcExpr?fmt(v):""}</button><button class="btn" data-a="finalZero" data-id="${p.id}">ولا صوت</button></div>`;
    }
    else if(play&&!res&&st.round.status==="open"){
      inner+=`<h3 style="margin-top:14px">سجّل أصوات جمعها</h3><div style="margin-top:8px">${calcHTML()}</div>
      <div class="row" style="margin-top:10px"><button class="btn gold grow" data-a="addVotes" data-id="${p.id}" ${calcEval(calcExpr)?"":"disabled"}>${(calcEval(calcExpr)||0)<0?"صحّح":"سجّل"} ${calcEval(calcExpr)?fmt(calcEval(calcExpr)):""}</button></div>
      <p class="muted small" style="margin-top:6px">تقدر تكتب رقم بالسالب (مثلاً −100) عشان تصحح غلط، وبيبين بالسجل إنه تصحيح.</p>
      <div class="sep"></div>
      <div class="row"><button class="btn grow" data-a="resign" data-id="${p.id}">${ICON.flag.replace("<svg",'<svg width="18" height="18"')} استقال</button>
      ${st.mode==="players"?`<button class="btn grow" data-a="secret" data-id="${p.id}">${ICON.lock.replace("<svg",'<svg width="18" height="18"')} جلسة سرية</button>`:""}</div>`;
    }
    inner+=`<div class="sep"></div><h3>سجل ${esc(p.name)}</h3>${recordTable(st.record,st.players,p.id)}`;
  }
  else if(sheet.type==="hist"){
    const rec=sheet.arch?sheet.arch:st.record,players=sheet.arch?sheet.arch.players:st.players;
    const p=players.find(x=>x.id===sheet.id);
    inner=`<div class="hd"><h2>سجل ${esc(p?p.name:"")}</h2>${close}</div>${recordTable(rec,players,sheet.id)}`;
  }
  else if(sheet.type==="log"){
    inner=`<div class="hd"><h2>شنو صار باللعبة؟</h2>${close}</div>${recordTable(st.record,st.players,null)}`;
  }
  else if(sheet.type==="arch"){
    const g=st.archive.find(x=>x.id===sheet.id);if(!g){sheet=null;el.innerHTML="";return}
    inner=`<div class="hd"><h2>القيم ${g.no}</h2>${close}</div><p class="muted small">دوس على أي اسم تشوف سجله.</p>
    <div class="list" style="margin-top:10px">${ranking({totals:g.totals},g.players).map(p=>`<button class="li" data-a="archHist" data-g="${g.id}" data-id="${p.id}"><span class="rank ${p.total>0?"r"+p.rank:""}">${p.rank}</span><span class="nm">${esc(p.name)}</span><span class="sc"><b class="num">${p.total.toLocaleString("en-US")}</b></span></button>`).join("")}</div>
    <div class="sep"></div><h3>كل اللي صار</h3>${recordTable({rounds:g.rounds.map(r=>({...r,score:r.final||{}})),totals:g.totals},g.players,null)}`;
  }
  else if(sheet.type==="swap"){
    const step=sheet.a==null?1:sheet.b==null?2:3;

    inner=`<div class="hd"><h2>صار بدل؟</h2>${close}</div>`;
    if(step<3){
      inner+=`<p class="muted">${step===1?"منو بدّل؟ اختار الأول.":`بدّل <b>${esc(nm(sheet.a))}</b> ويا منو؟`}</p><div class="list" style="margin-top:10px">${elig.filter(p=>p.id!==sheet.a).map(p=>`<button class="li" data-a="swapPick" data-id="${p.id}"><span class="nm">${esc(p.name)}</span><span class="sc"><b class="num">${curScore(p.id).toLocaleString("en-US")}</b><small>هالجولة</small></span></button>`).join("")}</div>`;
    }else{
      inner+=`<p><b>${esc(nm(sheet.a))}</b> ويا <b>${esc(nm(sheet.b))}</b></p><p class="muted small">اكتب مجموع البدل، وينضاف لكل واحد منهم. أصواتهم اللي بدلوا فيها تنحط بالأرض.</p>
      <div style="margin-top:10px">${calcHTML()}</div>
      <button class="btn gold block" style="margin-top:10px" data-a="swapSave" ${calcEval(calcExpr)!=null&&calcEval(calcExpr)>=0?"":"disabled"}>سجّل البدل ${calcEval(calcExpr)!=null?fmt(calcEval(calcExpr)):""}</button>
      ${st.mode==="players"?`<button class="btn block" style="margin-top:8px" data-a="swapAsk">خلهم يكتبونه من تلفوناتهم</button>`:""}`;
    }
  }
  else if(sheet.type==="end"){
    const lock=roundLock(st.round.no),last=st.round.no===st.round.of,first=st.round.no===1;
    inner=`<div class="hd"><h2>نهاية الجولة ${st.round.no}</h2>${close}</div><p class="muted small">${last?"هذي آخر جولة، بعدها تطلع النتيجة.":"الأصوات تتسجل وتبدا الجولة اللي بعدها."}</p>
    <div class="list" style="margin-top:12px;gap:10px">
    <button class="li" data-a="end" data-k="sort" ${first?"disabled style='opacity:.4'":""}>${ICON.box.replace("<svg",'<svg width="26" height="26"')}<span class="nm">فرز الأصوات<br><span class="muted small">${first?"ما يصير بالجولة الأولى.":"أحد استخدم كرت الفرز. كل الأصوات تتسجل."}</span></span></button>
    <button class="li" data-a="end" data-k="cards">${ICON.cards.replace("<svg",'<svg width="26" height="26"')}<span class="nm">خلصت الكروت<br><span class="muted small">الكروت اللي بالأرض خلصت. كل الأصوات تتسجل.</span></span></button>
    <button class="li" data-a="end" data-k="dissolve" ${lock?"disabled style='opacity:.4'":""}>${ICON.cross.replace("<svg",'<svg width="26" height="26" style="color:var(--stamp)"')}<span class="nm">حل المجلس<br><span class="muted small">${lock?"ما يصير بالجولة الأولى والأخيرة.":"تنمسح أصوات الكل بهالجولة إلا المستقيلين."}</span></span></button></div>
    <details style="margin-top:14px"><summary class="muted small">تبي تخلص اللعبة قبل وقتها؟</summary><button class="btn block" style="margin-top:8px" data-a="finish">خلص اللعبة الحين وطلّع النتيجة</button></details>`;
  }
  else if(sheet.type==="secret"){
    // الوضع اليدوي: الحكم يوري السجل من تلفونه
    inner=`<div class="hd"><h2>جلسة سرية</h2>${close}</div><p class="muted small">هذا السجل كامل، ورّه للي استخدم الكرت.</p>${recordTable(st.record,st.players,null)}`;
  }
  else if(sheet.type==="secretPick"){
    inner=`<div class="hd"><h2>جلسة سرية</h2>${close}</div><p class="muted">منو استخدم الكرت؟ يطلع له السجل كامل بتلفونه لين تسكره أنت، والكل يدري.</p>
    <div class="list" style="margin-top:10px">${st.players.map(p=>`<button class="li" data-a="secret" data-id="${p.id}"><span class="dot ${p.online?"on":""}"></span><span class="nm">${esc(p.name)}</span></button>`).join("")}</div>
    <div class="sep"></div><button class="btn block" data-a="secretLocal">أوريه من تلفوني</button>`;
  }
  else if(sheet.type==="swapAskMe"){
    inner=`<div class="hd"><h2>بدل ويا ${esc(st.me.swapAsk.with)}</h2></div><p class="muted">الحكم يبيكم تكتبون مجموع البدل (أصواتك وأصواته مع بعض). ينضاف لكل واحد منكم.</p><div style="margin-top:10px">${calcHTML()}</div>
    <button class="btn gold block" style="margin-top:10px" data-a="swapTotal" ${calcEval(calcExpr)!=null&&calcEval(calcExpr)>=0?"":"disabled"}>ارسل المجموع ${calcEval(calcExpr)!=null?fmt(calcEval(calcExpr)):""}</button>`;
  }
  else if(sheet.type==="rename"){
    const p=P(sheet.id);
    inner=`<div class="hd"><h2>غيّر الاسم</h2>${close}</div><form data-f="rename" data-id="${sheet.id}" class="row"><input name="name" maxlength="24" value="${esc(p?p.name:"")}" class="grow" required><button class="btn gold">حفظ</button></form>`;
  }
  else if(sheet.type==="confirm"){
    inner=`<div class="hd"><h2>${esc(sheet.title)}</h2>${close}</div><p class="muted">${esc(sheet.text)}</p><div class="row" style="margin-top:14px"><button class="btn ${sheet.red?"red":"gold"} grow" data-a="confirmYes">${esc(sheet.yes)}</button><button class="btn" data-a="closeSheet">لا</button></div>`;
  }
  const scroll=el.querySelector(".box")?el.querySelector(".box").scrollTop:0;
  el.innerHTML=`<div class="sheet" data-a="bg"><div class="box" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
  const b=el.querySelector(".box");if(b)b.scrollTop=scroll;
}

/* ---------- الشريط تحت ---------- */
function renderDock(){
  const d=$("#dock");
  if(view!=="game"||!st||!st.judge||st.phase!=="play"){d.innerHTML="";return}
  const ic=k=>ICON[k];
  const cnt=st.round.status==="counting";
  d.innerHTML=`<div class="dock"><div class="in">
  <button class="btn" data-a="swapOpen" ${cnt?"disabled":""}>${ic("swap")}صار بدل؟</button>
  <button class="btn" data-a="secretOpen">${ic("lock")}جلسة سرية</button>
  <button class="btn" data-a="log">${ic("book")}السجل</button>
  <button class="btn gold" data-a="endOpen" ${cnt?"disabled":""}>${ic("gavel")}نهاية الجولة</button></div></div>`;
}

/* ---------- الحركات ---------- */
const fxQ=[];let fxBusy=false,fxT;
function playFx(e){fxQ.push(e);if(!fxBusy)nextFx()}
function nextFx(){
  let e=fxQ.shift();const el=$("#fx");
  // نهاية الجولة اللي فيها جمع مجاميع: نفس حركة الفرز أو الكروت أو الحل
  if(e&&e.type==="count")e={...e,type:e.kind,sub:e.kind==="dissolve"?"ننطر مجموع المستقيلين.":"حطوا مجموع أصواتكم."};
  if(!e){fxBusy=false;el.innerHTML="";return}
  fxBusy=true;let cls="",html="",dur=3200;
  if(e.type==="round"){cls="fx-round";dur=3000;html=`${gavelSVG()}<div class="big">الجولة ${e.no}</div><div class="sub">من ${e.of} جولات${e.no===1?"، وما فيها فرز ولا حل":e.no===e.of?"، وما فيها حل مجلس":""}</div>`}
  else if(e.type==="sort"){dur=3600;html=`<div class="box3">${[0,1,2,3,4].map(i=>`<i style="--x:${(i-2)*40}px;--r:${(i-2)*18}deg;animation-delay:${i*.18}s"></i>`).join("")}<svg viewBox="0 0 180 130"><rect x="10" y="20" width="160" height="110" rx="8" fill="#1d4a3a" stroke="#c9a35b" stroke-width="3"/><rect x="58" y="12" width="64" height="12" rx="3" fill="#06100d" stroke="#c9a35b" stroke-width="2"/><rect x="40" y="60" width="100" height="30" rx="4" fill="#efe6cf"/><text x="90" y="81" text-anchor="middle" font-family="Almarai" font-weight="800" font-size="16" fill="#2a2116">أصوات</text></svg></div><div class="big">فرز الأصوات</div><div class="sub">${e.sub||(e.then==="over"?"خلصت آخر جولة.":`الجولة ${e.no} انسجلت، وتبدا الجولة ${e.next}.`)}</div>`}
  else if(e.type==="cards"){dur=3400;html=`<div class="fall">${Array.from({length:14},(_,i)=>`<i style="left:${(i*7.3+3)%96}%;--r:${(i%2?1:-1)*(120+i*20)}deg;animation-delay:${(i*.09).toFixed(2)}s"></i>`).join("")}</div><div class="big">خلصت الكروت</div><div class="sub">${e.sub||(e.then==="over"?"خلصت آخر جولة.":`الجولة ${e.no} انسجلت، وتبدا الجولة ${e.next}.`)}</div>`}
  else if(e.type==="dissolve"){cls="fx-dissolve";dur=4200;html=`<div class="stamp">حُلّ<br>المجلس</div><div class="seatsdim">${Array.from({length:9},(_,i)=>`<span style="animation-delay:${(1.1+i*.08).toFixed(2)}s"></span>`).join("")}</div><div class="sub">أصوات الجولة ${e.no} انمسحت إلا المستقيلين.${e.sub?" "+e.sub:""}</div>`}
  else if(e.type==="resign"){dur=3400;html=`<div class="tear"><span class="r"></span><span class="l"></span></div><div class="big" style="font-size:2.6rem">${esc(e.name)} استقال</div><div class="sub">أصواته محفوظة بهالجولة.</div>`}
  else if(e.type==="swap"){cls="fx-swap";dur=3400;html=`<div class="swap"><div class="c a">${esc(e.a)}</div><div class="c b">${esc(e.b)}</div></div><div class="big">بدل!</div><div class="sub">${esc(e.a)} ويا ${esc(e.b)}</div>`}
  else if(e.type==="secret"){cls="fx-secret";dur=3200;html=`<span class="cur r"></span><span class="cur l"></span><div class="inner">${ICON.lock}<div class="big">جلسة سرية</div><div class="sub" style="color:#ffd9c8">${esc(e.name)} يشوف السجل الحين</div></div>`}
  else if(e.type==="over"){dur=4200;html=`<div class="fall conf">${Array.from({length:26},(_,i)=>`<i style="left:${(i*3.9+1)%98}%;--r:${(i%2?1:-1)*(200+i*15)}deg;animation-delay:${(i*.06).toFixed(2)}s"></i>`).join("")}</div>${gavelSVG()}<div class="big">انتهت الجلسة</div><div class="sub">النتيجة طلعت.</div>`}
  else if(e.type==="again"){dur=2400;html=`${gavelSVG()}<div class="big">قيم ثاني</div>`}
  else{nextFx();return}
  if(e.then==="over"&&e.type!=="over")fxQ.unshift({type:"over"});
  el.innerHTML=`<div class="fx ${cls}" data-a="skipFx" role="status">${html}<span class="tap">دوس عشان تكمل</span></div>`;
  buzz(e.type==="dissolve"?[80,40,160]:30);
  clearTimeout(fxT);fxT=setTimeout(nextFx,dur);
}
function gavelSVG(){return`<svg class="gavel" viewBox="0 0 150 120" aria-hidden="true"><ellipse class="ring" cx="60" cy="104" rx="30" ry="6" fill="none" stroke="#ecd29a" stroke-width="2"/><rect x="28" y="100" width="64" height="14" rx="4" fill="#5a3b1f"/><rect x="34" y="96" width="52" height="6" rx="2" fill="#7a5130"/><g class="hammer"><rect x="58" y="88" width="64" height="9" rx="4" fill="#8a5a33" transform="rotate(-38 118 96)"/><g transform="rotate(-38 118 96)"><rect x="40" y="70" width="34" height="44" rx="6" fill="#6b4224"/><rect x="38" y="76" width="38" height="6" fill="#c9a35b"/><rect x="38" y="102" width="38" height="6" fill="#c9a35b"/></g></g></svg>`}

/* ---------- الأوامر ---------- */
async function create(mode){
  if(busy)return;busy=true;render();
  try{const r=await fetch("/api/parl/create?mode="+mode,{method:"POST"});const j=await r.json();if(!r.ok)throw new Error(j.error);
    sess={code:j.code,token:j.token,judge:true};lsSet("parl.sess",sess);homeErr="";view="wait";connect()}
  catch(e){toast(e.message||"ما في إنترنت؟ جرّب مرة ثانية.")}
  busy=false;render();
}
async function joinCode(code){
  code=en(code).replace(/\D/g,"");
  if(code.length!==4){toast("رقم الغرفة 4 أرقام");return}
  busy=true;render();
  try{const j=await (await fetch("/api/parl/exists?code="+code)).json();
    if(!j.ok){toast("ما في جلسة بهالرقم، تأكد من الحكم.");busy=false;render();return}
    if(j.mode==="manual"){toast("هالجلسة الحكم يسجل فيها بروحه، ما تحتاج تدخل.");busy=false;render();return}
    sess={code,token:null};lsSet("parl.sess",sess);view="wait";connect();
  }catch{toast("ما في إنترنت؟ جرّب مرة ثانية.")}
  busy=false;render();
}
function ask(title,text,yes,fn,red){sheet={type:"confirm",title,text,yes,fn,red};renderSheet()}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  if(a==="bg"){if(ev.target===t){sheet=null;renderSheet()}return}
  if(a==="skipFx"){clearTimeout(fxT);nextFx();return}
  if(a==="ck"){calcKey(t.dataset.k);return}
  switch(a){
    case "goMode":view="mode";homeErr="";render();break;
    case "goJoin":view="join";homeErr="";render();setTimeout(()=>{const i=document.querySelector("input[name=code]");i&&i.focus()},50);break;
    case "home":view="home";render();break;
    case "create":create(t.dataset.m);break;
    case "leave":ask("تطلع من الجلسة؟","بترجع تحتاج رقم الغرفة عشان تدخل.","اطلع",()=>endSession(""));break;
    case "share":{const url=t.dataset.url;const data={title:"تسجيل برلمان",text:`تعال سجّل بالبرلمان، رقم الغرفة ${st.code}`,url};
      if(navigator.share)navigator.share(data).catch(()=>{});else navigator.clipboard.writeText(url).then(()=>toast("نسخت الرابط، الصقه للربع"),()=>toast(url));break}
    case "move":send({t:"move",id,dir:Number(t.dataset.d)});break;
    case "rename":sheet={type:"rename",id};renderSheet();setTimeout(()=>{const i=document.querySelector("#sheet input");i&&i.select()},60);break;
    case "remove":ask(`تشيل ${nm(id)}؟`,"ينشال من الجلسة.","شيله",()=>send({t:"remove",id}),true);break;
    case "start":send({t:"start"});break;
    case "seat":if(st.phase==="over"){sheet={type:"hist",id};renderSheet();break}if(!st.judge)break;calcExpr="";sheet={type:"player",id};renderSheet();break;
    case "addVotes":{const v=calcEval(calcExpr);if(!v)break;send({t:"add",id,amt:v,calc:/[+\-×]/.test(calcExpr.slice(1))?calcExpr:""});calcExpr="";toast(`${v<0?"انصحح":"انسجل"} ${Math.abs(v).toLocaleString("en-US")} لـ${nm(id)}`);break}
    case "resign":ask(`${nm(id)} استقال؟`,(st.mode==="players"?"يطلع له يحط مجموع أصواته، وتنحفظ حتى لو انحل المجلس. وينتهي دوره بهالجولة.":"أصواته بهالجولة تنحفظ حتى لو انحل المجلس، وما يقدر يسجل أكثر لين الجولة الجاية."),"إي استقال",()=>{send({t:"resign",id});sheet=null},false);break;
    case "secret":send({t:"secret",id});sheet=null;renderSheet();break;
    case "secretOpen":sheet=st.mode==="players"?{type:"secretPick"}:{type:"secret"};renderSheet();break;
    case "secretLocal":sheet={type:"secret"};renderSheet();break;
    case "secretClose":send({t:"secretClose"});break;
    case "approve":send({t:"approve",id});break;
    case "reject":send({t:"reject",id});break;
    case "unsubmit":send({t:"unsubmit",id});break;
    case "cancel":ask("تلغي هالإدخال؟","ينحسب كأنه ما صار، ويبين بالسجل إنه انلغى.","الغِ",()=>{send({t:"cancel",id});sheet={type:"log"}},true);break;
    case "swapOpen":calcExpr="";sheet={type:"swap",a:null,b:null};renderSheet();break;
    case "swapPick":if(sheet.a==null)sheet.a=id;else{sheet.b=id;calcExpr=""}renderSheet();break;
    case "swapSave":{const v=calcEval(calcExpr);if(v==null)break;send({t:"swap",a:sheet.a,b:sheet.b,total:v});sheet=null;calcExpr="";renderSheet();break}
    case "swapAsk":send({t:"swapAsk",a:sheet.a,b:sheet.b});toast("طلبت منهم يكتبون المجموع");sheet=null;renderSheet();break;
    case "swapTotal":{const v=calcEval(calcExpr);if(v==null)break;send({t:"swapTotal",total:v});sheet=null;calcExpr="";break}
    case "submit":{const v=calcEval(calcExpr);if(!(v>0))break;send({t:"submit",amt:v,calc:/[+\-×]/.test(calcExpr.slice(1))?calcExpr:""});break}
    case "submitZero":ask("ما عندك ولا صوت؟","يروح للحكم إن مجموعك صفر.","إي، صفر",()=>send({t:"submit",amt:0}));break;
    case "finalFor":{const v=calcEval(calcExpr);if(v==null||v<0)break;send({t:"final",id,amt:v,calc:/[+\-×]/.test(calcExpr.slice(1))?calcExpr:""});calcExpr="";sheet=null;renderSheet();toast(`انسجل مجموع ${nm(id)}`);break}
    case "finalZero":send({t:"final",id,amt:0});sheet=null;renderSheet();toast(`${nm(id)}: ولا صوت`);break;
    case "nextRound":send({t:"nextRound"});break;
    case "endOpen":sheet={type:"end"};renderSheet();break;
    case "end":{const k=t.dataset.k;const n={sort:"فرز الأصوات",cards:"خلصت الكروت",dissolve:"حل المجلس"}[k];
      ask(n+"؟",k==="dissolve"?"تنمسح أصوات الجولة لكل الأعضاء إلا المستقيلين، وتبدا الجولة اللي بعدها.":(st.mode==="players"?"كل لاعب يطلع له يحط مجموع أصواته، وبعد ما تعتمدها كلها تبدا الجولة اللي بعدها.":"أصوات الجولة تتسجل، وتبدا الجولة اللي بعدها."),n,()=>{send({t:"end",kind:k});sheet=null},k==="dissolve");break}
    case "finish":ask("تخلص اللعبة الحين؟","الجولة المفتوحة تتسجل، وتطلع النتيجة.","خلصها",()=>{send({t:"finish"});sheet=null});break;
    case "log":sheet={type:"log"};renderSheet();break;
    case "hist":sheet={type:"hist",id};renderSheet();break;
    case "arch":sheet={type:"arch",id};renderSheet();break;
    case "archHist":{const g=st.archive.find(x=>x.id===t.dataset.g);sheet={type:"hist",id,arch:{rounds:g.rounds.map(r=>({...r,score:r.final||{}})),totals:g.totals,players:g.players}};renderSheet();break}
    case "again":ask("قيم ثاني؟","هالقيم ينحفظ بالجلسات السابقة، وتقدر تغير الأسامي قبل لا تبدا.","قيم ثاني",()=>{send({t:"again"});sheet=null});break;
    case "closeRoom":ask("تسكّر الغرفة؟","كل السجل والجلسات السابقة تنمسح، والكل يطلع.","سكّرها",()=>{send({t:"closeRoom"});sheet=null},true);break;
    case "closeSheet":sheet=null;renderSheet();break;
    case "confirmYes":{const fn=sheet.fn;sheet=null;renderSheet();fn&&fn();break}
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g[data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}if(e.key==="Escape"&&sheet){sheet=null;renderSheet()}});
document.addEventListener("submit",ev=>{
  const f=ev.target;ev.preventDefault();const fd=new FormData(f);
  switch(f.dataset.f){
    case "join":joinCode(fd.get("code"));break;
    case "name":{const n=String(fd.get("name")||"").trim();if(n)send({t:"join",name:n});break}
    case "addName":{const n=String(fd.get("name")||"").trim();if(n){send({t:"addName",name:n});f.reset();setTimeout(()=>{const i=document.querySelector("input[name=name]");i&&i.focus()},80)}break}
    case "rename":send({t:"rename",id:f.dataset.id,name:fd.get("name")});sheet=null;renderSheet();break;
    case "approve":send({t:"approve",id:f.dataset.id,amt:Number(en(fd.get("amt")).replace(/[^\d]/g,""))});break;
  }
});

/* اللاعب يطلع له سؤال البدل لما الحكم يطلبه */
const _render=render;
render=function(){_render();if(st&&st.me&&st.me.swapAsk&&(!sheet||sheet.type!=="swapAskMe")&&st.phase==="play"){calcExpr="";sheet={type:"swapAskMe"};renderSheet()}else if(sheet&&sheet.type==="swapAskMe"&&!(st&&st.me&&st.me.swapAsk)){sheet=null;renderSheet()}};

/* ---------- البداية ---------- */
const linkCode=(new URLSearchParams(location.search).get("r")||"").replace(/\D/g,"");
if(linkCode)try{history.replaceState(null,"",location.pathname)}catch{}
if(linkCode&&(!sess||sess.code!==linkCode)){sess=null;lsSet("parl.sess",null);joinCode(linkCode)}
else if(sess){view="wait";connect()}
render();
</script>
